<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>M3U8 播放器 · 支持标记 · 智能解码</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#0a0c11;
    --panel:#141824;
    --panel-2:#1b2130;
    --line:#262d40;
    --text:#e9edf6;
    --muted:#8a93a8;
    --accent:#4d8dff;
    --accent-2:#7db0ff;
    --gold:#ffd166;
    --danger:#ff5f5f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1100px 520px at 50% -12%,#16203a 0%,var(--bg) 62%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }

  .app{
    max-width:960px;
    margin:0 auto;
    padding:12px 12px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;
  }

  /* ---------- 顶部 URL ---------- */
  .urlbar{display:flex;gap:8px;}
  .urlbar input{
    flex:1;min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    padding:12px 14px;
    font-size:15px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .urlbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,141,255,.15);}
  .urlbar input::placeholder{color:var(--muted);}
  .btn-primary{
    flex:none;border:none;border-radius:12px;padding:0 20px;
    font-size:15px;font-weight:600;color:#fff;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));
    cursor:pointer;transition:transform .1s,filter .15s;
    box-shadow:0 4px 14px rgba(77,141,255,.28);
  }
  .btn-primary:active{transform:scale(.97);filter:brightness(.9);}

  /* ---------- 播放器 ---------- */
  .player{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
    user-select:none;-webkit-user-select:none;
  }
  .player:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  .player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  .player:-moz-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  .player:-ms-fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000;}

  .big-play{
    position:absolute;inset:0;display:grid;place-items:center;
    color:rgba(255,255,255,.92);pointer-events:none;
    opacity:0;transition:opacity .2s;
    background:radial-gradient(circle at center,rgba(0,0,0,.35),transparent 62%);
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));
  }
  .big-play.show{opacity:1;}

  .loading{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.32);z-index:5;
    transition:opacity .18s;
  }
  .loading[hidden]{display:none;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .ctrls{
    position:absolute;left:0;right:0;bottom:0;z-index:4;
    padding:32px 12px 8px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));
    transition:opacity .25s,transform .25s;
  }
  .ctrls.hidden{opacity:0;transform:translateY(10px);pointer-events:none;}

  .progress{
    position:relative;height:24px;display:flex;align-items:center;
    cursor:pointer;touch-action:none;
  }
  .track,.bar-buffer,.bar-played{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:4px;border-radius:99px;
  }
  .track{right:0;background:rgba(255,255,255,.2);}
  .bar-buffer{background:rgba(255,255,255,.32);width:0;}
  .bar-played{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    width:0;box-shadow:0 0 10px rgba(77,141,255,.65);
  }
  .bar-thumb{
    position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px rgba(77,141,255,.35);
    opacity:0;transition:opacity .15s;
  }
  .player:hover .bar-thumb,.progress.dragging .bar-thumb{opacity:1;}
  .bar-marks{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:16px;pointer-events:none;
  }
  .bar-marks i{
    position:absolute;top:0;width:2px;height:16px;border-radius:2px;
    background:var(--gold);transform:translateX(-1px);
    box-shadow:0 0 7px rgba(255,209,102,.85);
  }

  .ctrl-row{display:flex;align-items:center;gap:4px;margin-top:2px;}
  .icon-btn{
    background:transparent;border:none;color:#fff;cursor:pointer;
    width:38px;height:38px;border-radius:10px;
    display:grid;place-items:center;transition:background .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.13);}
  .icon-btn svg{width:20px;height:20px;}
  .time{
    font-variant-numeric:tabular-nums;font-size:12px;
    color:rgba(255,255,255,.85);margin-left:4px;white-space:nowrap;
  }
  .grow{flex:1;}
  select.speed{
    -webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.13);color:#fff;border:none;
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;
    cursor:pointer;outline:none;font-variant-numeric:tabular-nums;
  }
  select.speed option{background:#1b2130;color:#fff;}

  /* ---------- 工具栏 ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;}

  .pill-btn{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    padding:11px 13px;border-radius:12px;border:1px solid transparent;
    font-size:13px;font-weight:700;cursor:pointer;
    user-select:none;-webkit-user-select:none;white-space:nowrap;
    transition:transform .1s,background .15s,box-shadow .2s;
    font-family:inherit;
  }
  .pill-btn:active{transform:scale(.95);}
  .pill-btn svg{width:16px;height:16px;flex:none;}

  .flag-btn{
    color:var(--gold);
    border-color:rgba(255,209,102,.38);
    background:linear-gradient(180deg,rgba(255,209,102,.2),rgba(255,209,102,.07));
  }
  .flag-btn.pulse{box-shadow:0 0 0 6px rgba(255,209,102,.22);}

  .decoder-btn{
    color:var(--accent-2);
    border-color:rgba(77,141,255,.42);
    background:linear-gradient(180deg,rgba(77,141,255,.22),rgba(77,141,255,.07));
  }
  .decoder-btn.pulse{box-shadow:0 0 0 6px rgba(77,141,255,.22);}

  .search{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:0 12px;height:44px;
    transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--accent);}
  .search svg{width:16px;height:16px;color:var(--muted);flex:none;}
  .search input{
    flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--text);font-size:14px;height:100%;
  }
  .search input::placeholder{color:var(--muted);}

  /* ---------- 标记列表 ---------- */
  .marks{display:flex;flex-direction:column;gap:8px;}
  .mark-item{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:pan-y;
    transition:background .15s,border-color .15s,transform .08s;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-5px);}}
  .mark-item:hover{background:var(--panel-2);border-color:#33405c;}
  .mark-item:active{transform:scale(.99);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.75);}
  .m-time{
    flex:none;font-variant-numeric:tabular-nums;
    font-size:13px;font-weight:800;color:var(--gold);
    background:rgba(255,209,102,.13);border-radius:7px;padding:3px 9px;
  }
  .m-title{
    flex:1;min-width:0;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .m-del{
    flex:none;width:36px;height:36px;display:grid;place-items:center;
    border:none;border-radius:10px;background:transparent;color:var(--muted);
    cursor:pointer;transition:background .15s,color .15s;
    touch-action:manipulation;
  }
  .m-del:hover{background:rgba(255,95,95,.14);color:var(--danger);}
  .m-del svg{width:17px;height:17px;}

  .empty{
    text-align:center;color:var(--muted);font-size:13px;
    padding:26px 16px;border:1px dashed var(--line);border-radius:12px;line-height:1.7;
  }

  /* ---------- 弹出菜单 ---------- */
  .menu{
    position:fixed;z-index:999;min-width:152px;
    background:#1b2130;border:1px solid var(--line);
    border-radius:12px;padding:6px;
    box-shadow:0 14px 36px rgba(0,0,0,.6);
    animation:pop .14s ease;
  }
  .menu button{
    display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:14px;padding:10px 12px;border-radius:8px;
    cursor:pointer;transition:background .12s;font-family:inherit;
  }
  .menu button:hover{background:rgba(255,255,255,.08);}
  .menu button.danger{color:var(--danger);}

  /* 解码菜单 */
  .decoder-menu{
    min-width:246px;max-width:90vw;
    max-height:min(72vh,480px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .menu-title{
    font-size:11px;font-weight:800;color:var(--muted);
    padding:8px 12px 6px;letter-spacing:.08em;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .menu-title .badge{
    font-size:10px;font-weight:700;color:var(--accent-2);
    background:rgba(77,141,255,.15);border-radius:6px;padding:2px 6px;
    letter-spacing:0;
  }
  .decoder-menu button.decoder-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:9px 12px;
  }
  .decoder-item .d-name{
    font-size:13.5px;font-weight:700;color:var(--text);
    display:flex;align-items:center;gap:6px;line-height:1.3;
  }
  .decoder-item .d-desc{
    font-size:11px;color:var(--muted);line-height:1.35;
  }
  .decoder-item.active{background:rgba(77,141,255,.15);}
  .decoder-item.active .d-name{color:var(--accent-2);}
  .decoder-item:disabled{opacity:.35;cursor:not-allowed;}
  .decoder-item:disabled:hover{background:none;}
  .d-check{font-size:12px;color:var(--accent-2);}
  .menu-sep{
    height:1px;background:var(--line);margin:6px 8px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);
    background:rgba(28,34,50,.97);border:1px solid var(--line);
    color:var(--text);padding:10px 20px;border-radius:99px;
    font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:1000;
    max-width:82vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">

  <div class="urlbar">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="输入 M3U8 / 视频链接…">
    <button id="loadBtn" class="btn-primary">播放</button>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline webkit-playsinline x5-playsinline preload="metadata"></video>

    <div class="big-play" id="bigPlay">
      <svg viewBox="0 0 24 24" width="60" height="60" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="loading" id="loading" hidden><div class="spinner"></div></div>

    <div class="ctrls" id="ctrls">
      <div class="progress" id="progress">
        <div class="track"></div>
        <div class="bar-buffer" id="barBuffer"></div>
        <div class="bar-played" id="barPlayed"></div>
        <div class="bar-marks" id="barMarks"></div>
        <div class="bar-thumb" id="barThumb"></div>
      </div>
      <div class="ctrl-row">
        <button class="icon-btn" id="playBtn" title="播放 / 暂停"></button>
        <span class="time" id="timeLabel">00:00 / 00:00</span>
        <div class="grow"></div>
        <select class="speed" id="speedSelect" title="播放倍速"></select>
        <button class="icon-btn" id="pipBtn" title="画中画"></button>
        <button class="icon-btn" id="fsBtn" title="全屏 / 横屏"></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="pill-btn flag-btn" id="flagBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
      <span>标记</span>
    </button>

    <button class="pill-btn decoder-btn" id="decoderBtn" title="切换解码方案">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>
      </svg>
      <span>解码</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索标记名称 / 时间…" autocomplete="off">
    </div>
  </div>

  <div class="marks" id="marksList"></div>
  <div class="empty" id="emptyTip">还没有标记 · 点击上方 🏳 旗子即可标记当前时间</div>

</div>

<div class="menu" id="menu" hidden>
  <button data-act="seek">⏱ 跳转到此处</button>
  <button data-act="rename">✏️ 重命名</button>
  <button data-act="delete" class="danger">🗑 删除</button>
</div>

<div class="menu decoder-menu" id="decoderMenu" hidden></div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============ 图标 ============ */
  var ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  var ICON_PIP   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>';
  var ICON_FS    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  var ICON_FS_OUT= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

  /* ============ 元素 ============ */
  var $ = function (id) { return document.getElementById(id); };
  var video       = $('video');
  var player      = $('player');
  var urlInput    = $('urlInput');
  var loadBtn     = $('loadBtn');
  var loading     = $('loading');
  var bigPlay     = $('bigPlay');
  var ctrls       = $('ctrls');
  var progress    = $('progress');
  var barBuffer   = $('barBuffer');
  var barPlayed   = $('barPlayed');
  var barMarks    = $('barMarks');
  var barThumb    = $('barThumb');
  var playBtn     = $('playBtn');
  var timeLabel   = $('timeLabel');
  var speedSel    = $('speedSelect');
  var pipBtn      = $('pipBtn');
  var fsBtn       = $('fsBtn');
  var flagBtn     = $('flagBtn');
  var decoderBtn  = $('decoderBtn');
  var searchInput = $('searchInput');
  var marksList   = $('marksList');
  var emptyTip    = $('emptyTip');
  var menu        = $('menu');
  var decoderMenu = $('decoderMenu');
  var toastEl     = $('toast');

  playBtn.innerHTML = ICON_PLAY;
  bigPlay.innerHTML = ICON_PLAY;
  pipBtn.innerHTML  = ICON_PIP;
  fsBtn.innerHTML   = ICON_FS;

  /* ============ 环境检测（一次） ============ */
  var ENV = (function () {
    var ua = navigator.userAgent || '';
    var platform = navigator.platform || '';
    var maxTouch = navigator.maxTouchPoints || 0;
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (platform === 'MacIntel' && maxTouch > 1);
    var isAndroid = /Android/i.test(ua);
    var isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Chromium|Edg|OPR|FxiOS/i.test(ua);
    var isChrome = /Chrome|CriOS/i.test(ua) && !/Edg|OPR/i.test(ua);
    var isFirefox = /Firefox|FxiOS/i.test(ua);
    var isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);
    var isDesktop = !isMobile;

    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var effectiveType = conn ? (conn.effectiveType || '') : '';
    var saveData = !!(conn && conn.saveData);
    var downlink = (conn && typeof conn.downlink === 'number') ? conn.downlink : 0;

    var cores = navigator.hardwareConcurrency || 4;
    var memory = navigator.deviceMemory || 4;
    var lowEnd = cores <= 2 || memory <= 2;
    var highEnd = cores >= 8 && memory >= 4;

    var nativeHls = video.canPlayType('application/vnd.apple.mpegurl') || '';
    var nativeHlsOk = nativeHls === 'maybe' || nativeHls === 'probably';

    var hlsJsOk = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());

    return {
      ua: ua,
      isIOS: isIOS,
      isAndroid: isAndroid,
      isSafari: isSafari,
      isChrome: isChrome,
      isFirefox: isFirefox,
      isMobile: isMobile,
      isDesktop: isDesktop,
      effectiveType: effectiveType,
      saveData: saveData,
      downlink: downlink,
      cores: cores,
      memory: memory,
      lowEnd: lowEnd,
      highEnd: highEnd,
      nativeHlsOk: nativeHlsOk,
      hlsJsOk: hlsJsOk
    };
  })();

  /* ============ 解码器预设 ============ */
  var DECODERS = {
    auto: {
      name: '自动（智能推荐）',
      desc: '根据设备、网络、浏览器自动选择最佳方案',
      auto: true
    },
    hardware: {
      name: '硬件加速优先',
      desc: 'GPU 硬解，省电发热低，适合高分片源',
      hls: {
        enableWorker: true,
        lowLatencyMode: false,
        enableSoftwareAES: false,
        capLevelToPlayerSize: true,
        progressive: false,
        testBandwidth: true,
        startLevel: -1,
        abrEwmaDefaultEstimate: 800000
      }
    },
    software: {
      name: '软件解码',
      desc: '主线程软解，兼容怪编码',
      hls: {
        enableWorker: false,
        lowLatencyMode: false,
        enableSoftwareAES: true,
        progressive: true,
        startLevel: -1
      }
    },
    lowlatency: {
      name: '低延迟直播',
      desc: '极限小缓冲，适合直播；网络差可能卡顿',
      hls: {
        enableWorker: true,
        lowLatencyMode: true,
        maxBufferLength: 6,
        backBufferLength: 0,
        liveSyncDurationCount: 1,
        maxLiveSyncPlaybackRate: 1.5,
        liveDurationInfinity: true,
        startLevel: -1
      }
    },
    smooth: {
      name: '流畅优先',
      desc: '加大缓冲区，减少卡顿，适合点播长片',
      hls: {

    if (ENV.effectiveType === 'slow-2g' || ENV.effectiveType === '2g') return 'lowpower';

    // 低端设备 → 兼容
    if (ENV.lowEnd) return 'compat';

    // 3G 网络
    if (ENV.effectiveType === '3g') {
      return ENV.isMobile ? 'mobile' : 'compat';

      if (ENV.downlink && ENV.downlink < 1.5) return 'lowpower';
      if (ENV.highEnd && (!ENV.downlink || ENV.downlink > 5)) return 'hardware';
      return 'mobile';
    }

    // 桌面
    if (ENV.highEnd && (ENV.effectiveType === '4g' || !ENV.effectiveType)) {

    if (ENV.effectiveType === '4g') return 'smooth';

    var useHlsJs = !isDirectFile && ENV.hlsJsOk && !decoder.native;

      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (e) {}

      var exit = document.exitFullscreen ||
                 document.webkitExitFullscreen ||
                 document.webkitCancelFullScreen ||
                 document.mozCancelFullScreen ||
                 document.msExitFullscreen;
      if (exit) {
        try {
          var p2 = exit.call(document);
          if (p2 && typeof p2.catch === 'function') p2.catch(function () {});
        } catch (e) {}
      }

      // iOS Safari 全屏退出
      if (video.webkitDisplayingFullscreen) {
        try { video.webkitExitFullscreen(); } catch (e) {}
      }
    }

    // 延迟更新图标（等待全屏状态真正切换）
    setTimeout(updateFsIcon, 120);
  }

  fsBtn.addEventListener('click', toggleFullscreen);

  // 监听全屏状态变化
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
    .forEach(function (ev) {
      document.addEventListener(ev, function () {
        updateFsIcon();
        // 全屏后如果之前在播放，保持播放
        if (isFullscreen() && wasPlayingBeforeLoad && video.paused) {
          video.play().catch(function () {});
        }
      });
    });

  // iOS video 全屏事件
  video.addEventListener('webkitbeginfullscreen', updateFsIcon);
  video.addEventListener('webkitendfullscreen', updateFsIcon);

  /* ============ 标记：增删改查 ============ */
  function renderBarMarks() {
    barMarks.innerHTML = '';
    var d = video.duration;
    if (!isFinite(d) || d <= 0) return;
    marks.forEach(function (m) {
      var i = document.createElement('i');
      i.style.left = Math.min(100, Math.max(0, (m.time / d) * 100)) + '%';
      barMarks.appendChild(i);
    });
  }

  function renderMarks() {
    var q = searchInput.value.trim().toLowerCase();
    marksList.innerHTML = '';

    if (marks.length === 0) {
      emptyTip.hidden = false;
      emptyTip.textContent = '还没有标记 · 点击上方 🏳 旗子即可标记当前时间';
      return;
    }
    emptyTip.hidden = true;

    var list = q
      ? marks.filter(function (m) {
          return (m.title || '').toLowerCase().indexOf(q) >= 0 ||
                 fmt(m.time).toLowerCase().indexOf(q) >= 0;
        })
      : marks;

    if (list.length === 0) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '没有找到与「' + q + '」相关的标记';
      marksList.appendChild(d);
      return;
    }

    list.forEach(function (m) { marksList.appendChild(buildMarkEl(m)); });
  }

  function buildMarkEl(m) {
    var el = document.createElement('div');
    el.className = 'mark-item';

    var dot = document.createElement('span');
    dot.className = 'dot';

    var time = document.createElement('span');
    time.className = 'm-time';
    time.textContent = fmt(m.time);

    var title = document.createElement('span');
    title.className = 'm-title';
    title.textContent = m.title || '未命名标记';

    var del = document.createElement('button');
    del.className = 'm-del';
    del.type = 'button';
    del.title = '点击删除 · 长按清空全部';
    del.innerHTML = ICON_TRASH;

    el.append(dot, time, title, del);

    attachPress(el, {
      onTap: function (e) {
        if (e.target.closest('.m-del')) return;
        jumpTo(m.time);
      },
      onLong: function (e) {
        if (e.target.closest('.m-del')) return;
        openMarkMenu(m, el);
      }
    });

    attachPress(del, {
      longMs: 600,
      onTap: function () { deleteMark(m.id); },
      onLong: function () { clearAllMarks(); }
    });

    return el;
  }

  function addMark() {
    if (!hasSource) { toast('请先输入链接并播放'); return; }
    var t = video.currentTime;
    if (!isFinite(t)) { toast('视频尚未就绪'); return; }

    marks.push({
      id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      time: t,
      title: '标记 ' + (marks.length + 1)
    });
    marks.sort(function (a, b) { return a.time - b.time; });

    saveMarks();
    renderMarks();
    renderBarMarks();

    flagBtn.classList.add('pulse');
    setTimeout(function () { flagBtn.classList.remove('pulse'); }, 400);
    toast('已标记 ' + fmt(t));
  }

  function jumpTo(t) {
    if (!hasSource) return;
    var d = video.duration;
    var target = t;
    if (isFinite(d) && d > 0) target = Math.min(t, Math.max(0, d - 0.05));
    try { video.currentTime = target; } catch (e) {}
    showControls();
    toast('跳转到 ' + fmt(t));
  }

  function deleteMark(id) {
    marks = marks.filter(function (m) { return m.id !== id; });
    saveMarks();
    renderMarks();
    renderBarMarks();
    toast('已删除该标记');
  }

  function clearAllMarks() {
    if (marks.length === 0) { toast('没有标记可删除'); return; }
    if (!confirm('确定要删除全部 ' + marks.length + ' 个标记吗？此操作不可撤销。')) return;
    marks = [];
    saveMarks();
    renderMarks();
    renderBarMarks();
    toast('已清空全部标记');
  }

  flagBtn.addEventListener('click', addMark);
  searchInput.addEventListener('input', renderMarks);

  /* ============ 标记长按菜单 ============ */
  var menuMarkId = null;

  function openMarkMenu(mark, anchorEl) {
    menuMarkId = mark.id;
    openPopupNear(menu, anchorEl);
  }

  menu.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.dataset.act;
    var mark = marks.filter(function (m) { return m.id === menuMarkId; })[0];
    menu.hidden = true;
    if (!mark) return;

    if (act === 'seek') {
      jumpTo(mark.time);
    } else if (act === 'rename') {
      var name = prompt('修改标记名称', mark.title || '');
      if (name !== null) {
        mark.title = name;
        saveMarks();
        renderMarks();
        toast('已重命名');
      }
    } else if (act === 'delete') {
      deleteMark(mark.id);
    }
  });

  /* 点击空白关闭所有弹层 */
  document.addEventListener('pointerdown', function (e) {
    if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true;
    if (!decoderMenu.hidden &&
        !decoderMenu.contains(e.target) &&
        !decoderBtn.contains(e.target)) {
      decoderMenu.hidden = true;
    }
  }, true);

  window.addEventListener('resize', function () {
    menu.hidden = true;
    decoderMenu.hidden = true;
  });
  window.addEventListener('scroll', function () {
    menu.hidden = true;
    decoderMenu.hidden = true;
  }, true);

  /* ============ 键盘快捷键 ============ */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    if (e.code === 'Space') { e.preventDefault(); togglePlay(); showControls(); }
    else if (e.code === 'ArrowRight') {
      video.currentTime = Math.min(video.currentTime + 5, video.duration || 0);
      showControls();
    }
    else if (e.code === 'ArrowLeft') {
      video.currentTime = Math.max(video.currentTime - 5, 0);
      showControls();
    }
    else if (e.key === 'm' || e.key === 'M') { addMark(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  });

  /* ============ 初始化 ============ */
  syncPlayIcon();
  renderMarks();
  updateDecoderBtn();
  updateFsIcon();
  showControls();

  var lastUrl = '';
  try { lastUrl = localStorage.getItem('m3u8_player_last_url') || ''; } catch (e) {}
  if (lastUrl) urlInput.value = lastUrl;

})();
</script>
