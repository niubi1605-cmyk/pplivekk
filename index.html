<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黑猫 · 本地文件加密</title>
<style>
:root{
  --bg:#0a0c11; --bg2:#10131b; --card:#151924; --line:#242b3a;
  --text:#e8edf7; --muted:#8a94a8;
  --accent:#8b5cf6; --accent2:#4f8cff;
  --ok:#34d399; --err:#f87171; --warn:#fbbf24;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  background:radial-gradient(900px 520px at 50% -15%, #1c1638 0%, var(--bg) 60%) fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;font-size:inherit;}
.hidden{display:none !important;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  background:rgba(10,12,17,.82);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.5px;}
.brand .cat{font-size:22px;filter:drop-shadow(0 0 12px rgba(139,92,246,.8));}
.brand small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.menu-wrap{position:relative;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:17px;cursor:pointer;
  display:grid;place-items:center;transition:.18s;
}
.icon-btn:hover{background:#1c2231;border-color:#38455e;}
.icon-btn:active{transform:scale(.94);}
.menu-panel{
  position:absolute;right:0;top:46px;min-width:200px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.7);
  animation:pop .16s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu-panel button{
  display:block;width:100%;text-align:left;padding:10px 12px;border:0;
  background:transparent;color:var(--text);font-size:14px;border-radius:10px;
  cursor:pointer;transition:.15s;
}
.menu-panel button:hover{background:#1e2534;}

/* ---------- 布局 ---------- */
.container{max-width:700px;margin:0 auto;padding:20px 16px 56px;}
.tabs{
  display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);
  padding:5px;border-radius:14px;margin-bottom:20px;
}
.tabs button{
  flex:1;padding:11px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
}
.tabs button.active{
  background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;
  box-shadow:0 8px 22px rgba(124,92,255,.38);
}

/* ---------- 子标签（解密区） ---------- */
.sub-tabs{
  display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);
  padding:5px;border-radius:12px;margin-bottom:16px;
}
.sub-tab{
  flex:1;padding:10px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;
}
.sub-tab.active{
  background:#232b3c;color:var(--text);
}
.sub-tab:hover:not(.active){color:#b9c3d6;}

/* ---------- 拖拽区 ---------- */
.drop-zone{
  border:2px dashed #2b3448;border-radius:var(--radius);background:var(--card);
  padding:36px 20px;text-align:center;cursor:pointer;transition:.2s;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:#1a1f2e;}
.dz-icon{font-size:34px;margin-bottom:10px;opacity:.9;}
.dz-title{font-weight:700;font-size:15px;}
.dz-sub{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.3px;}

/* ---------- 已选文件 ---------- */
.file-chip{
  display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  animation:pop .18s ease;
}
.fc-icon{font-size:22px;}
.fc-meta{flex:1;min-width:0;}
.fc-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-size{font-size:12px;color:var(--muted);margin-top:2px;}
.fc-x{
  width:28px;height:28px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;transition:.15s;flex:none;
}
.fc-x:hover{background:#2a1620;color:var(--err);border-color:#4a2230;}

/* ---------- 表单 ---------- */
.field{margin-top:18px;}
.field-label{font-size:13px;font-weight:700;color:#b9c3d6;margin-bottom:9px;letter-spacing:.3px;}
.tag{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:#232b3c;color:var(--muted);margin-left:5px;vertical-align:1px;
}
.input,.textarea{
  width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;color:var(--text);outline:none;transition:.18s;
}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.16);}
.input::placeholder,.textarea::placeholder{color:#5c6679;}
.textarea{
  min-height:140px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.6;word-break:break-all;
}
.hint{font-size:12px;color:var(--muted);margin-top:7px;}

/* ---------- 模式卡片 ---------- */
.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:540px){.mode-list{grid-template-columns:1fr;}}
.mode-card{
  position:relative;display:block;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);cursor:pointer;transition:.2s;
}
.mode-card:hover{border-color:#38455e;}
.mode-card.active{
  border-color:var(--accent);
  background:linear-gradient(180deg,rgba(124,92,255,.15),rgba(124,92,255,.03));
  box-shadow:0 0 0 1px rgba(124,92,255,.4),0 10px 26px -12px rgba(124,92,255,.7);
}
.mode-card input{position:absolute;opacity:0;pointer-events:none;}
.mode-title{font-weight:800;font-size:14.5px;margin-bottom:5px;}
.mode-desc{font-size:12px;color:var(--muted);line-height:1.5;}

/* ---------- 算法卡片 ---------- */
.algo-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media(max-width:600px){.algo-list{grid-template-columns:1fr;}}
.algo-card{
  position:relative;display:block;padding:12px 13px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);cursor:pointer;transition:.2s;
}
.algo-card:hover{border-color:#38455e;}
.algo-card.active{
  border-color:var(--accent);
  background:linear-gradient(180deg,rgba(124,92,255,.15),rgba(124,92,255,.03));
  box-shadow:0 0 0 1px rgba(124,92,255,.4),0 8px 22px -12px rgba(124,92,255,.7);
}
.algo-card input{position:absolute;opacity:0;pointer-events:none;}
.algo-title{
  font-weight:800;font-size:12px;margin-bottom:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:-.2px;line-height:1.35;
}
.algo-desc{font-size:11px;color:var(--muted);line-height:1.45;}

/* ---------- 按钮 ---------- */
.btn{
  width:100%;padding:15px;border:0;border-radius:14px;font-size:15px;font-weight:800;
  cursor:pointer;transition:.2s;margin-top:20px;letter-spacing:.5px;
  display:block;text-align:center;text-decoration:none;
}
.btn-primary{
  background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;
  box-shadow:0 12px 30px -8px rgba(124,92,255,.75);
}
.btn-primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 16px 38px -8px rgba(124,92,255,.9);}
.btn-primary:not(:disabled):active{transform:translateY(0);}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;}
.btn-ghost{
  background:var(--card);border:1px solid var(--line);color:var(--text);margin-top:12px;
}
.btn-ghost:hover{background:#1c2231;border-color:#38455e;}

/* ---------- 状态 / 结果 ---------- */
.status{
  margin-top:16px;padding:12px 14px;border-radius:13px;font-size:13.5px;
  background:var(--card);border:1px solid var(--line);color:#b9c3d6;
  display:flex;align-items:center;gap:10px;
}
.status.ok{border-color:#1f4d3a;background:#0f1f1a;color:var(--ok);}
.status.err{border-color:#4a2230;background:#1f1016;color:var(--err);}
.spinner{
  width:15px;height:15px;border:2px solid rgba(139,92,246,.25);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

.result{margin-top:16px;animation:pop .2s ease;}
.result-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;overflow:hidden;
}
.badge{
  display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;
  background:#232b3c;color:#b9c3d6;margin-right:6px;letter-spacing:.3px;
}
.badge.ok{background:#0f2f24;color:var(--ok);}
.badge.pub{background:#122a44;color:#60a5fa;}
.badge.prv{background:#2c1a45;color:#c084fc;}
.badge.algo{background:#1a1a2e;color:#fbbf24;border:1px solid #3a3a1e;}
.code-box{
  margin-top:12px;padding:12px;border-radius:12px;background:#0c0f16;
  border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.6;color:#8ba0c0;word-break:break-all;
  max-height:170px;overflow:auto;user-select:all;
}
.result-info{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.9;}
.result-info b{color:#c3cddd;font-weight:700;}
.algo-highlight{
  color:#fbbf24;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;font-weight:700;
}
.preview{margin-top:14px;border-radius:12px;overflow:hidden;background:#000;}
.preview img,.preview video{width:100%;display:block;max-height:60vh;object-fit:contain;}

/* ---------- 模态框 ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(4,6,10,.78);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 40px 100px rgba(0,0,0,.8);animation:pop .2s ease;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--line);flex:none;
}
.modal-head h2{font-size:16.5px;font-weight:800;}
.modal-body{padding:18px;overflow-y:auto;font-size:14px;line-height:1.75;color:#c3cddd;}
.modal-body h3{
  font-size:14px;font-weight:800;color:var(--text);margin:16px 0 7px;
  padding-left:10px;border-left:3px solid var(--accent);
}
.modal-body h3:first-child{margin-top:0;}
.modal-body p{color:#a4b0c4;font-size:13.5px;margin-bottom:4px;}
.modal-body ul{margin:6px 0 8px 18px;color:#a4b0c4;font-size:13.5px;}
.modal-body li{margin-bottom:5px;}
.modal-body code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:#0c0f16;padding:2px 6px;border-radius:6px;color:#c084fc;
}
.qq-box{
  display:inline-block;margin-top:6px;padding:10px 16px;border-radius:12px;
  background:#0c0f16;border:1px solid #3a2f5e;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:18px;font-weight:800;color:#c084fc;letter-spacing:1.5px;
}
.footer-note{
  text-align:center;font-size:12px;color:#5c6679;margin-top:30px;line-height:1.8;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="cat">🐈‍⬛</span>
    <span>黑猫</span>
    <small>Black&nbsp;Cat</small>
  </div>
  <div class="menu-wrap">
    <button id="menuBtn" class="icon-btn" aria-label="菜单">⋮</button>
    <div id="menuPanel" class="menu-panel hidden">
      <button data-act="about">关于网站</button>
      <button data-act="faq">基础问题</button>
      <button data-act="device">本机设备码</button>
      <button data-act="inspirer">关于项目启发者</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-tab="enc">🔒 加密</button>
    <button class="tab" data-tab="dec">🔓 解密</button>
  </div>

  <!-- ================= 加密 ================= -->
  <section id="panel-enc">
    <div id="dropZone" class="drop-zone">
      <div class="dz-icon">🗂️</div>
      <div class="dz-title">点击选择，或拖入照片 / 视频</div>
      <div class="dz-sub">JPG · PNG · WebP · GIF · MP4 · MOV · WebM</div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>

    <div id="fileChip" class="file-chip hidden">
      <span class="fc-icon" id="fcIcon">📄</span>
      <div class="fc-meta">
        <div class="fc-name" id="fcName">—</div>
        <div class="fc-size" id="fcSize">—</div>
      </div>
      <button class="fc-x" id="fcRemove" aria-label="移除">✕</button>
    </div>

    <div class="field">
      <div class="field-label">加密模式</div>
      <div class="mode-list">
        <label class="mode-card active" data-mode="public">
          <input type="radio" name="encMode" value="public" checked>
          <div class="mode-title">🌐 公开模式</div>
          <div class="mode-desc">生成乱码发给朋友，同款网站粘贴即可解密观看</div>
        </label>
        <label class="mode-card" data-mode="private">
          <input type="radio" name="encMode" value="private">
          <div class="mode-title">🔐 私密模式</div>
          <div class="mode-desc">严格绑定本设备，换设备 / 换人一律无法解密</div>
        </label>
      </div>
    </div>

    <div class="field">
      <div class="field-label">加密算法 <span class="tag">可选</span></div>
      <div class="algo-list">
        <label class="algo-card active" data-algo="aes-gcm">
          <input type="radio" name="encAlgo" value="aes-gcm" checked>
          <div class="algo-title">AES-256-GCM</div>
          <div class="algo-desc">认证加密 · 速度与安全兼顾 · 推荐</div>
        </label>
        <label class="algo-card" data-algo="aes-cbc">
          <input type="radio" name="encAlgo" value="aes-cbc">
          <div class="algo-title">AES-256-CBC + HMAC</div>
          <div class="algo-desc">经典组合 · 加密后再签名 · 兼容性好</div>
        </label>
        <label class="algo-card" data-algo="aes-ctr">
          <input type="radio" name="encAlgo" value="aes-ctr">
          <div class="algo-title">AES-256-CTR + HMAC</div>
          <div class="algo-desc">流式加密 · 适合大文件 · 同样带签名</div>
        </label>
      </div>
      <div class="hint">加密时选哪个算法，解密时就会用同一个算法还原，并在结果里告诉你用的是哪个。</div>
    </div>

    <div class="field">
      <div class="field-label">密码 <span class="tag">可选</span></div>
      <input type="password" id="encPwd" class="input" placeholder="留空则解密时无需密码" autocomplete="new-password">
      <div class="hint">设置密码后，对方必须先输入正确密码才能解密。</div>
    </div>

    <button id="encBtn" class="btn btn-primary" disabled>开始加密</button>
    <div id="encStatus" class="status hidden"></div>
    <div id="encResult" class="result hidden"></div>
  </section>

  <!-- ================= 解密 ================= -->
  <section id="panel-dec" class="hidden">
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="paste">📋 粘贴乱码</button>
      <button class="sub-tab" data-sub="file">📥 上传文件</button>
    </div>

    <!-- 粘贴乱码 -->
    <div id="sub-paste">
      <div class="field" style="margin-top:0;">
        <div class="field-label">乱码内容</div>
        <textarea id="garbled" class="textarea" placeholder="在此粘贴以 HCAT1. 开头的乱码…" spellcheck="false"></textarea>
        <div class="hint">支持直接粘贴朋友发来的乱码文本，或 .hcat 文件里的全部内容。</div>
      </div>
    </div>

    <!-- 上传文件 -->
    <div id="sub-file" class="hidden">
      <div id="dropZone2" class="drop-zone">
        <div class="dz-icon">📥</div>
        <div class="dz-title">点击选择，或拖入 .hcat 文件</div>
        <div class="dz-sub">支持 .hcat 格式的乱码文件</div>
      </div>
      <input type="file" id="fileInput2" accept=".hcat,application/octet-stream" hidden>
    </div>

    <div class="field">
      <div class="field-label">密码 <span class="tag">若有</span></div>
      <input type="password" id="decPwd" class="input" placeholder="未设置密码则留空" autocomplete="off">
    </div>

    <button id="decBtn" class="btn btn-primary">解密 / 播放</button>
    <div id="decStatus" class="status hidden"></div>
    <div id="decResult" class="result hidden"></div>
  </section>

  <div class="footer-note">
    🔒 全部运算在你的浏览器本地完成<br>文件与密码不会上传到任何服务器
  </div>
</div>

<div id="modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="icon-btn" aria-label="关闭">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   常量
   ========================================================= */
const SITE_KEY = 'HEIMAO::BLACKCAT::AES-256-GCM::v2::2024::SEAL';
const SITE_ID  = 'HCAT-7F3A';
const ITER     = 150000;
const HEADER   = 64;
const PREFIX   = 'HCAT1.';
const MAX_INLINE = 900000;
const MAX_B64    = 80 * 1024 * 1024;

/* ---------- 加密算法定义 ---------- */
const ALGOS = {
  'aes-gcm': {
    id: 1,
    name: 'AES-256-GCM',
    keyBundleLen: 32,
    ivLen: 12
  },
  'aes-cbc': {
    id: 2,
    name: 'AES-256-CBC + HMAC-SHA256',
    keyBundleLen: 64,
    ivLen: 16
  },
  'aes-ctr': {
    id: 3,
    name: 'AES-256-CTR + HMAC-SHA256',
    keyBundleLen: 64,
    ivLen: 16
  }
};
const ALGO_BY_ID = {1:'aes-gcm', 2:'aes-cbc', 3:'aes-ctr'};

/* =========================================================
   小工具
   ========================================================= */
const $ = s => document.querySelector(s);

function randHex(n){
  const b = crypto.getRandomValues(new Uint8Array(Math.ceil(n/2)));
  let s = '';
  for(const x of b) s += x.toString(16).padStart(2,'0');
  return s.slice(0,n);
}
async function sha256Hex(str){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fmtSize(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if(b < 1073741824) return (b/1048576).toFixed(2) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function concatBytes(){
  let total = 0;
  for(let i=0;i<arguments.length;i++) total += arguments[i].length;
  const out = new Uint8Array(total);
  let off = 0;
  for(let i=0;i<arguments.length;i++){ out.set(arguments[i], off); off += arguments[i].length; }
  return out;
}

/* ---------- base64url ---------- */
async function bytesToB64url(bytes){
  let s = '', chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    s += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    if(i % (chunk*8) === 0) await new Promise(r=>setTimeout(r,0));
  }
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBytes(str){
  let s = str.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* =========================================================
   设备指纹
   ========================================================= */
let _deviceId = null;
async function getDeviceId(){
  if(_deviceId) return _deviceId;
  let uuid = '';
  try{
    uuid = localStorage.getItem('hemao_device_uuid') || '';
    if(!uuid){
      uuid = (crypto.randomUUID ? crypto.randomUUID() : randHex(32));
      localStorage.setItem('hemao_device_uuid', uuid);
    }
  }catch(e){
    uuid = 'no-storage';
  }
  const fp = [
    navigator.userAgent || '',
    navigator.language || '',
    navigator.hardwareConcurrency || 0,
    (screen.width||0) + 'x' + (screen.height||0) + 'x' + (screen.colorDepth||0),
    (Intl.DateTimeFormat().resolvedOptions().timeZone) || '',
    uuid
  ].join('|');
  _deviceId = await sha256Hex('HEIMAO-DEVICE::' + fp);
  return _deviceId;
}

/* =========================================================
   密钥派生
   ========================================================= */
async function deriveKEK(secret, salt){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(secret),
    'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}

/* =========================================================
   加密
   ========================================================= */
async function doEncrypt(file, mode, password, algoKey, setStatus){
  const algo = ALGOS[algoKey];
  if(!algo) throw new Error('未知的加密算法。');

  setStatus('读取文件…');
  const plain = new Uint8Array(await file.arrayBuffer());

  const salt   = crypto.getRandomValues(new Uint8Array(16));
  const iv     = crypto.getRandomValues(new Uint8Array(16));
  const wrapIv = crypto.getRandomValues(new Uint8Array(12));

  const dataKey  = crypto.getRandomValues(new Uint8Array(32));
  let hmacKeyRaw = null;
  let keyBundle;
  if(algo.keyBundleLen === 32){
    keyBundle = dataKey;
  }else{
    hmacKeyRaw = crypto.getRandomValues(new Uint8Array(32));
    keyBundle = concatBytes(dataKey, hmacKeyRaw);
  }

  setStatus('派生密钥中…');
  const parts = [SITE_KEY];
  if(mode === 'private') parts.push('DEV:' + await getDeviceId());
  if(password) parts.push('PWD:' + password);
  const kek = await deriveKEK(parts.join('|'), salt);

  setStatus('加密数据中…');
  let ciphertext;

  if(algoKey === 'aes-gcm'){
    const k = await crypto.subtle.importKey('raw', dataKey, 'AES-GCM', false, ['encrypt']);
    ciphertext = new Uint8Array(await crypto.subtle.encrypt(
      { name:'AES-GCM', iv: iv.subarray(0, 12) }, k, plain
    ));
  }
  else if(algoKey === 'aes-cbc'){
    const k = await crypto.subtle.importKey('raw', dataKey, 'AES-CBC', false, ['encrypt']);
    const raw = new Uint8Array(await crypto.subtle.encrypt(
      { name:'AES-CBC', iv }, k, plain
    ));
    const hk = await crypto.subtle.importKey(
      'raw', hmacKeyRaw, { name:'HMAC', hash:'SHA-256' }, false, ['sign']
    );
    const mac = new Uint8Array(await crypto.subtle.sign(
      'HMAC', hk, concatBytes(iv, raw)
    ));
    ciphertext = concatBytes(mac, raw);
  }
  else if(algoKey === 'aes-ctr'){
    const k = await crypto.subtle.importKey('raw', dataKey, 'AES-CTR', false, ['encrypt']);
    const raw = new Uint8Array(await crypto.subtle.encrypt(
      { name:'AES-CTR', counter: iv, length: 64 }, k, plain
    ));
    const hk = await crypto.subtle.importKey(
      'raw', hmacKeyRaw, { name:'HMAC', hash:'SHA-256' }, false, ['sign']
    );
    const mac = new Uint8Array(await crypto.subtle.sign(
      'HMAC', hk, concatBytes(iv, raw)
    ));
    ciphertext = concatBytes(mac, raw);
  }

  const wrappedKey = new Uint8Array(await crypto.subtle.encrypt(
    { name:'AES-GCM', iv: wrapIv }, kek, keyBundle
  ));

  const meta = {
    n : file.name,
    t : file.type || 'application/octet-stream',
    s : file.size,
    m : mode,
    a : algoKey,
    aName : algo.name,
    p : !!password,
    id: SITE_ID + '-' + randHex(6).toUpperCase(),
    ts: Date.now()
  };
  const metaBytes = new TextEncoder().encode(JSON.stringify(meta));

  const total = HEADER + wrappedKey.length + metaBytes.length + ciphertext.length;
  const out = new Uint8Array(total);
  const dv  = new DataView(out.buffer);

  out.set([0x48,0x43,0x41,0x54], 0);
  out[4] = 2;
  out[5] = mode === 'private' ? 1 : 0;
  out[6] = algo.id;
  out[7] = password ? 1 : 0;
  out.set(salt, 8);
  out.set(iv, 24);
  out.set(wrapIv, 40);
  dv.setUint32(52, wrappedKey.length);
  dv.setUint32(56, metaBytes.length);

  out.set(wrappedKey, HEADER);
  out.set(metaBytes, HEADER + wrappedKey.length);
  out.set(ciphertext, HEADER + wrappedKey.length + metaBytes.length);

  return { bytes: out, meta };
}

/* =========================================================
   解密
   ========================================================= */
async function doDecrypt(bytes, password){
  if(!bytes || bytes.length < HEADER) throw new Error('乱码内容不完整或格式错误。');
  if(!(bytes[0]===0x48 && bytes[1]===0x43 && bytes[2]===0x41 && bytes[3]===0x54)){
    throw new Error('这不是黑猫生成的乱码，无法识别。');
  }

  const version = bytes[4];
  if(version !== 2){
    throw new Error('不支持的乱码版本（v' + version + '），请使用对应版本的黑猫解密。');
  }

  const mode   = bytes[5] === 1 ? 'private' : 'public';
  const algoId = bytes[6];
  const flags  = bytes[7];
  const hasPwd = !!(flags & 1);

  const algoKey = ALGO_BY_ID[algoId];
  if(!algoKey) throw new Error('不支持的加密算法（id=' + algoId + '）。');
  const algo = ALGOS[algoKey];

  const salt   = bytes.subarray(8, 24);
  const iv     = bytes.subarray(24, 40);
  const wrapIv = bytes.subarray(40, 52);

  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const wkLen   = dv.getUint32(52);
  const metaLen = dv.getUint32(56);

  const metaStart = HEADER + wkLen;
  const ctStart   = metaStart + metaLen;

  const wrappedKey = bytes.subarray(HEADER, metaStart);
  const meta       = JSON.parse(new TextDecoder().decode(bytes.subarray(metaStart, ctStart)));
  const ciphertext = bytes.subarray(ctStart);

  if(hasPwd && !password){
    const e = new Error('该乱码已设置密码，请输入密码后再解密。');
    e.code = 'NEED_PWD';
    throw e;
  }

  const parts = [SITE_KEY];
  if(mode === 'private') parts.push('DEV:' + await getDeviceId());
  if(password) parts.push('PWD:' + password);
  const kek = await deriveKEK(parts.join('|'), salt);

  let keyBundle;
  try{
    keyBundle = new Uint8Array(await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: wrapIv }, kek, wrappedKey
    ));
  }catch(err){
    const e = new Error('解密失败');
    if(mode === 'private'){
      e.message = '解密失败：这段乱码绑定的是另一台设备，或密码不正确。';
      e.code = 'DEVICE';
    }else if(hasPwd){
      e.message = '密码错误，请重新输入。';
      e.code = 'PWD';
    }else{
      e.message = '解密失败：密钥不匹配，这段乱码可能已被篡改。';
      e.code = 'KEY';
    }
    throw e;
  }

  let plain;
  if(algoKey === 'aes-gcm'){
    const k = await crypto.subtle.importKey('raw', keyBundle, 'AES-GCM', false, ['decrypt']);
    try{
      plain = new Uint8Array(await crypto.subtle.decrypt(
        { name:'AES-GCM', iv: iv.subarray(0, 12) }, k, ciphertext
      ));
    }catch(err){
      throw new Error('数据校验失败，文件可能已损坏或被篡改。');
    }
  }
  else if(algoKey === 'aes-cbc' || algoKey === 'aes-ctr'){
    const dataKey  = keyBundle.subarray(0, 32);
    const hmacKey  = keyBundle.subarray(32, 64);
    const mac      = ciphertext.subarray(0, 32);
    const raw      = ciphertext.subarray(32);

    const hk = await crypto.subtle.importKey(
      'raw', hmacKey, { name:'HMAC', hash:'SHA-256' }, false, ['verify']
    );
    const ok = await crypto.subtle.verify(
      'HMAC', hk, mac, concatBytes(iv, raw)
    );
    if(!ok){
      throw new Error('数据签名校验失败：文件可能已被篡改。');
    }

    if(algoKey === 'aes-cbc'){
      const k = await crypto.subtle.importKey('raw', dataKey, 'AES-CBC', false, ['decrypt']);
      try{
        plain = new Uint8Array(await crypto.subtle.decrypt(
          { name:'AES-CBC', iv }, k, raw
        ));
      }catch(err){
        throw new Error('数据解密失败，文件可能已损坏。');
      }
    }else{
      const k = await crypto.subtle.importKey('raw', dataKey, 'AES-CTR', false, ['decrypt']);
      try{
        plain = new Uint8Array(await crypto.subtle.decrypt(
          { name:'AES-CTR', counter: iv, length: 64 }, k, raw
        ));
      }catch(err){
        throw new Error('数据解密失败，文件可能已损坏。');
      }
    }
  }

  return { plain, meta };
}

/* ---------- 模态框 ---------- */
function openModal(title, html){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  modal.classList.remove('hidden');
}
$('#modalClose').addEventListener('click', () => modal.classList.add('hidden'));
modal.addEventListener('click', e => { if(e.target === modal) modal.classList.add('hidden'); });

/* ---------- 主 Tab 切换 ---------- */

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    $('#panel-enc').classList.toggle('hidden', !isEnc);
    $('#panel-dec').classList.toggle('hidden', isEnc);

});

/* ---------- 模式卡片 ---------- */
document.querySelectorAll('.mode-card').forEach(card => {

    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    card.querySelector('input').checked = true;

});
function currentMode(){
  return document.querySelector('input[name="encMode"]:checked').value;
}

/* ---------- 算法卡片 ---------- */
document.querySelectorAll('.algo-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.algo-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    card.querySelector('input').checked = true;
  });
});
function currentAlgo(){
  return document.querySelector('input[name="encAlgo"]:checked').value;
}

/* ---------- 状态条 ---------- */
function setStatus(el, text, type){
  el.classList.remove('hidden','ok','err');
  if(type) el.classList.add(type);
  el.innerHTML = type === 'loading'
    ? '<span class="spinner"></span><span>' + esc(text) + '</span>'
    : esc(text);
}

/* =========================================================
   加密面板
   ========================================================= */
let encFile = null;
const dropZone  = $('#dropZone');
const fileInput = $('#fileInput');
const fileChip  = $('#fileChip');
const encBtn    = $('#encBtn');
const encStatus = $('#encStatus');
const encResult = $('#encResult');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if(e.target.files && e.target.files[0]) pickFile(e.target.files[0]);
});

['dragenter','dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag'); });
});
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) pickFile(f);
});

function pickFile(f){
  encFile = f;
  const isVideo = (f.type || '').startsWith('video');
  const isImage = (f.type || '').startsWith('image');
  $('#fcIcon').textContent = isVideo ? '🎬' : isImage ? '🖼️' : '📄';
  $('#fcName').textContent = f.name;
  $('#fcSize').textContent = fmtSize(f.size) + ' · ' + (f.type || '未知类型');
  fileChip.classList.remove('hidden');
  dropZone.classList.add('hidden');
  encBtn.disabled = false;
  encResult.classList.add('hidden');
  encStatus.classList.add('hidden');
}

$('#fcRemove').addEventListener('click', () => {
  encFile = null;
  fileInput.value = '';
  fileChip.classList.add('hidden');
  dropZone.classList.remove('hidden');
  encBtn.disabled = true;
  encResult.classList.add('hidden');
  encStatus.classList.add('hidden');
});

encBtn.addEventListener('click', async () => {
  if(!encFile) return;
  const mode    = currentMode();
  const algoKey = currentAlgo();
  const pwd     = $('#encPwd').value;
  const algo    = ALGOS[algoKey];

  encBtn.disabled = true;
  encResult.classList.add('hidden');
  setStatus(encStatus, '准备加密（' + algo.name + '）…', 'loading');

  try{
    const t0 = performance.now();
    const { bytes, meta } = await doEncrypt(encFile, mode, pwd, algoKey, txt => {
      setStatus(encStatus, txt, 'loading');
    });

    setStatus(encStatus, '生成乱码中…', 'loading');

    const tooLarge = bytes.length > MAX_B64;
    const garbledText = tooLarge ? '' : PREFIX + await bytesToB64url(bytes);
    const cost = ((performance.now() - t0) / 1000).toFixed(1);

    renderEncryptResult(bytes, garbledText, meta, cost, tooLarge);

    setStatus(encStatus, '✅ 加密完成（' + algo.name + '），用时 ' + cost + ' 秒', 'ok');
  }catch(err){
    console.error(err);
    setStatus(encStatus, '❌ 加密失败：' + (err.message || err), 'err');
  }finally{
    encBtn.disabled = false;
  }
});

function renderEncryptResult(bytes, garbledText, meta, cost, tooLarge){
  const isPrivate = meta.m === 'private';
  const modeBadge = isPrivate
    ? '<span class="badge prv">🔐 私密模式</span>'
    : '<span class="badge pub">🌐 公开模式</span>';
  const pwdBadge  = meta.p ? '<span class="badge">🔑 已设密码</span>' : '<span class="badge">🔓 无密码</span>';
  const algoBadge = '<span class="badge algo">🔧 ' + esc(meta.aName) + '</span>';

  let garbledBlock;
  if(tooLarge){
    garbledBlock = `<div class="code-box">文件过大（加密后 ${fmtSize(bytes.length)}），
      已超出网页内联显示的安全范围。<br><br>
      请点击下方「下载乱码文件（.hcat）」，把文件直接发给朋友即可。</div>`;
  }else{
    const preview = garbledText.slice(0, 3000);
    const truncated = garbledText.length > 3000;
    garbledBlock = `<div class="code-box" id="garbledBox">${esc(preview)}${truncated ? '\n…（已截断显示，复制按钮会复制完整内容）' : ''}</div>`;
  }

  const copyBtn = tooLarge
    ? ''
    : `<button class="btn btn-ghost" id="copyGarbled" style="margin-top:12px;">📋 复制完整乱码</button>`;

  encResult.innerHTML = `
    <div class="result-card">
      <div>${modeBadge}${pwdBadge}${algoBadge}<span class="badge ok">✅ 加密成功</span></div>
      ${garbledBlock}
      ${copyBtn}
      <button class="btn btn-ghost" id="downloadHcat">⬇️ 下载乱码文件（.hcat）</button>
      <div class="result-info">
        <b>文件：</b>${esc(meta.n)}<br>
        <b>原始大小：</b>${fmtSize(meta.s)}<br>
        <b>加密体积：</b>${fmtSize(bytes.length)}<br>
        <b>加密算法：</b><span class="algo-highlight">${esc(meta.aName)}</span><br>
        <b>加密模式：</b>${isPrivate ? '私密模式（绑定本设备）' : '公开模式（同款网站可解）'}<br>
        <b>识别码：</b>${esc(meta.id)}<br>
        <b>用时：</b>${cost} 秒
      </div>
      ${isPrivate ? '<div class="hint" style="margin-top:12px;color:#c084fc;">🔐 该文件已绑定本设备，请勿清除浏览器数据，否则将无法再次解密。</div>' : ''}
    </div>
  `;
  encResult.classList.remove('hidden');

  if(!tooLarge){
    $('#copyGarbled').addEventListener('click', async function(){
      try{
        await navigator.clipboard.writeText(garbledText);
        this.textContent = '✅ 已复制到剪贴板';
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = garbledText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); this.textContent = '✅ 已复制到剪贴板'; }
        catch(e2){ this.textContent = '❌ 复制失败，请手动选择复制'; }
        document.body.removeChild(ta);
      }
      setTimeout(() => { this.textContent = '📋 复制完整乱码'; }, 2200);
    });
  }

  $('#downloadHcat').addEventListener('click', function(){
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (meta.n || 'file') + '.hcat';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    this.textContent = '✅ 已开始下载';
    setTimeout(() => { this.textContent = '⬇️ 下载乱码文件（.hcat）'; }, 2200);
  });
}

/* =========================================================
   解密面板
   ========================================================= */
const dropZone2  = $('#dropZone2');
const fileInput2 = $('#fileInput2');
const garbledEl  = $('#garbled');
const decBtn     = $('#decBtn');
const decStatus  = $('#decStatus');
const decResult  = $('#decResult');

let pendingBytes = null;

dropZone2.addEventListener('click', () => fileInput2.click());
fileInput2.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  await loadHcatFile(f);
});

['dragenter','dragover'].forEach(ev => {
  dropZone2.addEventListener(ev, e => { e.preventDefault(); dropZone2.classList.add('drag'); });
});
['dragleave','drop'].forEach(ev => {
  dropZone2.addEventListener(ev, e => { e.preventDefault(); dropZone2.classList.remove('drag'); });
});
dropZone2.addEventListener('drop', async e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) await loadHcatFile(f);
});

async function loadHcatFile(f){
  setStatus(decStatus, '读取乱码文件…', 'loading');
  try{
    const buf = await f.arrayBuffer();
    pendingBytes = new Uint8Array(buf);
    dropZone2.innerHTML = `
      <div class="dz-icon">✅</div>
      <div class="dz-title">已载入：${esc(f.name)}</div>
      <div class="dz-sub">${fmtSize(f.size)} · 点击可重新选择文件</div>
    `;
    setStatus(decStatus, '✅ 已载入 ' + f.name + '，点击「解密 / 播放」', 'ok');
  }catch(err){
    setStatus(decStatus, '❌ 读取失败：' + err.message, 'err');
  }
}

/* 用户在粘贴框里输入时，忽略已载入的文件 */
garbledEl.addEventListener('input', () => {
  if(pendingBytes){
    pendingBytes = null;
    /* 恢复拖拽区初始状态 */
    dropZone2.innerHTML = `
      <div class="dz-icon">📥</div>
      <div class="dz-title">点击选择，或拖入 .hcat 文件</div>
      <div class="dz-sub">支持 .hcat 格式的乱码文件</div>
    `;
  }
});

decBtn.addEventListener('click', async () => {
  decResult.classList.add('hidden');
  let bytes = pendingBytes;

  if(!bytes){
    const raw = garbledEl.value.trim();
    if(!raw){
      setStatus(decStatus, '❌ 请先粘贴乱码，或上传 .hcat 文件。', 'err');
      return;
    }
    let b64 = raw;
    const idx = b64.indexOf(PREFIX);
    if(idx >= 0) b64 = b64.slice(idx + PREFIX.length);
    b64 = b64.replace(/[^A-Za-z0-9\-_+/=]/g, '');
    try{
      bytes = b64urlToBytes(b64);
    }catch(err){
      setStatus(decStatus, '❌ 乱码格式不正确，无法识别。', 'err');
      return;
    }
  }

  decBtn.disabled = true;
  setStatus(decStatus, '解密中…', 'loading');

  try{
    const { plain, meta } = await doDecrypt(bytes, $('#decPwd').value);
    renderDecryptResult(plain, meta);
    setStatus(decStatus, '✅ 解密成功（' + (meta.aName || '未知算法') + '）', 'ok');
  }catch(err){
    console.error(err);
    setStatus(decStatus, '❌ ' + (err.message || '解密失败'), 'err');
  }finally{
    decBtn.disabled = false;
  }
});

function renderDecryptResult(plain, meta){
  const type = meta.t || 'application/octet-stream';
  const blob = new Blob([plain], { type });
  const url  = URL.createObjectURL(blob);

  const isImage = type.startsWith('image/');
  const isVideo = type.startsWith('video/');

  let preview = '';
  if(isImage){
    preview = `<div class="preview"><img src="${url}" alt="${esc(meta.n)}"></div>`;
  }else if(isVideo){
    preview = `<div class="preview"><video src="${url}" controls playsinline preload="metadata"></video></div>`;
  }

  const modeBadge = meta.m === 'private'
    ? '<span class="badge prv">🔐 私密模式</span>'
    : '<span class="badge pub">🌐 公开模式</span>';

  const algoName = meta.aName || (meta.a && ALGOS[meta.a] ? ALGOS[meta.a].name : '未知算法');
  const algoBadge = '<span class="badge algo">🔧 ' + esc(algoName) + '</span>';

  decResult.innerHTML = `
    <div class="result-card">
      <div><span class="badge ok">✅ 解密成功</span>${modeBadge}${algoBadge}</div>
      ${preview}
      <div class="result-info">
        <b>文件名：</b>${esc(meta.n)}<br>
        <b>类型：</b>${esc(type)}<br>
        <b>大小：</b>${fmtSize(plain.length)}<br>
        <b>加密算法：</b><span class="algo-highlight">${esc(algoName)}</span><br>
        <b>加密模式：</b>${meta.m === 'private' ? '私密模式（绑定原设备）' : '公开模式'}<br>
        <b>是否设置密码：</b>${meta.p ? '是' : '否'}<br>
        <b>识别码：</b>${esc(meta.id || '—')}<br>
        <b>加密时间：</b>${meta.ts ? new Date(meta.ts).toLocaleString('zh-CN') : '—'}
      </div>
      <a class="btn btn-ghost" id="saveFile" download="${esc(meta.n)}">⬇️ 保存到本地</a>
    </div>
  `;
  decResult.classList.remove('hidden');

  $('#saveFile').href = url;
}

    '<p>请使用 Chrome / Edge / Firefox / Safari 最新版打开本页面。<br>' +
    '如果通过 http 访问，请改用 https 或直接本地打开文件。</p></div>';
}
