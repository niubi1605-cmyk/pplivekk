<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>VodCore · 稳定重写版</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{--bg:#07080c;--panel:#0f131d;--panel2:#161b28;--line:#212838;--text:#eef1f8;--muted:#7d8599;
    --brand:#4d8dff;--brand2:#7db0ff;--gold:#ffd166;--danger:#ff5f5f;--ok:#3ddc97;--purple:#a78bfa;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(1000px 500px at 50% -10%,#131a2b 0%,var(--bg) 65%);
    color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}
  
  .app{max-width:1000px;margin:0 auto;padding:10px 10px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;}
  
  /* 头部 */
  .head{display:flex;align-items:center;gap:9px;padding:2px;}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#8b5cf6);
    display:grid;place-items:center;flex:none;box-shadow:0 3px 12px rgba(77,141,255,.35);}
  .logo svg{width:16px;height:16px;color:#fff;}
  .title{font-weight:800;font-size:15px;}
  .title small{color:var(--muted);font-size:11px;font-weight:600;margin-left:4px;}
  .status{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ok);
    background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.28);
    padding:3px 8px;border-radius:99px;display:flex;align-items:center;gap:5px;}
  .status i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);}
  
  /* URL 栏 */
  .urlbar{display:flex;gap:8px;}
  .urlbar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    color:var(--text);padding:11px 13px;font-size:14px;outline:none;font-family:inherit;
    transition:border-color .15s;}
  .urlbar input:focus{border-color:var(--brand);}
  .urlbar input::placeholder{color:var(--muted);}
  .btn-play{flex:none;border:none;border-radius:11px;padding:0 20px;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand2),var(--brand));cursor:pointer;
    box-shadow:0 3px 12px rgba(77,141,255,.28);font-family:inherit;transition:transform .1s;}
  .btn-play:active{transform:scale(.97);}
  
  /* 播放器 */
  .player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;
    overflow:hidden;border:1px solid var(--line);isolation:isolate;}
  .player:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  .player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  .player video{width:100%;height:100%;display:block;object-fit:contain;background:#000;}
  
  .bigplay{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9);
    pointer-events:none;opacity:0;transition:opacity .2s;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.7));}
  .bigplay.show{opacity:1;}
  
  .spinner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3);z-index:5;
    opacity:0;pointer-events:none;transition:opacity .15s;}
  .spinner.show{opacity:1;}
  .spinner::after{content:"";width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--brand2);animation:rot .7s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg);}}
  
  .tag{position:absolute;top:8px;left:8px;z-index:6;display:flex;align-items:center;gap:5px;
    background:rgba(7,8,12,.7);border:1px solid rgba(255,255,255,.08);border-radius:99px;
    padding:3px 9px;font-size:10px;font-weight:700;backdrop-filter:blur(8px);pointer-events:none;
    opacity:0;transition:opacity .25s;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .tag.show{opacity:1;}
  .tag i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none;}
  .tag i.enc{background:var(--gold);box-shadow:0 0 6px var(--gold);}
  .tag i.err{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  
  /* 控制栏 */
  .ctrls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:28px 10px 6px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.9));
    transition:opacity .22s;user-select:none;-webkit-user-select:none;}
  .ctrls.hide{opacity:0;pointer-events:none;}
  
  .progress{position:relative;height:22px;display:flex;align-items:center;
    cursor:pointer;touch-action:none;}
  .progress .track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:3px;border-radius:99px;background:rgba(255,255,255,.16);}
  .progress .buf{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:3px;border-radius:99px;background:rgba(255,255,255,.28);width:0;}
  .progress .played{position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:3px;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));
    width:0;box-shadow:0 0 8px rgba(77,141,255,.55);}
  .progress .thumb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(77,141,255,.35);
    opacity:0;transition:opacity .15s;pointer-events:none;}
  .progress:hover .thumb,.progress.dragging .thumb{opacity:1;}
  .progress .marks-layer{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:14px;pointer-events:none;}
  .progress .marks-layer i{position:absolute;top:0;width:2px;height:14px;border-radius:2px;
    background:var(--gold);transform:translateX(-1px);box-shadow:0 0 6px rgba(255,209,102,.8);}
  
  .row{display:flex;align-items:center;gap:4px;margin-top:1px;}
  .ibtn{background:none;border:none;color:#fff;cursor:pointer;width:36px;height:36px;border-radius:9px;
    display:grid;place-items:center;flex:none;transition:background .15s;padding:0;}
  .ibtn:hover{background:rgba(255,255,255,.12);}
  .ibtn:active{background:rgba(255,255,255,.2);}
  .ibtn svg{width:19px;height:19px;pointer-events:none;}
  .time{font-variant-numeric:tabular-nums;font-size:11.5px;color:rgba(255,255,255,.85);
    margin-left:4px;white-space:nowrap;pointer-events:none;}
  .grow{flex:1;}
  .spd{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.12);color:#fff;border:none;
    border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;cursor:pointer;outline:none;
    font-family:inherit;font-variant-numeric:tabular-nums;}
  .spd option{background:#161b28;}
  
  /* 工具栏 */
  .tools{display:flex;gap:7px;flex-wrap:wrap;}
  .tbtn{flex:none;display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border-radius:10px;
    border:1px solid transparent;font-size:12.5px;font-weight:700;cursor:pointer;
    user-select:none;font-family:inherit;transition:transform .1s;white-space:nowrap;}
  .tbtn:active{transform:scale(.96);}
  .tbtn svg{width:15px;height:15px;flex:none;pointer-events:none;}
  .tbtn span{pointer-events:none;}
  .t-flag{color:var(--gold);border-color:rgba(255,209,102,.32);
    background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(255,209,102,.05));}
  .t-dec{color:var(--brand2);border-color:rgba(77,141,255,.36);
    background:linear-gradient(180deg,rgba(77,141,255,.18),rgba(77,141,255,.05));}
  .t-diag{color:#94a3b8;border-color:rgba(148,163,184,.32);
    background:linear-gradient(180deg,rgba(148,163,184,.14),rgba(148,163,184,.04));}
  .search{flex:1;min-width:140px;display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:0 11px;height:38px;}
  .search:focus-within{border-color:var(--brand);}
  .search svg{width:14px;height:14px;color:var(--muted);flex:none;pointer-events:none;}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;
    height:100%;font-family:inherit;min-width:0;}
  
  /* 标记列表 */
  .markList{display:flex;flex-direction:column;gap:6px;}
  .mark{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;}
  .mark:hover{background:var(--panel2);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 7px rgba(255,209,102,.7);flex:none;}
  .mt{font-size:12.5px;font-weight:800;color:var(--gold);background:rgba(255,209,102,.12);
    border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums;flex:none;}
  .mtitle{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    pointer-events:none;}
  .mdel{width:32px;height:32px;border:none;border-radius:8px;background:none;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;flex:none;padding:0;}
  .mdel:hover{background:rgba(255,95,95,.14);color:var(--danger);}
  .mdel svg{width:15px;height:15px;pointer-events:none;}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:18px;
    border:1px dashed var(--line);border-radius:10px;}
  
  /* 下载卡片 */
  .dl{background:linear-gradient(180deg,var(--panel),#0b0f18);border:1px solid var(--line);
    border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .dl-h{display:flex;align-items:center;gap:10px;}
  .dl-ic{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,rgba(77,141,255,.22),rgba(139,92,246,.16));
    border:1px solid rgba(77,141,255,.28);display:grid;place-items:center;color:var(--brand2);}
  .dl-ic svg{width:18px;height:18px;}
  .dl-n{flex:1;min-width:0;}
  .dl-t{font-size:13.5px;font-weight:800;}
  .dl-s{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .dl-go{border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand2),var(--brand));cursor:pointer;font-family:inherit;
    flex:none;transition:transform .1s;}
  .dl-go:active{transform:scale(.97);}
  .dl-go:disabled{opacity:.5;cursor:not-allowed;}
  
  .dl-prog{display:flex;flex-direction:column;gap:8px;}
  .dl-barWrap{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
  .dl-bar{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;
    transition:width .2s;box-shadow:0 0 8px rgba(77,141,255,.5);}
  .dl-bar.ind{width:35% !important;animation:dslide 1.3s infinite;}
  @keyframes dslide{0%{left:-35%;}100%{left:100%;}}
  .dl-stats{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;}
  .dl-stats b{color:var(--text);font-weight:700;}
  .dl-warn{font-size:11.5px;color:var(--gold);background:rgba(255,209,102,.07);
    border:1px solid rgba(255,209,102,.22);border-radius:8px;padding:8px 10px;
    line-height:1.55;display:none;}
  .dl-warn.show{display:block;}
  .dl-acts{display:flex;gap:7px;justify-content:flex-end;}
  .dl-btn{background:none;border:1px solid var(--line);color:var(--text);padding:7px 12px;
    border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dl-btn.danger{border-color:rgba(255,95,95,.34);color:var(--danger);}
  
  /* 菜单 */
  .menu{position:fixed;z-index:999;background:#161b28;border:1px solid var(--line);
    border-radius:11px;padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.65);min-width:140px;}
  .menu[hidden]{display:none;}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:13px;padding:9px 11px;border-radius:7px;cursor:pointer;font-family:inherit;
    transition:background .12s;}
  .menu button:hover{background:rgba(255,255,255,.08);}
  .menu button.d{color:var(--danger);}
  .dec-menu{min-width:240px;max-width:90vw;max-height:65vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .dec-title{font-size:10.5px;font-weight:800;color:var(--muted);padding:7px 11px 5px;
    letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .dec-title .badge{font-size:9.5px;color:var(--brand2);background:rgba(77,141,255,.13);
    padding:2px 6px;border-radius:5px;letter-spacing:0;}
  .dec-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 11px !important;}
  .dec-item .dn{font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center;color:var(--text);}
  .dec-item .dd{font-size:10.5px;color:var(--muted);}
  .dec-item.active{background:rgba(77,141,255,.12);}
  .dec-item.active .dn{color:var(--brand2);}
  .dec-item:disabled{opacity:.35;cursor:not-allowed;}
  .sep{height:1px;background:var(--line);margin:4px 7px;}
  
  /* 诊断面板 */
  .diag{position:fixed;left:10px;right:10px;bottom:10px;max-height:70vh;background:#0b0f18;
    border:1px solid var(--line);border-radius:12px;z-index:1001;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.75);}
  .diag[hidden]{display:none;}
  .diag-head{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);
    gap:8px;}
  .diag-head b{font-size:13px;color:#94a3b8;font-weight:800;}
  .diag-head .grow{flex:1;}
  .diag-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
    line-height:1;padding:0 5px;}
  .diag-close:hover{color:var(--text);}
  .diag-body{padding:12px 13px;overflow-y:auto;font-size:11.5px;line-height:1.6;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);}
  .diag-body h4{margin:10px 0 5px;font-size:10.5px;color:var(--purple);font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;}
  .diag-body h4:first-child{margin-top:0;}
  .drow{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #1a2030;font-size:11.5px;}
  .drow .k{color:var(--muted);flex:none;min-width:96px;}
  .drow .v{flex:1;min-width:0;word-break:break-all;}
  .drow .v.ok{color:var(--ok);}
  .drow .v.err{color:var(--danger);}
  .drow .v.warn{color:var(--gold);}
  .dpre{background:#07080c;border:1px solid #1a2030;border-radius:6px;padding:8px;
    max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-all;
    font-size:10.5px;color:#98a2b8;margin-top:5px;}
  .diag-foot{padding:0 13px 13px;display:flex;gap:7px;}
  .diag-btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .diag-btn.primary{background:linear-gradient(180deg,var(--brand2),var(--brand));
    border-color:transparent;color:#fff;}
  
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
    background:rgba(22,27,40,.98);border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:1002;max-width:82vw;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    </div>
    <div class="title">VodCore<small>稳定重写版</small></div>
    <div class="status" id="status"><i></i><span>就绪</span></div>
  </div>

  <div class="urlbar">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="粘贴 M3U8 / 加密 M3U8 / 视频直链…">
    <button class="btn-play" id="loadBtn">播放</button>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline webkit-playsinline x5-playsinline preload="metadata"
           referrerpolicy="no-referrer"></video>
    <div class="tag" id="tag"><i id="tagDot"></i><span id="tagText">VodCore</span></div>
    <div class="bigplay" id="bigplay">
      <svg viewBox="0 0 24 24" width="58" height="58" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="ctrls" id="ctrls">
      <div class="progress" id="progress">
        <div class="track"></div>
        <div class="buf" id="progressBuf"></div>
        <div class="played" id="progressPlayed"></div>
        <div class="marks-layer" id="progressMarks"></div>
        <div class="thumb" id="progressThumb"></div>
      </div>
      <div class="row">
        <button class="ibtn" id="playBtn"></button>
        <span class="time" id="timeText">00:00 / 00:00</span>
        <div class="grow"></div>
        <select class="spd" id="speed"></select>
        <button class="ibtn" id="pipBtn" title="画中画"></button>
        <button class="ibtn" id="fsBtn" title="全屏 / 横屏"></button>
      </div>
    </div>
  </div>

  <div class="tools">
    <button class="tbtn t-flag" id="flagBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg><span>标记</span>
    </button>
    <button class="tbtn t-dec" id="decBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg><span>解码</span>
    </button>
    <button class="tbtn t-diag" id="diagBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/><path d="M11 8v3M11 14h.01"/>
      </svg><span>诊断</span>
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索标记…" autocomplete="off">
    </div>
  </div>

  <div class="markList" id="markList"></div>
  <div class="empty" id="emptyTip">还没有标记 · 点击上方 🏳 旗子即可标记当前时间</div>

  <div class="dl">
    <div class="dl-h">
      <div class="dl-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
      </div>
      <div class="dl-n">
        <div class="dl-t">📥 高速下载</div>
        <div class="dl-s" id="dlSub">M3U8 · AES-128/192/256 · fMP4 · 直链</div>
      </div>
      <button class="dl-go" id="dlGo">开始下载</button>
    </div>
    <div class="dl-warn" id="dlWarn"></div>
    <div class="dl-prog" id="dlProg" hidden>
      <div class="dl-barWrap"><div class="dl-bar" id="dlBar"></div></div>
      <div class="dl-stats">
        <span>进度 <b id="dlPct">0%</b></span>
        <span>速度 <b id="dlSpd">--</b></span>
        <span>剩余 <b id="dlRem">--</b></span>
        <span>大小 <b id="dlSize">--</b></span>
      </div>
      <div class="dl-acts"><button class="dl-btn danger" id="dlCancel">取消下载</button></div>
    </div>
  </div>
</div>

<div class="menu" id="markMenu" hidden>
  <button data-a="seek">⏱ 跳转到此处</button>
  <button data-a="rename">✏️ 重命名</button>
  <button data-a="del" class="d">🗑 删除</button>
</div>

<div class="menu dec-menu" id="decMenu" hidden></div>

<div class="diag" id="diagPanel" hidden>
  <div class="diag-head">
    <b>🔍 URL 诊断</b>
    <div class="grow"></div>
    <button class="diag-close" id="diagClose">×</button>
  </div>
  <div class="diag-body" id="diagBody"></div>
  <div class="diag-foot">
    <button class="diag-btn" id="diagCopy">复制报告</button>
    <button class="diag-btn primary" id="diagRun">重新诊断</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
 *  VodCore 稳定重写版
 *  - 无全局 fetch/XHR hook（避免崩溃）
 *  - 进度条用 window 事件监听（可靠）
 *  - 全屏使用标准 API 优先
 *  - 下载简化但完整
 *  - 解密支持 AES-CBC 128/192/256 + AES-CTR
 * ================================================================ */
(function () {
  'use strict';

  /* ================= DOM ================= */
  const $ = (id) => document.getElementById(id);
  const video = $('video'), player = $('player');
  const urlInput = $('urlInput'), loadBtn = $('loadBtn');
  const tag = $('tag'), tagDot = $('tagDot'), tagText = $('tagText');
  const bigplay = $('bigplay'), spinner = $('spinner'), ctrls = $('ctrls');
  const progress = $('progress'), progressBuf = $('progressBuf');
  const progressPlayed = $('progressPlayed'), progressMarks = $('progressMarks');
  const progressThumb = $('progressThumb');
  const playBtn = $('playBtn'), timeText = $('timeText'), speed = $('speed');
  const pipBtn = $('pipBtn'), fsBtn = $('fsBtn');
  const flagBtn = $('flagBtn'), decBtn = $('decBtn'), diagBtn = $('diagBtn');
  const searchInput = $('searchInput'), markList = $('markList'), emptyTip = $('emptyTip');
  const markMenu = $('markMenu'), decMenu = $('decMenu');
  const statusEl = $('status'), toastEl = $('toast');
  const diagPanel = $('diagPanel'), diagBody = $('diagBody');
  const diagClose = $('diagClose'), diagRun = $('diagRun'), diagCopy = $('diagCopy');
  const dlSub = $('dlSub'), dlWarn = $('dlWarn'), dlGo = $('dlGo');
  const dlProg = $('dlProg'), dlBar = $('dlBar'), dlPct = $('dlPct');
  const dlSpd = $('dlSpd'), dlRem = $('dlRem'), dlSize = $('dlSize'), dlCancel = $('dlCancel');

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const ICON_PIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>';
  const ICON_FS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  const ICON_FSOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

  playBtn.innerHTML = ICON_PLAY;
  bigplay.innerHTML = ICON_PLAY;
  pipBtn.innerHTML = ICON_PIP;
  fsBtn.innerHTML = ICON_FS;

  /* ================= 工具函数 ================= */
  function fmtT(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const p = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
  }
  function fmtBytes(n) {
    if (!isFinite(n) || n <= 0) return '--';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function fmtSpeed(b) { return (!isFinite(b) || b <= 0) ? '--' : fmtBytes(b) + '/s'; }
  function fmtRemain(s) {
    if (!isFinite(s) || s <= 0) return '--';
    if (s < 60) return Math.ceil(s) + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + Math.floor(s % 60) + 's';
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  }
  let toastTimer;
  function toast(m) {
    toastEl.textContent = m;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ================= 环境 ================= */
  const ENV = (function () {
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Chromium|Edg|OPR|FxiOS/i.test(ua);
    const isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);
    const cores = navigator.hardwareConcurrency || 4;
    const memory = navigator.deviceMemory || 4;
    const nativeHlsOk = (video.canPlayType('application/vnd.apple.mpegurl') || '').match(/maybe|probably/);
    const hlsJsOk = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
    const webCryptoOk = !!(window.crypto && window.crypto.subtle);
    return { isIOS, isAndroid, isSafari, isMobile, cores, memory,
      lowEnd: cores <= 2 || memory <= 2,
      nativeHlsOk: !!nativeHlsOk, hlsJsOk, webCryptoOk };
  })();

  /* ================= 状态 ================= */
  let currentUrl = '';
  let marks = [];
  let hasSource = false;
  let wasPlayingBeforeFullscreen = false;
  let hls = null;
  let retries = 0;

  // 标记存储
  const STORE = 'vodcore_marks_v3';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { store = {}; }
  function saveMarks() {
    if (!currentUrl) return;
    if (marks.length) store[currentUrl] = marks;
    else delete store[currentUrl];
    try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {}
  }

  /* ================= 解码器配置 ================= */
  const DECS = {
    auto: { name: '智能解码', desc: '自动选择最优', auto: true },
    boost: { name: '疾速 Turbo', desc: '高并发快速起播',
      hls: { enableWorker: true, lowLatencyMode: false, maxBufferLength: 90, maxMaxBufferLength: 200,
        backBufferLength: 60, startLevel: -1, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6 } },
    hw: { name: '硬件加速', desc: 'GPU 硬解省电',
      hls: { enableWorker: true, enableSoftwareAES: false, startLevel: -1, capLevelToPlayerSize: true } },
    sw: { name: '软件解码', desc: '主线程软解兼容强',
      hls: { enableWorker: false, enableSoftwareAES: true, startLevel: -1, maxBufferLength: 60 } },
    smooth: { name: '流畅优先', desc: '大缓冲长片首选',
      hls: { enableWorker: true, maxBufferLength: 120, maxMaxBufferLength: 300,
        backBufferLength: 180, startLevel: -1 } },
    compat: { name: '兼容模式', desc: '弱网老旧设备',
      hls: { enableWorker: false, enableSoftwareAES: true, maxBufferLength: 30, backBufferLength: 30,
        manifestLoadingMaxRetry: 8, levelLoadingMaxRetry: 8, fragLoadingMaxRetry: 10, startLevel: -1 } },
    secure: { name: '加密增强', desc: '针对 AES 加密流优化',
      hls: { enableWorker: true, enableSoftwareAES: true, maxBufferLength: 60, backBufferLength: 60,
        startLevel: -1, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6 } },
    native: { name: '原生解码', desc: 'Safari / iOS 最佳', native: true }
  };
  const DEC_ORDER = ['auto','boost','hw','sw','smooth','compat','secure','native'];
  let currentDec = 'auto';
  try { const s = localStorage.getItem('vodcore_dec'); if (s && DECS[s]) currentDec = s; } catch (e) {}

  function pickAutoDec() {
    if (ENV.isIOS) return ENV.nativeHlsOk ? 'native' : 'compat';
    if (ENV.isSafari && !ENV.isMobile) return ENV.nativeHlsOk ? 'native' : (ENV.hlsJsOk ? 'hw' : 'compat');
    if (!ENV.hlsJsOk) return ENV.nativeHlsOk ? 'native' : 'compat';
    if (ENV.lowEnd) return 'compat';
    if (ENV.isMobile) return 'smooth';
    return 'boost';
  }
  function resolveDec(k) {
    if (DECS[k] && DECS[k].auto) {
      const p = pickAutoDec();
      return DECS[p] ? p : 'compat';
    }
    return DECS[k] ? k : 'compat';
  }

  /* ================= UI 状态 ================= */
  function setStatus(t, ok) {
    statusEl.querySelector('span').textContent = t;
    const i = statusEl.querySelector('i');
    i.style.background = ok ? 'var(--ok)' : 'var(--danger)';
    i.style.boxShadow = ok ? '0 0 6px var(--ok)' : '0 0 6px var(--danger)';
  }
  let tagTimer;
  function setTag(text, mode) {
    tagText.textContent = text;
    tagDot.className = '';
    if (mode === 'enc') tagDot.classList.add('enc');
    else if (mode === 'err') tagDot.classList.add('err');
    tag.classList.add('show');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(() => tag.classList.remove('show'), 4500);
  }
  let spinTimer, spinShown = false;
  function showSpinNow() {
    clearTimeout(spinTimer);
    spinShown = true;
    spinner.classList.add('show');
  }
  function hideSpin() {
    clearTimeout(spinTimer);
    spinShown = false;
    spinner.classList.remove('show');
  }
  function scheduleSpin(d) {
    if (spinShown) return;
    clearTimeout(spinTimer);
    spinTimer = setTimeout(() => {
      if (video.readyState < 3 && !video.paused && hasSource) {
        spinShown = true;
        spinner.classList.add('show');
      }
    }, d || 500);
  }

  /* ================= 播放控制 ================= */
  function togglePlay() {
    if (!hasSource) { toast('请先输入链接'); return; }
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }
  function syncPlayIcon() {
    playBtn.innerHTML = video.paused ? ICON_PLAY : ICON_PAUSE;
    bigplay.classList.toggle('show', video.paused && hasSource && video.readyState > 0);
  }
  playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  // 点击视频区域切换播放（不包含控制栏）
  video.addEventListener('click', () => {
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  });

  video.addEventListener('play', () => { syncPlayIcon(); showCtrls(); });
  video.addEventListener('pause', () => { syncPlayIcon(); showCtrls(); });
  video.addEventListener('waiting', () => scheduleSpin(500));
  video.addEventListener('stalled', () => scheduleSpin(700));
  video.addEventListener('playing', hideSpin);
  video.addEventListener('canplay', hideSpin);
  video.addEventListener('canplaythrough', hideSpin);
  video.addEventListener('seeked', hideSpin);
  video.addEventListener('loadeddata', hideSpin);
  video.addEventListener('loadedmetadata', () => {
    hideSpin();
    renderMarksLayer();
    updateTimeText();
    updateFsIcon();
  });
  video.addEventListener('durationchange', renderMarksLayer);

  /* ================= 控制栏显示/隐藏 ================= */
  let ctrlTimer;
  function showCtrls() {
    ctrls.classList.remove('hide');
    clearTimeout(ctrlTimer);
    if (!video.paused && !dragging) {
      ctrlTimer = setTimeout(() => {
        if (!dragging) ctrls.classList.add('hide');
      }, 3200);
    }
  }
  player.addEventListener('pointermove', showCtrls);
  player.addEventListener('pointerdown', showCtrls);

  /* ================= 进度条（可靠重写） ================= */
  let dragging = false;
  let dragPct = 0;
  let ctrlWasVisible = false;

  function getPct(e) {
    const rect = progress.getBoundingClientRect();
    if (rect.width === 0) return 0;
    const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - rect.left;
    return Math.max(0, Math.min(1, x / rect.width));
  }
  function renderProgress(p) {
    progressPlayed.style.width = (p * 100) + '%';
    progressThumb.style.left = (p * 100) + '%';
    if (isFinite(video.duration) && video.duration > 0) {
      timeText.textContent = fmtT(p * video.duration) + ' / ' + fmtT(video.duration);
    }
  }
  function onProgressDown(e) {
    if (e.button !== undefined && e.button > 0) return;
    if (!hasSource) return;
    dragging = true;
    dragPct = getPct(e);
    progress.classList.add('dragging');
    renderProgress(dragPct);
    ctrlWasVisible = !ctrls.classList.contains('hide');
    showCtrls();
    clearTimeout(ctrlTimer);
    e.preventDefault();
  }
  function onProgressMove(e) {
    if (!dragging) return;
    dragPct = getPct(e);
    renderProgress(dragPct);
    e.preventDefault();
  }
  function onProgressUp(e) {
    if (!dragging) return;
    dragging = false;
    progress.classList.remove('dragging');
    const d = video.duration;
    if (isFinite(d) && d > 0 && hasSource) {
      const t = Math.min(d - 0.05, Math.max(0, dragPct * d));
      try { video.currentTime = t; } catch (err) {}
      scheduleSpin(280);
    }
    showCtrls();
  }
  progress.addEventListener('pointerdown', onProgressDown);
  window.addEventListener('pointermove', onProgressMove, { passive: false });
  window.addEventListener('pointerup', onProgressUp);
  window.addEventListener('pointercancel', onProgressUp);

  function updateTimeText() {
    if (isFinite(video.duration) && video.duration > 0) {
      timeText.textContent = fmtT(video.currentTime) + ' / ' + fmtT(video.duration);
    } else {
      timeText.textContent = fmtT(video.currentTime) + ' / --:--';
    }
  }
  function loop() {
    if (!dragging) {
      const d = video.duration;
      if (isFinite(d) && d > 0) {
        const p = video.currentTime / d;
        progressPlayed.style.width = (p * 100) + '%';
        progressThumb.style.left = (p * 100) + '%';
      }
      updateTimeText();
      let bufEnd = 0;
      try {
        for (let i = 0; i < video.buffered.length; i++) {
          if (video.buffered.start(i) <= video.currentTime && video.currentTime <= video.buffered.end(i)) {
            bufEnd = video.buffered.end(i);
            break;
          }
        }
      } catch (e) {}
      if (isFinite(d) && d > 0) progressBuf.style.width = (bufEnd / d * 100) + '%';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 倍速 ================= */
  const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5, 6, 7, 8, 10, 12, 15, 18];
  SPEEDS.forEach((s) => {
    const o = document.createElement('option');
    o.value = String(s);
    o.textContent = s + 'x';
    if (s === 1) o.selected = true;
    speed.appendChild(o);
  });
  speed.addEventListener('change', () => {
    const r = parseFloat(speed.value);
    video.playbackRate = r;
    setTimeout(() => {
      if (Math.abs(video.playbackRate - r) > 0.01) toast('浏览器限制，实际 ' + video.playbackRate + 'x');
    }, 60);
  });
  video.addEventListener('ratechange', () => {
    const v = video.playbackRate;
    const opts = speed.options;
    for (let i = 0; i < opts.length; i++) {
      if (Math.abs(parseFloat(opts[i].value) - v) < 0.001) { speed.value = String(v); return; }
    }
  });

  /* ================= 画中画 ================= */
  if (!document.pictureInPictureEnabled && !video.webkitSetPresentationMode) {
    pipBtn.style.display = 'none';
  }
  pipBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (document.pictureInPictureEnabled) {
      if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
      else video.requestPictureInPicture().catch(() => toast('无法开启画中画'));
      return;
    }
    if (video.webkitSetPresentationMode) {
      try {
        video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
      } catch (err) { toast('无法开启画中画'); }
      return;
    }
    toast('当前浏览器不支持画中画');
  });

  /* ================= 全屏 / 横屏（重写） ================= */
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
      document.mozFullScreenElement || document.msFullscreenElement ||
      video.webkitDisplayingFullscreen);
  }
  function updateFsIcon() {
    fsBtn.innerHTML = isFullscreen() ? ICON_FSOUT : ICON_FS;
    fsBtn.title = isFullscreen() ? '退出全屏' : '全屏 / 横屏';
  }
  async function enterFullscreen() {
    wasPlayingBeforeFullscreen = !video.paused;
    let ok = false;
    const el = player;
    try {
      if (el.requestFullscreen) { await el.requestFullscreen(); ok = true; }
      else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); ok = true; }
      else if (el.webkitRequestFullScreen) { el.webkitRequestFullScreen(); ok = true; }
      else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); ok = true; }
      else if (el.msRequestFullscreen) { el.msRequestFullscreen(); ok = true; }
    } catch (e) { ok = false; }
    if (!ok && video.webkitEnterFullscreen) {
      try { video.webkitEnterFullscreen(); ok = true; } catch (e) { ok = false; }
    }
    if (!ok) { toast('当前浏览器不支持全屏'); return; }
    // 尝试锁定横屏
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {}
    setTimeout(updateFsIcon, 120);
  }
  async function exitFullscreen() {
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
    try {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.webkitCancelFullScreen) document.webkitCancelFullScreen();
      else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    } catch (e) {}
    if (video.webkitDisplayingFullscreen) {
      try { video.webkitExitFullscreen(); } catch (e) {}
    }
    setTimeout(updateFsIcon, 120);
  }
  fsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isFullscreen()) exitFullscreen();
    else enterFullscreen();
  });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach((ev) => {
    document.addEventListener(ev, () => {
      updateFsIcon();
      // 全屏切换后如果之前在播放，保持播放
      if (isFullscreen() && wasPlayingBeforeFullscreen && video.paused) {
        video.play().catch(() => {});
      }
    });
  });
  video.addEventListener('webkitbeginfullscreen', updateFsIcon);
  video.addEventListener('webkitendfullscreen', updateFsIcon);

  /* ================= 键盘 ================= */
  document.addEventListener('keydown', (e) => {
    const t = (e.target.tagName || '').toUpperCase();
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); showCtrls(); }
    else if (e.code === 'ArrowRight') { video.currentTime = Math.min((video.duration || 0) - 0.05, video.currentTime + 5); showCtrls(); }
    else if (e.code === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 5); showCtrls(); }
    else if (e.key === 'm' || e.key === 'M') addMark();
    else if (e.key === 'f' || e.key === 'F') { isFullscreen() ? exitFullscreen() : enterFullscreen(); }
  });

  /* ================= 探测链接内容 ================= */
  async function probeUrl(url) {
    // 直链视频跳过探测
    if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
      return { type: 'direct' };
    }
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 5000);
      const res = await fetch(url, {
        signal: ctrl.signal,
        method: 'GET',
        credentials: 'omit',
        mode: 'cors',
        cache: 'no-store',
        referrerPolicy: 'no-referrer'
      });
      clearTimeout(t);
      if (!res.ok) return { type: 'http_error', status: res.status, message: 'HTTP ' + res.status };
      const text = await res.text();
      if (/^\s*#EXTM3U/i.test(text)) {
        return {
          type: 'm3u8',
          encrypted: /#EXT-X-KEY:METHOD=(AES-128|AES-192|AES-256|SAMPLE-AES|SAMPLE-AES-CTR)/i.test(text),
          text,
          redirected: res.redirected,
          finalUrl: res.url
        };
      }
      const head = text.trim().slice(0, 200).toLowerCase();
      if (head.startsWith('<!doctype') || head.startsWith('<html')) {
        return { type: 'html', message: '服务器返回 HTML 页面，不是 M3U8',
          preview: text.slice(0, 300), redirected: res.redirected, finalUrl: res.url };
      }
      return { type: 'unknown', message: '返回的不是 M3U8', preview: text.slice(0, 300),
        redirected: res.redirected, finalUrl: res.url };
    } catch (e) {
      return { type: 'network_error', message: e.message || '网络请求失败' };
    }
  }

  /* ================= 加载视频 ================= */
  async function loadStream(url, resumeAt) {
    url = (url || '').trim();
    if (!url) { toast('请输入链接'); return; }
    resumeAt = resumeAt || 0;

    currentUrl = url;
    marks = (store[url] || []).slice();
    renderMarks();
    renderMarksLayer();

    // 清理旧内核
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    retries = 0;
    hasSource = true;
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}

    showSpinNow();
    setStatus('加载中…', true);

    const probe = await probeUrl(url);

    // 内容校验
    if (probe.type === 'html' || probe.type === 'unknown') {
      hideSpin(); setStatus('内容校验失败', false);
      setTag('⚠️ 返回的不是 M3U8', 'err');
      toast('警告：' + probe.message);
      showDiagReport(buildDiagReport(url, probe));
      return;
    }
    if (probe.type === 'http_error' || probe.type === 'network_error') {
      hideSpin(); setStatus('加载失败', false);
      setTag('⚠️ ' + (probe.message || '网络失败'), 'err');
      toast('加载失败：' + (probe.message || '网络失败'));
      showDiagReport(buildDiagReport(url, probe));
      return;
    }
    if (probe.redirected && probe.finalUrl && probe.finalUrl !== url) {
      console.warn('[VodCore] URL 被重定向：', url, '→', probe.finalUrl);
      toast('⚠️ URL 被重定向');
    }

    const decKey = resolveDec(currentDec);
    const dec = DECS[decKey] || DECS.compat;
    const isDirect = probe.type === 'direct';
    const useHlsJs = !isDirect && ENV.hlsJsOk && !dec.native;
    const tagMode = probe.encrypted ? 'enc' : '';
    setTag('VodCore · ' + (isDirect ? '直链' : dec.name), tagMode);

    if (currentDec === 'auto' && !isDirect) {
      toast('智能解码 → ' + dec.name);
    }

    if (useHlsJs) loadWithHlsJs(url, dec, resumeAt);
    else if (ENV.nativeHlsOk || isDirect) loadWithNative(url, resumeAt);
    else {
      hideSpin();
      setStatus('无可用解码', false);
      toast('请点击「解码」切换方案');
    }
  }

  function loadWithHlsJs(url, dec, resumeAt) {
    const baseCfg = {
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 60,
      maxBufferLength: 60,
      maxMaxBufferLength: 180,
      manifestLoadingMaxRetry: 4,
      levelLoadingMaxRetry: 4,
      fragLoadingMaxRetry: 6,
      manifestLoadingTimeOut: 20000,
      levelLoadingTimeOut: 20000,
      fragLoadingTimeOut: 30000,
      startLevel: -1,
      xhrSetup: (xhr) => { try { xhr.withCredentials = false; } catch (e) {} }
    };
    const cfg = Object.assign(baseCfg, dec.hls || {});
    let h;
    try { h = new window.Hls(cfg); }
    catch (e) {
      hideSpin(); setStatus('内核启动失败', false);
      toast('HLS 启动失败：' + e.message);
      return;
    }
    hls = h;

    h.on(window.Hls.Events.KEY_LOADING, () => setTag('VodCore · 解密中…', 'enc'));
    h.on(window.Hls.Events.KEY_LOADED, () => setTag('VodCore · 已解密', 'enc'));

    h.on(window.Hls.Events.MANIFEST_PARSED, () => {
      hideSpin();
      setStatus('播放中', true);
      if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
      video.play().catch(() => {});
    });

    h.on(window.Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && retries < 4) {
        retries++;
        toast('网络抖动，重试 (' + retries + '/4)…');
        try { h.startLoad(); } catch (e) {}
        return;
      }
      if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && retries < 4) {
        retries++;
        toast('解码恢复中 (' + retries + '/4)…');
        try { h.recoverMediaError(); } catch (e) {}
        return;
      }
      if (data.details && /key/i.test(data.details)) {
        hideSpin();
        setStatus('解密失败', false);
        setTag('⚠️ 解密失败', 'err');
        toast('解密失败：' + data.details);
        return;
      }
      if (retries >= 4 && currentDec !== 'compat') {
        toast('多次失败，自动降级至兼容模式…');
        currentDec = 'compat';
        try { localStorage.setItem('vodcore_dec', 'compat'); } catch (e) {}
        updateDecBtn();
        loadStream(currentUrl, video.currentTime || 0);
        return;
      }
      hideSpin();
      setStatus('播放失败', false);
      setTag('⚠️ 播放失败', 'err');
      toast('播放失败：' + (data.details || '未知错误'));
    });

    h.loadSource(url);
    h.attachMedia(video);
  }

  function loadWithNative(url, resumeAt) {
    try { video.referrerPolicy = 'no-referrer'; } catch (e) {}

    const onMeta = () => {
      video.removeEventListener('loadedmetadata', onMeta);
      hideSpin();
      setStatus('播放中', true);
      setTag('VodCore · 原生解码', '');
      if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
      video.play().catch(() => {});
    };
    video.addEventListener('loadedmetadata', onMeta);

    const onErr = () => {
      video.removeEventListener('error', onErr);
      hideSpin();
      setStatus('原生失败', false);
      if (currentDec !== 'compat' && ENV.hlsJsOk) {
        toast('原生失败，切 HLS 内核…');
        currentDec = 'compat';
        try { localStorage.setItem('vodcore_dec', 'compat'); } catch (e) {}
        updateDecBtn();
        loadStream(currentUrl, video.currentTime || 0);
      } else {
        toast('原生解码失败，请点击「解码」切换');
      }
    };
    video.addEventListener('error', onErr, { once: true });

    video.src = url;
  }

  /* ================= 解码菜单 ================= */
  function updateDecBtn() {
    const d = DECS[currentDec] || DECS.auto;
    let tip = '当前：' + d.name;
    if (d.auto) {
      const r = resolveDec('auto');
      tip = '智能 → ' + (DECS[r] ? DECS[r].name : '兼容');
    }
    decBtn.title = tip + '（点击切换）';
  }
  function renderDecMenu() {
    decMenu.innerHTML = '';
    const real = resolveDec(currentDec);
    const title = document.createElement('div');
    title.className = 'dec-title';
    title.innerHTML = '<span>VodCore 解码引擎</span>' +
      (ENV.hlsJsOk ? '<span class="badge">HLS 已就绪</span>' : '<span class="badge">仅原生</span>');
    decMenu.appendChild(title);

    DEC_ORDER.forEach((k) => {

      if (disabled) b.disabled = true;
      let n = '<span class="dn">' + d.name;

      n += '</span>';

      b.innerHTML = n + '<span class="dd">' + desc + '</span>';

      if (k === 'auto') {
        const s = document.createElement('div');
        s.className = 'sep';
        decMenu.appendChild(s);
      }

  }
  function openDecMenu() {
    renderDecMenu();
    decMenu.hidden = false;
    const r = decBtn.getBoundingClientRect();
    const w = decMenu.offsetWidth, h = decMenu.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 10);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 6);
    decMenu.style.left = Math.max(10, left) + 'px';
    decMenu.style.top = Math.max(10, top) + 'px';
  }
  decBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!decMenu.hidden) { decMenu.hidden = true; return; }
    openDecMenu();
  });
  decMenu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-dec]');
    if (!b || b.disabled) return;
    const k = b.dataset.dec;
    decMenu.hidden = true;
    if (k === currentDec) { toast('当前已是该解码'); return; }
    currentDec = k;
    try { localStorage.setItem('vodcore_dec', k); } catch (e) {}
    updateDecBtn();
    const real = resolveDec(k);
    toast('已切换：' + DECS[k].name + (DECS[k].auto ? '（实际：' + DECS[real].name + '）' : ''));
    if (currentUrl) loadStream(currentUrl, isFinite(video.currentTime) ? video.currentTime : 0);
  });

  /* ================= 标记系统 ================= */
  function renderMarksLayer() {
    progressMarks.innerHTML = '';
    const d = video.duration;
    if (!isFinite(d) || d <= 0) return;
    const frag = document.createDocumentFragment();
    marks.forEach((m) => {
      const i = document.createElement('i');
      i.style.left = Math.min(100, Math.max(0, (m.time / d) * 100)) + '%';
      frag.appendChild(i);
    });
    progressMarks.appendChild(frag);
  }
  function renderMarks() {
    const q = searchInput.value.trim().toLowerCase();
    markList.innerHTML = '';
    if (marks.length === 0) {
      emptyTip.hidden = false;
      emptyTip.textContent = '还没有标记 · 点击上方 🏳 旗子即可标记当前时间';
      return;
    }
    emptyTip.hidden = true;
    const list = q ? marks.filter((m) =>
      (m.title || '').toLowerCase().includes(q) || fmtT(m.time).toLowerCase().includes(q)) : marks;
    if (!list.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = '没有找到「' + q + '」';
      markList.appendChild(d);
      return;
    }
    const frag = document.createDocumentFragment();
    list.forEach((m) => frag.appendChild(buildMarkEl(m)));
    markList.appendChild(frag);
  }
  function buildMarkEl(m) {
    const el = document.createElement('div');
    el.className = 'mark';
    const dot = document.createElement('span'); dot.className = 'dot';
    const t = document.createElement('span'); t.className = 'mt'; t.textContent = fmtT(m.time);
    const tt = document.createElement('span'); tt.className = 'mtitle'; tt.textContent = m.title || '未命名标记';
    const del = document.createElement('button'); del.className = 'mdel'; del.type = 'button';
    del.title = '点击删除 · 长按清空全部'; del.innerHTML = ICON_TRASH;
    el.append(dot, t, tt, del);

    let markPressTimer = null;
    let markLongFired = false;
    let markMoved = false;
    let markSx = 0, markSy = 0;

    el.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      if (e.target === del || del.contains(e.target)) return;
      markLongFired = false;
      markMoved = false;
      markSx = e.clientX; markSy = e.clientY;
      markPressTimer = setTimeout(() => {
        markPressTimer = null;
        markLongFired = true;
        openMarkMenu(m, el);
      }, 520);
    });
    el.addEventListener('pointermove', (e) => {
      if (markMoved || !markPressTimer) return;
      if (Math.abs(e.clientX - markSx) > 8 || Math.abs(e.clientY - markSy) > 8) {
        markMoved = true;
        clearTimeout(markPressTimer);
        markPressTimer = null;
      }
    });
    el.addEventListener('pointerup', (e) => {
      if (markPressTimer) {
        clearTimeout(markPressTimer);
        markPressTimer = null;
        if (!markLongFired && !markMoved && e.target !== del && !del.contains(e.target)) {
          video.currentTime = m.time;
          toast('跳转 ' + fmtT(m.time));
        }
      }
    });
    el.addEventListener('pointercancel', () => {
      if (markPressTimer) { clearTimeout(markPressTimer); markPressTimer = null; }
    });

    // 删除按钮
    let delPressTimer = null;
    let delLongFired = false;
    del.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      delLongFired = false;
      delPressTimer = setTimeout(() => {
        delPressTimer = null;
        delLongFired = true;
        clearAllMarks();
      }, 620);
      e.stopPropagation();
    });
    del.addEventListener('pointerup', (e) => {
      if (delPressTimer) {
        clearTimeout(delPressTimer);
        delPressTimer = null;
        if (!delLongFired) {
          deleteMark(m.id);
        }
      }
      e.stopPropagation();
    });
    del.addEventListener('pointercancel', () => {
      if (delPressTimer) { clearTimeout(delPressTimer); delPressTimer = null; }
    });

    return el;
  }
  function addMark() {
    if (!hasSource) { toast('请先输入链接'); return; }
    const t = video.currentTime;
    if (!isFinite(t)) { toast('视频未就绪'); return; }
    marks.push({
      id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      time: t,
      title: '标记 ' + (marks.length + 1)
    });
    marks.sort((a, b) => a.time - b.time);
    saveMarks();
    renderMarks();
    renderMarksLayer();
    toast('已标记 ' + fmtT(t));
  }
  function deleteMark(id) {
    marks = marks.filter((m) => m.id !== id);
    saveMarks(); renderMarks(); renderMarksLayer();
    toast('已删除');
  }
  function clearAllMarks() {
    if (!marks.length) { toast('没有标记'); return; }
    if (!confirm('删除全部 ' + marks.length + ' 个标记？此操作不可撤销。')) return;
    marks = [];
    saveMarks(); renderMarks(); renderMarksLayer();
    toast('已清空');
  }
  flagBtn.addEventListener('click', addMark);
  searchInput.addEventListener('input', renderMarks);

  let markMenuId = null;
  function openMarkMenu(m, anchor) {
    markMenuId = m.id;
    markMenu.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = markMenu.offsetWidth, h = markMenu.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 10);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 6);
    markMenu.style.left = Math.max(10, left) + 'px';
    markMenu.style.top = Math.max(10, top) + 'px';
  }
  markMenu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    const m = marks.find((x) => x.id === markMenuId);
    markMenu.hidden = true;
    if (!m) return;
    if (a === 'seek') { video.currentTime = m.time; toast('跳转 ' + fmtT(m.time)); }
    else if (a === 'rename') {
      const n = prompt('重命名标记', m.title || '');
      if (n !== null) { m.title = n; saveMarks(); renderMarks(); toast('已重命名'); }
    } else if (a === 'del') deleteMark(m.id);
  });

  /* 全局点击关闭菜单 */
  document.addEventListener('click', (e) => {
    if (!markMenu.hidden && !markMenu.contains(e.target)) markMenu.hidden = true;
    if (!decMenu.hidden && !decMenu.contains(e.target) && !decBtn.contains(e.target)) decMenu.hidden = true;
  });

  /* ================= 下载内核（稳定重写） ================= */
  const Downloader = {
    active: false,
    ctrl: null,
    stats: { start: 0, downloaded: 0, total: 0, done: 0, segs: 0, speed: 0 },
    isActive() { return this.active; },

    cancel() {
      if (this.ctrl) { try { this.ctrl.abort(); } catch (e) {} toast('取消中…'); }
    },

    reset() {
      this.setWarn('');
      this.setState('idle');
    },

    setSub(t) { dlSub.textContent = t; },
    setWarn(m) {
      if (m) { dlWarn.innerHTML = m; dlWarn.classList.add('show'); }
      else dlWarn.classList.remove('show');
    },
    setState(s, info) {
      info = info || {};
      if (s === 'idle') {
        dlProg.hidden = true;
        dlGo.disabled = false;
        dlGo.textContent = '开始下载';
        this.setSub(info.sub || 'M3U8 · AES-128/192/256 · fMP4 · 直链');
      } else if (s === 'prep') {
        dlProg.hidden = false;
        dlGo.disabled = true;
        dlGo.textContent = '准备中';
        dlBar.classList.add('ind');
        dlBar.style.width = '';
        dlPct.textContent = '0%';
        dlSpd.textContent = '--';
        dlRem.textContent = '--';
        dlSize.textContent = '--';
        dlCancel.disabled = false;
        dlCancel.textContent = '取消下载';
        this.setSub(info.sub || '解析中…');
      } else if (s === 'dl') {
        dlProg.hidden = false;
        dlGo.disabled = true;
        dlGo.textContent = '下载中';
        dlBar.classList.remove('ind');
        dlCancel.disabled = false;
        this.setSub(info.sub || '下载中…');
      } else if (s === 'merge') {
        dlProg.hidden = false;
        dlBar.classList.add('ind');
        dlGo.disabled = true;
        dlGo.textContent = '合并中';
        dlCancel.disabled = true;
        this.setSub(info.sub || '合并中…');
      } else if (s === 'done') {
        dlGo.disabled = false;
        dlGo.textContent = '重新下载';
        dlBar.classList.remove('ind');
        dlBar.style.width = '100%';
        dlPct.textContent = '100%';
        dlCancel.disabled = true;
        dlCancel.textContent = '已完成';
        this.setSub(info.sub || '已保存');
      } else if (s === 'err') {
        dlGo.disabled = false;
        dlGo.textContent = '重试';
        dlBar.classList.remove('ind');
        dlCancel.disabled = true;
        this.setSub('下载失败');
      } else if (s === 'cancel') {
        dlProg.hidden = true;
        dlGo.disabled = false;
        dlGo.textContent = '重新下载';
        this.setSub('已取消');
      }
    },
    updateProgress() {
      const s = this.stats;
      const el = (Date.now() - s.start) / 1000;
      const sp = el > 0 ? s.downloaded / el : 0;
      s.speed = sp;
      let p = 0;
      if (s.segs) p = s.done / s.segs;
      else if (s.total) p = s.downloaded / s.total;
      dlBar.style.width = (p * 100).toFixed(1) + '%';
      dlPct.textContent = (p * 100).toFixed(1) + '%';
      dlSpd.textContent = fmtSpeed(sp);
      dlSize.textContent = fmtBytes(s.downloaded);
      if (sp > 0 && s.segs && s.done > 0) {
        const avg = s.downloaded / s.done;
        dlRem.textContent = fmtRemain((s.segs - s.done) * avg / sp);
      } else if (sp > 0 && s.total) {
        dlRem.textContent = fmtRemain((s.total - s.downloaded) / sp);
      } else dlRem.textContent = '--';
    },
    async fetchBin(url, signal, br) {
      const init = {
        signal,
        credentials: 'omit',
        mode: 'cors',
        cache: 'no-store',
        referrerPolicy: 'no-referrer'
      };
      if (br && br.length) {
        const st = br.offset || 0;
        init.headers = { Range: `bytes=${st}-${st + br.length - 1}` };
      }
      const res = await fetch(url, init);
      if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
      return new Uint8Array(await res.arrayBuffer());
    },
    async fetchText(url, signal) {
      const res = await fetch(url, {
        signal, credentials: 'omit', mode: 'cors', cache: 'no-store',
        referrerPolicy: 'no-referrer'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return { text: await res.text(), finalUrl: res.url };
    },
    async resolvePlaylist(url, signal, depth) {
      depth = depth || 0;
      if (depth > 5) throw new Error('M3U8 嵌套过深');
      const { text, finalUrl } = await this.fetchText(url, signal);
      if (!/^\s*#EXTM3U/i.test(text)) {
        throw new Error('返回的不是 M3U8（可能是 HTML 或被替换的内容）');
      }
      const pl = parseM3U8(text, finalUrl);
      if (pl.isMaster) {
        if (!pl.variants.length) throw new Error('Master 无可用流');
        pl.variants.sort((a, b) => {
          const sa = (a.resolution || '0x0').split('x').reduce((x, y) => x * (parseInt(y, 10) || 0), 1) || 0;
          const sb = (b.resolution || '0x0').split('x').reduce((x, y) => x * (parseInt(y, 10) || 0), 1) || 0;
          if (sb !== sa) return sb - sa;
          return (b.bandwidth || 0) - (a.bandwidth || 0);
        });
        const best = pl.variants[0];
        this.setState('prep', { sub: '已选流 ' + (best.resolution || best.name || '默认') + '，继续解析…' });
        return await this.resolvePlaylist(best.url, signal, depth + 1);
      }
      return pl;
    },
    async start(url) {
      if (this.active) { toast('已有下载任务'); return; }
      if (!url) { toast('请先输入链接'); return; }

      if (!ENV.webCryptoOk) {
        this.setWarn('⚠️ 当前环境不支持 WebCrypto（需 HTTPS），加密流将无法解密。');
      } else {
        this.setWarn('');
      }

      this.active = true;
      this.ctrl = new AbortController();
      this.stats = { start: Date.now(), downloaded: 0, total: 0, done: 0, segs: 0, speed: 0 };
      KeyCache.clear();
      this.setState('prep', { sub: '解析中…' });

      const signal = this.ctrl.signal;

      try {
        if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
          await this.dlDirect(url, signal);
        } else {
          await this.dlM3U8(url, signal);
        }
      } catch (e) {
        if (signal.aborted || e.name === 'AbortError') {
          this.setState('cancel'); toast('已取消');
        } else {
          console.error('[Downloader]', e);
          this.setState('err');
          const m = e.message || '未知错误';
          let h = '⚠️ ' + m;
          if (/Failed to fetch|NetworkError|Load failed/i.test(m)) {
            h = '⚠️ 网络请求被阻止（CORS 跨域）。目标服务器未开放跨域访问。<br>建议：<br>· 用「诊断」检查链接实际返回的内容<br>· 若确实需要跨域下载，需目标服务器配置 CORS，或使用同源的下载工具';
          } else if (/不是 M3U8|HTML/i.test(m)) {
            h = '⚠️ ' + m + '<br>请用「诊断」查看服务器实际返回的内容。';
          } else if (/WebCrypto/i.test(m)) {
            h = '⚠️ ' + m + '<br>请使用 HTTPS 部署本页面。';
          }
          this.setWarn(h);
          toast('下载失败：' + m);
        }
      } finally {
        this.active = false;
        this.ctrl = null;
      }
    },
    async dlDirect(url, signal) {
      this.setState('dl', { sub: '下载文件…' });
      const res = await fetch(url, {
        signal, credentials: 'omit', mode: 'cors', cache: 'no-store',
        referrerPolicy: 'no-referrer'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      this.stats.total = parseInt(res.headers.get('content-length') || '0', 10);
      if (!res.body) throw new Error('响应无 body');
      const chunks = [];
      const reader = res.body.getReader();
      let got = 0, last = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        this.stats.downloaded = got;
        const now = Date.now();
        if (now - last > 180) { last = now; this.updateProgress(); }
      }
      this.stats.downloaded = got;
      this.updateProgress();
      this.setState('merge', { sub: '保存中…' });
      const ext = (url.match(/\.(mp4|webm|mov|m4v|mkv|flv|avi|wmv|3gp)(\?|#|$)/i) || [, 'mp4'])[1];
      const blob = new Blob(chunks, { type: 'video/' + ext });
      saveBlobToDisk(blob, guessFilename(url, ext));
      this.setState('done', { sub: '已保存 · ' + fmtBytes(blob.size) });
      toast('下载完成 · ' + fmtBytes(blob.size));
    },
    async dlM3U8(url, signal) {
      const pl = await this.resolvePlaylist(url, signal);
      if (!pl.segments.length) throw new Error('未找到视频分片');

      // 加密检查
      const methods = new Set();
      if (pl.initSegment && pl.initSegment.key) methods.add(pl.initSegment.key.method);
      pl.segments.forEach((s) => { if (s.key) methods.add(s.key.method); });
      if (methods.has('SAMPLE-AES')) {
        throw new Error('SAMPLE-AES 加密流需要解析 MPEG-TS 容器内的样本结构，浏览器端无法完成。请使用支持该格式的下载工具（如 ffmpeg / N_m3u8DL-RE）');
      }
      if (methods.has('SAMPLE-AES-CTR')) {
        // 尽力尝试
      }

      const encLabel = methods.size ? Array.from(methods).join('+') : '未加密';
      const isFMP4 = !!pl.initSegment;
      const ext = isFMP4 ? 'mp4' : 'ts';
      const mime = isFMP4 ? 'video/mp4' : 'video/mp2t';
      const total = pl.segments.length;
      this.stats.segs = total;
      this.setState('dl', { sub: `共 ${total} 段 · ${encLabel}` });

      const chunks = new Array(total);
      // 控制并发
      const conc = Math.max(4, Math.min(8, ENV.cores || 4));
      let nextIdx = 0, done = 0, last = 0;
      const self = this;

      const worker = async () => {
        while (true) {
          if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
          const i = nextIdx++;
          if (i >= total) return;
          const seg = pl.segments[i];
          let attempt = 0, lastErr;
          while (attempt < 3) {
            try {
              let data = await self.fetchBin(seg.url, signal, seg.byteRange);
              if (seg.key && seg.key.method && seg.key.method.toUpperCase() !== 'NONE') {
                data = await decryptSegment(data, seg.key, seg.sequence, signal);
              }
              chunks[i] = data;
              lastErr = null;
              break;
            } catch (err) {
              lastErr = err;
              attempt++;
              if (attempt >= 3 || signal.aborted) throw err;
              await new Promise((r) => setTimeout(r, 300 * attempt));
            }
          }
          if (lastErr) throw lastErr;
          done++;
          self.stats.done = done;
          self.stats.downloaded += chunks[i].byteLength;
          const now = Date.now();
          if (now - last > 180) {
            last = now;
            self.updateProgress();
            dlSub.textContent = `共 ${total} 段 · ${encLabel} · ${done}/${total}`;
          }
        }
      };
      const workers = [];
      for (let i = 0; i < conc; i++) workers.push(worker());
      await Promise.all(workers);
      self.updateProgress();

      // fMP4 初始化段
      let initData = null;
      if (pl.initSegment) {
        this.setState('merge', { sub: '处理初始化段…' });
        initData = await this.fetchBin(pl.initSegment.url, signal, null);
        if (pl.initSegment.key && pl.initSegment.key.method && pl.initSegment.key.method.toUpperCase() !== 'NONE') {
          initData = await decryptSegment(initData, pl.initSegment.key, 0, signal);
        }
      }

      this.setState('merge', { sub: `合并 ${total} 个分片…` });
      const parts = [];
      if (initData) parts.push(initData);
      for (let i = 0; i < total; i++) if (chunks[i]) parts.push(chunks[i]);

      const blob = new Blob(parts, { type: mime });
      saveBlobToDisk(blob, guessFilename(url, ext));
      this.setState('done', { sub: '已保存 · ' + fmtBytes(blob.size) });
      toast('下载完成 · ' + fmtBytes(blob.size));
    }
  };

  /* ============ M3U8 解析器（稳定） ============ */
  function parseM3U8(text, baseUrl) {
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (!lines[0] || lines[0].indexOf('#EXTM3U') !== 0) throw new Error('缺少 #EXTM3U 头');
    const r = { isMaster: false, variants: [], segments: [], initSegment: null, encMethods: new Set() };
    const resolve = (u) => { try { return new URL(u, baseUrl).href; } catch (e) { return u; } };
    const parseAttrs = (line) => {
      const a = {};
      const re = /([A-Z0-9-]+)=("([^"]*)"|[^,]*)/gi;
      let m;
      while ((m = re.exec(line)) !== null) {
        a[m[1].toUpperCase()] = m[3] !== undefined ? m[3] : m[2].trim();
      }
      return a;
    };
    let ck = null, cbr = null, pd = -1, pi = null, seq = 0, lbe = 0;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (!l) continue;
      if (l[0] !== '#') {
        const uri = resolve(l);
        if (pi) { r.variants.push(Object.assign({ url: uri }, pi)); pi = null; continue; }
        if (pd >= 0) {
          r.segments.push({ url: uri, duration: pd, key: ck, sequence: seq, byteRange: cbr });
          seq++; pd = -1; cbr = null;
        }
        continue;
      }
      if (l.indexOf('#EXT-X-MEDIA-SEQUENCE:') === 0) {
        seq = parseInt(l.split(':')[1], 10) || 0;
      } else if (l.indexOf('#EXT-X-STREAM-INF:') === 0) {
        r.isMaster = true;
        const a = parseAttrs(l);
        pi = { bandwidth: parseInt(a.BANDWIDTH, 10) || 0, resolution: a.RESOLUTION || '', name: a.NAME || '' };
      } else if (l.indexOf('#EXT-X-KEY:') === 0) {
        const a = parseAttrs(l);
        const method = (a.METHOD || '').toUpperCase();
        if (!method || method === 'NONE') ck = null;
        else {
          ck = { method, uri: a.URI ? resolve(a.URI) : null, iv: a.IV || null, keyFormat: a.KEYFORMAT || 'identity' };
          r.encMethods.add(method);
        }
      } else if (l.indexOf('#EXT-X-MAP:') === 0) {
        const a = parseAttrs(l);
        if (a.URI) r.initSegment = { url: resolve(a.URI), key: ck };
      } else if (l.indexOf('#EXT-X-BYTERANGE:') === 0) {
        const p = l.split(':')[1].split('@');
        const len = parseInt(p[0], 10);
        let off;
        if (p[1] !== undefined) { off = parseInt(p[1], 10); lbe = off + len; }
        else if (lbe > 0) { off = lbe; lbe = off + len; }
        else { off = 0; lbe = len; }
        cbr = { length: len, offset: off };
      } else if (l.indexOf('#EXTINF:') === 0) {
        const rest = l.substring(8);
        const ci = rest.indexOf(',');
        pd = parseFloat(ci >= 0 ? rest.substring(0, ci) : rest) || 0;
      }
    }
    return r;
  }

  /* ============ 解密器（强化） ============ */
  const KeyCache = {
    cache: new Map(),
    has(uri) { return this.cache.has(uri); },
    get(uri) { return this.cache.get(uri); },
    set(uri, p) { this.cache.set(uri, p); },
    del(uri) { this.cache.delete(uri); },
    clear() { this.cache.clear(); }
  };

  async function getKeyBytes(uri, signal) {
    if (KeyCache.has(uri)) return KeyCache.get(uri);
    const p = (async () => {
      const res = await fetch(uri, {
        signal, credentials: 'omit', mode: 'cors', cache: 'no-store',
        referrerPolicy: 'no-referrer'
      });
      if (!res.ok) throw new Error('密钥 HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      return new Uint8Array(buf);
    })();
    KeyCache.set(uri, p);
    try { return await p; }
    catch (e) { KeyCache.del(uri); throw e; }
  }

  function hexToBytes(hex) {
    hex = String(hex).replace(/^0x/i, '').replace(/[^0-9a-f]/gi, '');
    if (hex.length % 2) hex = '0' + hex;
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    if (bytes.length === 16) return bytes;
    const p = new Uint8Array(16);
    p.set(bytes.slice(0, 16));
    return p;
  }
  function deriveIV(keyInfo, sequence) {
    if (keyInfo && keyInfo.iv) return hexToBytes(keyInfo.iv);
    const iv = new Uint8Array(16);
    new DataView(iv.buffer).setUint32(12, sequence >>> 0, false);
    return iv;
  }
  function normalizeKey(kb) {
    if (kb.length === 16 || kb.length === 24 || kb.length === 32) return kb;
    if (kb.length > 16) return kb.slice(0, 16);
    const p = new Uint8Array(16);
    p.set(kb);
    return p;
  }
  async function aesCbcDecrypt(data, keyBytes, ivBytes) {
    if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用（需 HTTPS）');
    if (!data.length) return data;
    if (data.length % 16 !== 0) {
      const aligned = data.length - (data.length % 16);
      if (!aligned) throw new Error('密文长度不足以解密');
      data = data.slice(0, aligned);
    }
    const key = await crypto.subtle.importKey('raw', normalizeKey(keyBytes), { name: 'AES-CBC' }, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: ivBytes }, key, data);
    return new Uint8Array(out);
  }
  async function aesCtrDecrypt(data, keyBytes, counterBytes) {
    if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用');
    if (!data.length) return data;
    const key = await crypto.subtle.importKey('raw', normalizeKey(keyBytes), { name: 'AES-CTR' }, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: counterBytes, length: 64 }, key, data);
    return new Uint8Array(out);
  }
  async function decryptSegment(data, keyInfo, sequence, signal) {
    if (!keyInfo || !keyInfo.method || keyInfo.method === 'NONE') return data;
    const method = keyInfo.method.toUpperCase();
    if (keyInfo.keyFormat && keyInfo.keyFormat !== 'identity') {
      throw new Error('不支持 ' + keyInfo.keyFormat + ' 加密（DRM 授权）');
    }
    if (method === 'AES-128' || method === 'AES-192' || method === 'AES-256') {
      const kb = await getKeyBytes(keyInfo.uri, signal);
      return await aesCbcDecrypt(data, kb, deriveIV(keyInfo, sequence));
    }
    if (method === 'SAMPLE-AES-CTR') {
      const kb = await getKeyBytes(keyInfo.uri, signal);
      return await aesCtrDecrypt(data, kb, deriveIV(keyInfo, sequence));
    }
    if (method === 'SAMPLE-AES') {
      // 尝试完整 CBC 解密（不保证成功）
      const kb = await getKeyBytes(keyInfo.uri, signal);
      return await aesCbcDecrypt(data, kb, deriveIV(keyInfo, sequence));
    }
    throw new Error('未知加密方法：' + method);
  }

  /* ============ 下载辅助 ============ */
  function saveBlobToDisk(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }
  function guessFilename(url, ext) {
    try {
      const u = new URL(url);
      let name = decodeURIComponent((u.pathname.split('/').pop() || 'video').split('?')[0]);
      const dot = name.lastIndexOf('.');
      if (dot > 0) name = name.substring(0, dot);
      name = name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || 'video';
      return name + '_' + Date.now() + '.' + ext;
    } catch (e) { return 'vodcore_' + Date.now() + '.' + ext; }
  }

  /* ============ 下载按钮 ============ */
  dlGo.addEventListener('click', () => {
    if (Downloader.isActive()) { toast('已有下载任务'); return; }
    const url = currentUrl || urlInput.value.trim();
    if (!url) { toast('请先输入链接'); return; }
    Downloader.start(url);
  });
  dlCancel.addEventListener('click', () => {
    if (Downloader.isActive()) Downloader.cancel();
  });

  /* ============ 诊断 ============ */
  function buildDiagReport(url, probe) {
    const out = [];
    out.push('<h4>基本信息</h4>');
    out.push(row('URL', escapeHtml(url)));
    out.push(row('时间', escapeHtml(new Date().toLocaleString())));
    out.push(row('Referrer', 'no-referrer ✅'));
    out.push(row('Credentials', 'omit ✅'));
    out.push(row('Cache', 'no-store ✅'));
    out.push('<h4>响应分析</h4>');
    out.push(row('内容类型', escapeHtml(probe.type)));
    if (probe.status) out.push(row('HTTP 状态', probe.status, probe.status === 200 ? 'ok' : 'err'));
    if (probe.redirected !== undefined) out.push(row('是否重定向', probe.redirected ? '⚠️ 是' : '否', probe.redirected ? 'warn' : 'ok'));
    if (probe.finalUrl && probe.finalUrl !== url) out.push(row('最终 URL', escapeHtml(probe.finalUrl), 'warn'));
    if (probe.encrypted !== undefined) out.push(row('是否加密', probe.encrypted ? '是' : '否', probe.encrypted ? 'warn' : 'ok'));
    if (probe.message) out.push(row('说明', escapeHtml(probe.message)));
    if (probe.preview) {
      out.push('<h4>内容预览（前 300 字符）</h4>');
      out.push('<div class="dpre">' + escapeHtml(probe.preview) + '</div>');
    }
    out.push('<h4>判定</h4>');
    if (probe.type === 'm3u8') {
      out.push(row('结论', '✅ 这是有效的 M3U8 播放列表', 'ok'));
      if (probe.encrypted) out.push(row('加密', '检测到 AES 加密，播放时会自动解密', 'warn'));
    } else if (probe.type === 'html') {
      out.push(row('结论', '❌ 返回的是网页，不是视频源', 'err'));
      out.push(row('建议', '你复制的可能是"播放页 URL"。请在浏览器 F12 → Network 面板里，找到真正以 .m3u8 结尾的请求地址'));
    } else if (probe.type === 'unknown') {
      out.push(row('结论', '⚠️ 返回了未知内容', 'warn'));
      out.push(row('建议', '请检查链接是否为视频源地址'));
    } else if (probe.type === 'http_error') {
      out.push(row('结论', '❌ 服务器返回错误状态', 'err'));
      out.push(row('建议', '链接可能已失效，或需要登录 / 鉴权参数'));
    } else if (probe.type === 'network_error') {
      out.push(row('结论', '❌ 网络请求失败（通常是 CORS）', 'err'));
      out.push(row('建议', '目标服务器未开放跨域访问。这是浏览器的安全限制，无法从代码层面绕过。'));
    }
    return out.join('');
  }
  function row(k, v, cls) {
    return '<div class="drow"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
  }
  function showDiagReport(html) {
    diagBody.innerHTML = html;
    diagPanel.hidden = false;
  }
  async function runDiag() {
    const url = currentUrl || urlInput.value.trim();
    if (!url) { toast('请先输入链接'); return; }
    diagBody.innerHTML = '<div style="color:var(--muted);">诊断中…</div>';
    diagPanel.hidden = false;
    const probe = await probeUrl(url);
    diagBody.innerHTML = buildDiagReport(url, probe);
  }
  diagBtn.addEventListener('click', runDiag);
  diagRun.addEventListener('click', runDiag);
  diagClose.addEventListener('click', () => { diagPanel.hidden = true; });
  diagCopy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(diagBody.innerText);
      toast('已复制');
    } catch (e) { toast('复制失败'); }
  });

  /* ============ 加载按钮 ============ */
  loadBtn.addEventListener('click', () => {
    const u = urlInput.value.trim();
    try { localStorage.setItem('vodcore_last', u); } catch (e) {}
    Downloader.reset();
    loadStream(u);
  });
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      urlInput.blur();
      const u = urlInput.value.trim();
      try { localStorage.setItem('vodcore_last', u); } catch (e) {}
      Downloader.reset();
      loadStream(u);
    }
  });

  /* ============ 初始化 ============ */
  syncPlayIcon();
  renderMarks();
  updateDecBtn();
  updateFsIcon();
  showCtrls();
  setStatus('就绪', true);

  let lastUrl = '';
  try { lastUrl = localStorage.getItem('vodcore_last') || ''; } catch (e) {}
  if (lastUrl) urlInput.value = lastUrl;

  console.log('%cVodCore 稳定重写版 %c已就绪',
    'background:linear-gradient(90deg,#4d8dff,#a78bfa);color:#fff;padding:3px 8px;border-radius:4px;font-weight:bold;',
    'color:#4d8dff;font-weight:bold;');
  console.log('环境：', ENV);
  console.log('WebCrypto：', ENV.webCryptoOk ? '✅ 可用' : '❌ 需 HTTPS');
  console.log('智能解码推荐：', pickAutoDec());

})();
</script>
