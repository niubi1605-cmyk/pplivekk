<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>VodCore 播放器 · 重置版 · 高速下载</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#08090d;
    --panel:#111521;
    --panel-2:#171c2b;
    --line:#232a3d;
    --text:#eef1f8;
    --muted:#828ba3;
    --brand:#4d8dff;
    --brand-2:#7db0ff;
    --gold:#ffd166;
    --danger:#ff5f5f;
    --ok:#3ddc97;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1100px 560px at 50% -14%,#141d33 0%,var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }

  .app{
    max-width:980px;
    margin:0 auto;
    padding:12px 12px calc(30px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;
  }

  /* ============ 品牌头 ============ */
  .brand{display:flex;align-items:center;gap:10px;padding:2px 2px 0;}
  .brand-logo{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--brand),#8f6bff);
    display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(77,141,255,.35);
    flex:none;
  }
  .brand-logo svg{width:17px;height:17px;color:#fff;}
  .brand-name{font-weight:800;font-size:15px;letter-spacing:.02em;}
  .brand-name small{color:var(--muted);font-weight:600;font-size:11px;margin-left:5px;}
  .brand-badge{
    margin-left:auto;font-size:10.5px;font-weight:700;
    color:var(--ok);background:rgba(61,220,151,.12);
    border:1px solid rgba(61,220,151,.3);
    padding:3px 8px;border-radius:99px;
    display:flex;align-items:center;gap:5px;
  }
  .brand-badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}

  /* ============ URL 栏 ============ */
  .urlbar{display:flex;gap:8px;}
  .urlbar input{
    flex:1;min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    padding:13px 14px;
    font-size:15px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .urlbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(77,141,255,.14);}
  .urlbar input::placeholder{color:var(--muted);}
  .btn-go{
    flex:none;border:none;border-radius:12px;padding:0 22px;
    font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand-2),var(--brand));
    cursor:pointer;transition:transform .1s,filter .15s;
    box-shadow:0 4px 16px rgba(77,141,255,.3);
  }
  .btn-go:active{transform:scale(.97);filter:brightness(.92);}

  /* ============ 播放器 ============ */
  .player{
    position:relative;width:100%;
    aspect-ratio:16/9;
    background:#000;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
    user-select:none;-webkit-user-select:none;
    isolation:isolate;
  }
  .player:fullscreen,
  .player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000;}

  .big-play{
    position:absolute;inset:0;display:grid;place-items:center;
    color:rgba(255,255,255,.92);pointer-events:none;
    opacity:0;transition:opacity .2s;
    background:radial-gradient(circle at center,rgba(0,0,0,.35),transparent 62%);
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.7));
  }
  .big-play.show{opacity:1;}

  .loading{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.32);z-index:5;
    opacity:0;transition:opacity .18s;pointer-events:none;
  }
  .loading.show{opacity:1;pointer-events:auto;}
  .spinner{
    width:36px;height:36px;border-radius:50%;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--brand-2);
    animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .core-tag{
    position:absolute;top:10px;left:10px;z-index:6;
    display:flex;align-items:center;gap:6px;
    background:rgba(8,9,13,.72);
    border:1px solid rgba(255,255,255,.1);
    border-radius:99px;padding:4px 10px;
    font-size:10.5px;font-weight:700;color:var(--text);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:none;
    opacity:0;transition:opacity .25s;
  }
  .core-tag.show{opacity:1;}
  .core-tag i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);flex:none;}
  .core-tag i.enc{background:var(--gold);box-shadow:0 0 7px var(--gold);}

  .ctrls{
    position:absolute;left:0;right:0;bottom:0;z-index:4;
    padding:34px 12px 8px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.9));
    transition:opacity .25s,transform .25s;
  }
  .ctrls.hidden{opacity:0;transform:translateY(10px);pointer-events:none;}

  .progress{
    position:relative;height:24px;display:flex;align-items:center;
    cursor:pointer;touch-action:none;
  }
  .track,.bar-buffer,.bar-played{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:4px;border-radius:99px;
  }
  .track{right:0;background:rgba(255,255,255,.18);}
  .bar-buffer{background:rgba(255,255,255,.3);width:0;}
  .bar-played{
    background:linear-gradient(90deg,var(--brand),var(--brand-2));
    width:0;box-shadow:0 0 10px rgba(77,141,255,.6);
  }
  .bar-thumb{
    position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px rgba(77,141,255,.35);
    opacity:0;transition:opacity .15s;
  }
  .player:hover .bar-thumb,.progress.dragging .bar-thumb{opacity:1;}
  .bar-marks{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:16px;pointer-events:none;
  }
  .bar-marks i{
    position:absolute;top:0;width:2px;height:16px;border-radius:2px;
    background:var(--gold);transform:translateX(-1px);
    box-shadow:0 0 7px rgba(255,209,102,.85);
  }

  .ctrl-row{display:flex;align-items:center;gap:4px;margin-top:2px;}
  .icon-btn{
    background:transparent;border:none;color:#fff;cursor:pointer;
    width:38px;height:38px;border-radius:10px;
    display:grid;place-items:center;transition:background .15s;
    flex:none;
  }
  .icon-btn:hover{background:rgba(255,255,255,.13);}
  .icon-btn svg{width:20px;height:20px;}
  .time{
    font-variant-numeric:tabular-nums;font-size:12px;
    color:rgba(255,255,255,.85);margin-left:4px;white-space:nowrap;
  }
  .grow{flex:1;}
  select.speed{
    -webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.13);color:#fff;border:none;
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;
    cursor:pointer;outline:none;font-variant-numeric:tabular-nums;
    font-family:inherit;
  }
  select.speed option{background:#171c2b;color:#fff;}

  /* ============ 工具栏 ============ */
  .toolbar{display:flex;gap:8px;align-items:center;}

  .pill{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    padding:11px 13px;border-radius:12px;border:1px solid transparent;
    font-size:13px;font-weight:700;cursor:pointer;
    user-select:none;-webkit-user-select:none;white-space:nowrap;
    transition:transform .1s,background .15s,box-shadow .2s;
    font-family:inherit;
  }
  .pill:active{transform:scale(.95);}
  .pill svg{width:16px;height:16px;flex:none;}

  .pill-flag{
    color:var(--gold);
    border-color:rgba(255,209,102,.36);
    background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,209,102,.06));
  }
  .pill-flag.pulse{box-shadow:0 0 0 6px rgba(255,209,102,.2);}

  .pill-decoder{
    color:var(--brand-2);
    border-color:rgba(77,141,255,.4);
    background:linear-gradient(180deg,rgba(77,141,255,.2),rgba(77,141,255,.06));
  }
  .pill-decoder.pulse{box-shadow:0 0 0 6px rgba(77,141,255,.2);}

  .search{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:0 12px;height:44px;
    transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--brand);}
  .search svg{width:16px;height:16px;color:var(--muted);flex:none;}
  .search input{
    flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--text);font-size:14px;height:100%;
  }
  .search input::placeholder{color:var(--muted);}

  /* ============ 标记列表 ============ */
  .marks{display:flex;flex-direction:column;gap:8px;}
  .mark-item{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:pan-y;
    transition:background .15s,border-color .15s,transform .08s;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-5px);}}
  .mark-item:hover{background:var(--panel-2);border-color:#32405c;}
  .mark-item:active{transform:scale(.99);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.75);}
  .m-time{
    flex:none;font-variant-numeric:tabular-nums;
    font-size:13px;font-weight:800;color:var(--gold);
    background:rgba(255,209,102,.13);border-radius:7px;padding:3px 9px;
  }
  .m-title{
    flex:1;min-width:0;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .m-del{
    flex:none;width:36px;height:36px;display:grid;place-items:center;
    border:none;border-radius:10px;background:transparent;color:var(--muted);
    cursor:pointer;transition:background .15s,color .15s;
    touch-action:manipulation;
  }
  .m-del:hover{background:rgba(255,95,95,.14);color:var(--danger);}
  .m-del svg{width:17px;height:17px;}

  .empty{
    text-align:center;color:var(--muted);font-size:13px;
    padding:26px 16px;border:1px dashed var(--line);border-radius:12px;line-height:1.7;
  }

  /* ============ 下载卡片 ============ */
  .dl-card{
    background:linear-gradient(180deg,var(--panel),#0e1220);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;flex-direction:column;gap:12px;
    transition:border-color .2s,box-shadow .2s;
  }
  .dl-card.active{
    border-color:rgba(77,141,255,.5);
    box-shadow:0 0 0 3px rgba(77,141,255,.08),0 8px 30px rgba(77,141,255,.08);
  }

  .dl-head{display:flex;align-items:center;gap:12px;}
  .dl-icon{
    width:42px;height:42px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,rgba(77,141,255,.25),rgba(143,107,255,.18));
    border:1px solid rgba(77,141,255,.32);
    display:grid;place-items:center;color:var(--brand-2);
  }
  .dl-icon svg{width:20px;height:20px;}
  .dl-info{flex:1;min-width:0;}
  .dl-title{font-size:14.5px;font-weight:800;letter-spacing:.01em;}
  .dl-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-start{
    flex:none;border:none;border-radius:11px;
    padding:11px 20px;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand-2),var(--brand));
    cursor:pointer;transition:transform .1s,filter .15s;
    box-shadow:0 4px 14px rgba(77,141,255,.32);
    font-family:inherit;
    white-space:nowrap;
  }
  .dl-start:active{transform:scale(.96);filter:brightness(.9);}
  .dl-start:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}

  .dl-progress{display:flex;flex-direction:column;gap:9px;}
  .dl-bar-wrap{
    position:relative;height:8px;border-radius:99px;
    background:rgba(255,255,255,.08);overflow:hidden;
  }
  .dl-bar{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));
    border-radius:99px;transition:width .22s ease;
    box-shadow:0 0 12px rgba(77,141,255,.65);
  }
  .dl-bar.indeterminate{
    width:36% !important;
    animation:dlSlide 1.3s cubic-bezier(.5,.1,.5,.9) infinite;
  }
  @keyframes dlSlide{
    0%{left:-36%;}
    100%{left:100%;}
  }

  .dl-stats{
    display:flex;flex-wrap:wrap;gap:8px 18px;
    font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .dl-stats b{color:var(--text);font-weight:700;}
  .dl-stats .ok{color:var(--ok);font-weight:800;}

  .dl-actions{display:flex;gap:8px;justify-content:flex-end;}
  .dl-btn-ghost{
    background:transparent;border:1px solid var(--line);
    color:var(--text);padding:8px 14px;border-radius:9px;
    font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:background .15s,border-color .15s;
  }
  .dl-btn-ghost:hover{background:rgba(255,255,255,.05);border-color:#32405c;}
  .dl-btn-danger{
    border-color:rgba(255,95,95,.36);color:var(--danger);
  }
  .dl-btn-danger:hover{background:rgba(255,95,95,.1);}
  .dl-btn-ghost:disabled{opacity:.4;cursor:not-allowed;}

  .dl-warn{
    font-size:11.5px;color:var(--gold);
    background:rgba(255,209,102,.08);
    border:1px solid rgba(255,209,102,.24);
    border-radius:9px;padding:9px 11px;line-height:1.55;
    display:none;
  }
  .dl-warn.show{display:block;}

  /* ============ 弹出菜单 ============ */
  .menu{
    position:fixed;z-index:999;min-width:156px;
    background:#171c2b;border:1px solid var(--line);
    border-radius:12px;padding:6px;
    box-shadow:0 14px 38px rgba(0,0,0,.65);
    animation:pop .14s ease;
  }
  .menu button{
    display:block;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:14px;padding:10px 12px;border-radius:8px;
    cursor:pointer;transition:background .12s;font-family:inherit;
  }
  .menu button:hover{background:rgba(255,255,255,.08);}
  .menu button.danger{color:var(--danger);}

  .decoder-menu{
    min-width:260px;max-width:92vw;
    max-height:min(74vh,500px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .menu-title{
    font-size:11px;font-weight:800;color:var(--muted);
    padding:8px 12px 6px;letter-spacing:.08em;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .menu-title .badge{
    font-size:10px;font-weight:700;color:var(--brand-2);
    background:rgba(77,141,255,.14);border-radius:6px;padding:2px 6px;
    letter-spacing:0;
  }
  .decoder-menu button.decoder-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:9px 12px;
  }
  .decoder-item .d-name{
    font-size:13.5px;font-weight:700;color:var(--text);
    display:flex;align-items:center;gap:6px;line-height:1.3;
  }
  .decoder-item .d-desc{font-size:11px;color:var(--muted);line-height:1.35;}
  .decoder-item.active{background:rgba(77,141,255,.14);}
  .decoder-item.active .d-name{color:var(--brand-2);}
  .decoder-item:disabled{opacity:.35;cursor:not-allowed;}
  .decoder-item:disabled:hover{background:none;}
  .d-check{font-size:12px;color:var(--brand-2);}
  .menu-sep{height:1px;background:var(--line);margin:6px 8px;}

  /* ============ Toast ============ */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);
    background:rgba(23,28,43,.98);border:1px solid var(--line);
    color:var(--text);padding:10px 20px;border-radius:99px;
    font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:1000;
    max-width:82vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 8px 26px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">

  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>
      </svg>
    </div>
    <div class="brand-name">VodCore<small>自研内核 · 重置版</small></div>
    <div class="brand-badge" id="coreStatus"><i></i><span>内核就绪</span></div>
  </div>

  <div class="urlbar">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="粘贴 M3U8 / 加密 M3U8 / 视频直链…">
    <button id="loadBtn" class="btn-go">播放</button>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline webkit-playsinline x5-playsinline preload="metadata"></video>

    <div class="core-tag" id="coreTag"><i id="coreDot"></i><span id="coreText">VodCore</span></div>

    <div class="big-play" id="bigPlay">
      <svg viewBox="0 0 24 24" width="62" height="62" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="loading" id="loading"><div class="spinner"></div></div>

    <div class="ctrls" id="ctrls">
      <div class="progress" id="progress">
        <div class="track"></div>
        <div class="bar-buffer" id="barBuffer"></div>
        <div class="bar-played" id="barPlayed"></div>
        <div class="bar-marks" id="barMarks"></div>
        <div class="bar-thumb" id="barThumb"></div>
      </div>
      <div class="ctrl-row">
        <button class="icon-btn" id="playBtn" title="播放 / 暂停"></button>
        <span class="time" id="timeLabel">00:00 / 00:00</span>
        <div class="grow"></div>
        <select class="speed" id="speedSelect" title="播放倍速"></select>
        <button class="icon-btn" id="pipBtn" title="画中画"></button>
        <button class="icon-btn" id="fsBtn" title="全屏 / 横屏"></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="pill pill-flag" id="flagBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
      <span>标记</span>
    </button>

    <button class="pill pill-decoder" id="decoderBtn" title="切换解码方案">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>
      </svg>
      <span>解码</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索标记名称 / 时间…" autocomplete="off">
    </div>
  </div>

  <div class="marks" id="marksList"></div>
  <div class="empty" id="emptyTip">还没有标记 · 点击上方 🏳 旗子即可标记当前时间</div>

  <!-- ============ 高速下载 ============ -->
  <div class="dl-card" id="dlCard">
    <div class="dl-head">
      <div class="dl-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5 5 5-5"/>
          <path d="M12 15V3"/>
        </svg>
      </div>
      <div class="dl-info">

<script>
/* ================================================================
 *  VodCore Player v3.0 · 重置版 + 高速下载
 * ================================================================ */
(function () {
  'use strict';

  const ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    pip:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>',
    fs:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
    fsOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
  };

  const $ = (id) => document.getElementById(id);
  const video       = $('video');
  const player      = $('player');
  const urlInput    = $('urlInput');
  const loadBtn     = $('loadBtn');
  const loading     = $('loading');
  const bigPlay     = $('bigPlay');
  const ctrls       = $('ctrls');
  const progress    = $('progress');
  const barBuffer   = $('barBuffer');
  const barPlayed   = $('barPlayed');
  const barMarks    = $('barMarks');
  const barThumb    = $('barThumb');
  const playBtn     = $('playBtn');
  const timeLabel   = $('timeLabel');
  const speedSel    = $('speedSelect');
  const pipBtn      = $('pipBtn');
  const fsBtn       = $('fsBtn');
  const flagBtn     = $('flagBtn');
  const decoderBtn  = $('decoderBtn');
  const searchInput = $('searchInput');
  const marksList   = $('marksList');
  const emptyTip    = $('emptyTip');
  const menu        = $('menu');
  const decoderMenu = $('decoderMenu');
  const toastEl     = $('toast');
  const coreStatus  = $('coreStatus');
  const coreTag     = $('coreTag');
  const coreText    = $('coreText');
  const coreDot     = $('coreDot');
  const dlCard      = $('dlCard');
  const dlSub       = $('dlSub');
  const dlWarn      = $('dlWarn');
  const dlStartBtn  = $('dlStartBtn');
  const dlProgress  = $('dlProgress');
  const dlBar       = $('dlBar');
  const dlPercent   = $('dlPercent');
  const dlSpeed     = $('dlSpeed');
  const dlRemain    = $('dlRemain');
  const dlSize      = $('dlSize');
  const dlCancelBtn = $('dlCancelBtn');

  playBtn.innerHTML = ICON.play;
  bigPlay.innerHTML = ICON.play;
  pipBtn.innerHTML  = ICON.pip;
  fsBtn.innerHTML   = ICON.fs;

  /* ================= 环境 ================= */
  const ENV = (function () {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const maxTouch = navigator.maxTouchPoints || 0;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && maxTouch > 1);
    const isAndroid = /Android/i.test(ua);
    const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Chromium|Edg|OPR|FxiOS/i.test(ua);
    const isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const effectiveType = conn ? (conn.effectiveType || '') : '';
    const saveData = !!(conn && conn.saveData);
    const downlink = (conn && typeof conn.downlink === 'number') ? conn.downlink : 0;
    const cores = navigator.hardwareConcurrency || 4;
    const memory = navigator.deviceMemory || 4;
    const nativeHls = video.canPlayType('application/vnd.apple.mpegurl') || '';
    const nativeHlsOk = nativeHls === 'maybe' || nativeHls === 'probably';
    const hlsJsOk = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
    return {
      isIOS, isAndroid, isSafari, isMobile,
      effectiveType, saveData, downlink,
      cores, memory,
      lowEnd: cores <= 2 || memory <= 2,
      highEnd: cores >= 8 && memory >= 4,
      nativeHlsOk, hlsJsOk
    };
  })();

  /* ================= 工具 ================= */
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const p = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
  }
  function fmtBytes(n) {
    if (!isFinite(n) || n <= 0) return '--';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
    return (n/1073741824).toFixed(2) + ' GB';
  }
  function fmtSpeed(bps) {
    if (!isFinite(bps) || bps <= 0) return '--';
    return fmtBytes(bps) + '/s';
  }
  function fmtRemain(sec) {
    if (!isFinite(sec) || sec <= 0) return '--';
    if (sec < 60) return Math.ceil(sec) + 's';
    if (sec < 3600) return Math.floor(sec/60) + 'm ' + Math.floor(sec%60) + 's';
    return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
  }
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function attachPress(el, opts) {
    const longMs = opts.longMs || 520;
    let timer = null, fired = false, moved = false, sx = 0, sy = 0;
    const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      fired = false; moved = false; sx = e.clientX; sy = e.clientY;
      clear();
      timer = setTimeout(() => { timer = null; fired = true; opts.onLong && opts.onLong(e); }, longMs);
    });
    el.addEventListener('pointermove', (e) => {
      if (moved) return;
      if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) { moved = true; clear(); }
    });
    el.addEventListener('pointerup', (e) => {
      clear();
      if (!fired && !moved && opts.onTap) opts.onTap(e);
    });
    el.addEventListener('pointercancel', () => { clear(); fired = true; });
    el.addEventListener('pointerleave', clear);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  function openPopupNear(el, anchor) {
    el.hidden = false;
    el.style.visibility = 'hidden';
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 10);
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 8);
    el.style.left = Math.max(10, left) + 'px';
    el.style.top  = Math.max(10, top) + 'px';
    el.style.visibility = '';
  }

  /* ================= 标记存储 ================= */
  const STORE_KEY = 'vodcore_marks_v1';
  let markStore = {};
  try { markStore = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { markStore = {}; }
  let currentUrl = '';
  let marks = [];
  function saveMarks() {
    if (!currentUrl) return;
    if (marks.length) markStore[currentUrl] = marks;
    else delete markStore[currentUrl];
    try { localStorage.setItem(STORE_KEY, JSON.stringify(markStore)); } catch (e) {}
  }

  /* ================= 解码器 ================= */
  const DECODERS = {
    auto: { name: '智能解码（推荐）', desc: 'VodCore 自动探测设备与网络，实时选择最优策略', auto: true },
    boost: { name: '疾速解码 Turbo', desc: '激进预加载 + 高并发，弱网也能快速起播',
      hls: { enableWorker: true, maxBufferLength: 90, maxMaxBufferLength: 240, backBufferLength: 60,
        startLevel: -1, testBandwidth: true, abrEwmaDefaultEstimate: 1200000,
        fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6, fragLoadingTimeOut: 25000 } },
    hardware: { name: '硬件加速优先', desc: 'GPU 硬解，省电发热低，适合高分片源',
      hls: { enableWorker: true, enableSoftwareAES: false, capLevelToPlayerSize: true, progressive: false,
        startLevel: -1, testBandwidth: true, abrEwmaDefaultEstimate: 800000 } },
    software: { name: '软件解码', desc: '主线程软解，兼容怪编码 / 异常 TS',
      hls: { enableWorker: false, enableSoftwareAES: true, progressive: true, startLevel: -1, maxBufferLength: 60 } },
    lowlatency: { name: '低延迟直播', desc: '极限小缓冲，适合直播；弱网可能卡顿',
      hls: { enableWorker: true, lowLatencyMode: true, maxBufferLength: 6, backBufferLength: 0,
        liveSyncDurationCount: 1, maxLiveSyncPlaybackRate: 1.5, liveDurationInfinity: true, startLevel: -1 } },
    smooth: { name: '流畅优先', desc: '大缓冲策略，减少卡顿，适合长片点播',
      hls: { enableWorker: true, maxBufferLength: 120, maxMaxBufferLength: 300, backBufferLength: 180, startLevel: -1 } },
    compat: { name: '兼容模式', desc: '关闭高级特性，老旧设备 / 弱网首选',
      hls: { enableWorker: false, maxBufferLength: 30, backBufferLength: 30, enableSoftwareAES: true,
        manifestLoadingMaxRetry: 8, levelLoadingMaxRetry: 8, fragLoadingMaxRetry: 10,
        manifestLoadingTimeOut: 20000, levelLoadingTimeOut: 20000, fragLoadingTimeOut: 30000, startLevel: -1 } },
    lowpower: { name: '低功耗省电', desc: '降低缓冲与解码压力，省电省流量',
      hls: { enableWorker: true, maxBufferLength: 30, backBufferLength: 15, maxMaxBufferLength: 60,
        capLevelToPlayerSize: true, abrBandWidthFactor: .6, abrBandWidthUpFactor: .4, startLevel: 0 } },
    mobile: { name: '移动网络优化', desc: '针对 4G/5G 优化，平衡清晰度与流量',
      hls: { enableWorker: true, maxBufferLength: 45, backBufferLength: 30, capLevelToPlayerSize: true,
        abrBandWidthFactor: .75, abrBandWidthUpFactor: .5, startLevel: -1 } },
    quality: { name: '高画质优先', desc: '锁定最高码率，画质党首选',
      hls: { enableWorker: true, maxBufferLength: 90, backBufferLength: 120, capLevelToPlayerSize: false,
        startLevel: -1, abrBandWidthFactor: 1, abrBandWidthUpFactor: .9 } },
    secure: { name: '加密链接增强', desc: '针对 AES-128 / SAMPLE-AES 加密流优化',
      hls: { enableWorker: true, enableSoftwareAES: true, maxBufferLength: 60, backBufferLength: 60,
        startLevel: -1, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6 } },
    native: { name: '浏览器原生解码', desc: '交给浏览器内核，Safari / iOS 效果最佳', native: true }
  };
  const DECODER_ORDER = [
    'auto','boost','hardware','software','lowlatency','smooth',
    'compat','lowpower','mobile','quality','secure','native'
  ];
  let currentDecoder = 'auto';
  try {
    const saved = localStorage.getItem('vodcore_decoder');
    if (saved && DECODERS[saved]) currentDecoder = saved;
  } catch (e) {}

  const SmartDecoder = {
    pick() {
      if (ENV.isIOS) return ENV.nativeHlsOk ? 'native' : 'compat';
      if (ENV.isSafari && !ENV.isMobile) {
        if (ENV.nativeHlsOk) return 'native';
        return ENV.hlsJsOk ? 'hardware' : 'compat';
      }
      if (!ENV.hlsJsOk) return ENV.nativeHlsOk ? 'native' : 'compat';
      if (ENV.saveData) return 'lowpower';
      if (ENV.effectiveType === 'slow-2g' || ENV.effectiveType === '2g') return 'lowpower';
      if (ENV.lowEnd) return 'compat';
      if (ENV.effectiveType === '3g') return ENV.isMobile ? 'mobile' : 'compat';
      if (ENV.isMobile) {
        if (ENV.downlink && ENV.downlink < 1.5) return 'lowpower';
        if (ENV.highEnd && (!ENV.downlink || ENV.downlink > 5)) return 'boost';
        return 'mobile';
      }
      if (ENV.highEnd && (ENV.effectiveType === '4g' || !ENV.effectiveType)) return 'boost';
      if (ENV.effectiveType === '4g') return 'smooth';
      return 'hardware';
    },
    resolve(key) {
      if (DECODERS[key] && DECODERS[key].auto) {
        const picked = this.pick();
        return DECODERS[picked] ? picked : 'compat';
      }
      return DECODERS[key] ? key : 'compat';
    }
  };

  /* ================= 播放内核 ================= */
  const VodCore = {
    version: '3.0.0',
    hls: null, retries: 0,
    loadingShown: false, loadingTimer: null,
    wasPlaying: false, keyDetected: false,

    scheduleLoading(delay = 500) {
      if (this.loadingShown) return;
      clearTimeout(this.loadingTimer);
      this.loadingTimer = setTimeout(() => {
        if (video.readyState < 3 && !video.paused) {
          this.loadingShown = true;
          loading.classList.add('show');
        }
      }, delay);
    },
    showLoadingNow() {
      clearTimeout(this.loadingTimer);
      this.loadingShown = true;
      loading.classList.add('show');
    },
    hideLoading() {
      clearTimeout(this.loadingTimer);
      this.loadingShown = false;
      loading.classList.remove('show');
    },
    setTag(text, encrypted) {
      coreText.textContent = text;
      coreDot.classList.toggle('enc', !!encrypted);
      coreTag.classList.add('show');
      clearTimeout(this._tagTimer);
      this._tagTimer = setTimeout(() => coreTag.classList.remove('show'), 4200);
    },
    setStatus(text, ok) {
      coreStatus.querySelector('span').textContent = text;
      const i = coreStatus.querySelector('i');
      i.style.background = ok ? 'var(--ok)' : 'var(--danger)';
      i.style.boxShadow = ok ? '0 0 8px var(--ok)' : '0 0 8px var(--danger)';
    },
    async probeEncryption(url) {
      if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv)(\?|#|$)/i.test(url)) return { encrypted: false };
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch(url, { signal: ctrl.signal, method: 'GET', credentials: 'omit' });
        clearTimeout(t);
        if (!res.ok) return { encrypted: null };
        const text = await res.text();
        return { encrypted: /#EXT-X-KEY:METHOD=(AES-128|SAMPLE-AES)/i.test(text) };
      } catch (e) { return { encrypted: null }; }
    },
    async load(url, resumeAt = 0) {
      url = (url || '').trim();
      if (!url) { toast('请输入链接'); return; }

      currentUrl = url;
      marks = (markStore[url] || []).slice();
      renderMarks();
      renderBarMarks();

      this.wasPlaying = !video.paused;
      this.retries = 0;
      this.keyDetected = false;

      if (this.hls) { try { this.hls.destroy(); } catch (e) {} this.hls = null; }
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}

      this.showLoadingNow();
      this.setStatus('加载中…', true);

      const probe = await this.probeEncryption(url);
      if (probe.encrypted === true) {
        this.keyDetected = true;
        this.setTag('加密流 · AES-128', true);
      }

      const decoderKey = SmartDecoder.resolve(currentDecoder);
      const decoder = DECODERS[decoderKey] || DECODERS.compat;
      const isDirectFile = /\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi)(\?|#|$)/i.test(url);
      const useHlsJs = !isDirectFile && ENV.hlsJsOk && !decoder.native;

      if (currentDecoder === 'auto' && !isDirectFile) toast('智能解码 → ' + decoder.name);
      this.setTag('VodCore · ' + (isDirectFile ? '直链' : decoder.name), this.keyDetected);

      if (useHlsJs) this._loadViaHlsJs(url, decoder, resumeAt);
      else if (ENV.nativeHlsOk || isDirectFile) this._loadViaNative(url, resumeAt);
      else {
        this.hideLoading();
        this.setStatus('无可用解码', false);
        toast('当前环境不支持，请点击「解码」切换');
      }
    },
    _loadViaHlsJs(url, decoder, resumeAt) {
      const baseCfg = {
        enableWorker: true, lowLatencyMode: false, backBufferLength: 90, maxBufferLength: 60,
        manifestLoadingMaxRetry: 4, levelLoadingMaxRetry: 4, fragLoadingMaxRetry: 6,
        manifestLoadingTimeOut: 15000, levelLoadingTimeOut: 15000, fragLoadingTimeOut: 20000,
        startLevel: -1,
        xhrSetup: (xhr, reqUrl) => {
          try { xhr.withCredentials = false; } catch (e) {}
          if (/key/i.test(reqUrl)) {
            this.keyDetected = true;
            coreDot.classList.add('enc');
            this.setTag('VodCore · 解密中…', true);
          }
        }
      };
      const cfg = Object.assign(baseCfg, decoder.hls || {});
      let hls;
      try { hls = new window.Hls(cfg); }
      catch (e) {
        this.hideLoading();
        this.setStatus('内核启动失败', false);
        toast('HLS 启动失败：' + e.message);
        return;
      }
      this.hls = hls;
      hls.on(window.Hls.Events.KEY_LOADING, () => {
        this.keyDetected = true;
        coreDot.classList.add('enc');
        this.setTag('VodCore · 解密中…', true);
      });
      hls.on(window.Hls.Events.KEY_LOADED, () => this.setTag('VodCore · 已解密', true));
      hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
        this.hideLoading();
        this.setStatus('播放中', true);
        if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
        video.play().catch(() => {});
        try {
          const lv = hls.levels && hls.levels[0];
          if (lv) this.setTag(`VodCore · ${lv.width}x${lv.height}`, this.keyDetected);
        } catch (e) {}
      });
      hls.on(window.Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && this.retries < 4) {
          this.retries++;
          toast(`网络抖动，重试 (${this.retries}/4)…`);
          try { hls.startLoad(); } catch (e) {}
          return;
        }
        if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && this.retries < 4) {
          this.retries++;
          toast(`解码恢复中 (${this.retries}/4)…`);
          try { hls.recoverMediaError(); } catch (e) {}
          return;
        }
        if (data.details && /key/i.test(data.details)) {
          this.hideLoading();
          this.setStatus('解密失败', false);
          toast('解密失败：' + data.details);
          return;
        }
        if (this.retries >= 4 && currentDecoder !== 'compat') {
          toast('多次失败，自动降级…');
          currentDecoder = 'compat';
          try { localStorage.setItem('vodcore_decoder', 'compat'); } catch (e) {}
          updateDecoderBtn();
          this.load(currentUrl, video.currentTime || 0);
          return;
        }
        this.hideLoading();
        this.setStatus('播放失败', false);
        toast('播放失败：' + (data.details || '未知错误'));
      });
      hls.loadSource(url);
      hls.attachMedia(video);
    },
    _loadViaNative(url, resumeAt) {
      this.setTag('VodCore · 原生解码', this.keyDetected);
      const onMeta = () => {
        video.removeEventListener('loadedmetadata', onMeta);
        this.hideLoading();
        this.setStatus('播放中', true);
        if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
        video.play().catch(() => {});
        this.setTag(`VodCore · ${video.videoWidth}x${video.videoHeight}`, this.keyDetected);
      };
      video.addEventListener('loadedmetadata', onMeta);
      const onErr = () => {
        video.removeEventListener('error', onErr);
        this.hideLoading();
        this.setStatus('原生失败', false);
        if (currentDecoder !== 'compat' && ENV.hlsJsOk) {
          toast('原生失败，自动切换 HLS 内核…');
          currentDecoder = 'compat';
          try { localStorage.setItem('vodcore_decoder', 'compat'); } catch (e) {}
          updateDecoderBtn();
          this.load(currentUrl, video.currentTime || 0);
        } else toast('原生解码失败，请点击「解码」切换');
      };
      video.addEventListener('error', onErr);
      video.src = url;
    },
    play()  { if (currentUrl) video.play().catch(() => {}); },
    pause() { video.pause(); },
    toggle() {
      if (!currentUrl) { toast('请先输入链接'); return; }
      if (video.paused) this.play(); else this.pause();
    },
    seek(t) {
      if (!currentUrl) return;
      const d = video.duration;
      const target = (isFinite(d) && d > 0) ? Math.min(t, Math.max(0, d - 0.05)) : t;
      try { video.currentTime = target; } catch (e) {}
      this.scheduleLoading(300);
    },
    setRate(r) { video.playbackRate = r; },
    setDecoder(key, silent) {

  /* ================================================================
   *  VodDownloader v3.0 · 高速下载内核
   *  支持：M3U8 / AES-128 加密 / fMP4 / 直链
   *  特性：并发下载 · 自动重试 · 边下边合 · 实时进度
   * ================================================================ */
  const VodDownloader = {
    active: false,
    controller: null,
    stats: { startTime: 0, downloadedBytes: 0, totalBytes: 0, completedSegments: 0, totalSegments: 0, speed: 0 },

    isActive() { return this.active; },

    /* ---------- 通用网络 ---------- */
    async fetchText(url, signal) {
      const res = await fetch(url, { signal, credentials: 'omit', mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    },
    async fetchBinary(url, signal, byteRange) {
      const headers = {};
      if (byteRange && byteRange.length) {
        const start = byteRange.offset || 0;
        headers.Range = `bytes=${start}-${start + byteRange.length - 1}`;
      }
      const res = await fetch(url, { signal, credentials: 'omit', mode: 'cors', headers });
      if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
      return new Uint8Array(await res.arrayBuffer());
    },

    /* ---------- m3u8 解析 ---------- */
    parseM3U8(text, baseUrl) {
      const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
      const result = {
        isMaster: false, segments: [], variants: [],
        initSegment: null, totalDuration: 0, mediaSequence: 0,
        hasEncryption: false, encMethod: null
      };
      const resolve = (u) => { try { return new URL(u, baseUrl).href; } catch (e) { return u; } };
      const parseAttrs = (line) => {
        const attrs = {};
        const re = /([A-Z0-9-]+)=("([^"]*)"|[^,]*)/g;
        let m;
        while ((m = re.exec(line)) !== null) attrs[m[1]] = m[3] !== undefined ? m[3] : m[2];
        return attrs;
      };

      let currentKey = null;
      let currentByteRange = null;
      let seq = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith('#EXT-X-MEDIA-SEQUENCE')) {
          result.mediaSequence = parseInt(line.split(':')[1], 10) || 0;
          seq = result.mediaSequence;
        } else if (line.startsWith('#EXT-X-STREAM-INF')) {
          result.isMaster = true;
          const attrs = parseAttrs(line);
          for (let j = i + 1; j < lines.length; j++) {
            if (!lines[j].startsWith('#')) {
              result.variants.push({
                url: resolve(lines[j]),
                bandwidth: parseInt(attrs.BANDWIDTH, 10) || 0,
                resolution: attrs.RESOLUTION || '',
                name: attrs.NAME || ''
              });
              break;
            }
          }
        } else if (line.startsWith('#EXT-X-KEY')) {
          const attrs = parseAttrs(line);
          const method = attrs.METHOD;
          if (!method || method === 'NONE') currentKey = null;
          else {
            currentKey = {
              method,
              uri: attrs.URI ? resolve(attrs.URI) : null,
              iv: attrs.IV || null
            };
            result.hasEncryption = true;
            result.encMethod = method;
          }
        } else if (line.startsWith('#EXT-X-MAP')) {
          const attrs = parseAttrs(line);
          if (attrs.URI) result.initSegment = { url: resolve(attrs.URI), key: currentKey, byteRange: null };
        } else if (line.startsWith('#EXT-X-BYTERANGE')) {
          const parts = line.split(':')[1].split('@');
          currentByteRange = {
            length: parseInt(parts[0], 10),
            offset: parts[1] ? parseInt(parts[1], 10) : null
          };
        } else if (line.startsWith('#EXTINF')) {
          const dur = parseFloat(line.split(':')[1]) || 0;
          result.totalDuration += dur;
          for (let j = i + 1; j < lines.length; j++) {
            if (!lines[j].startsWith('#')) {
              const segUrl = resolve(lines[j]);
              // byterange 没给 offset 时接上一个分片
              let br = currentByteRange;
              if (br && br.offset == null && result.segments.length > 0) {
                const prev = result.segments[result.segments.length - 1];
                if (prev.byteRange) br.offset = (prev.byteRange.offset || 0) + prev.byteRange.length;
              }
              result.segments.push({
                url: segUrl, duration: dur, key: currentKey,
                sequence: seq, byteRange: br
              });
              seq++;
              currentByteRange = null;
              break;
            }
          }
        }
      }
      return result;
    },

    /* ---------- AES-128 解密 ---------- */
    async decryptAES128(data, keyBytes, ivBytes) {
      const key = await crypto.subtle.importKey(
        'raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-CBC', iv: ivBytes }, key, data
      );
      return new Uint8Array(decrypted);
    },
    seqToIv(seq) {
      const iv = new Uint8Array(16);
      const view = new DataView(iv.buffer);
      view.setUint32(12, seq >>> 0, false);
      return iv;
    },
    hexToBytes(hex) {
      hex = hex.replace(/^0x/i, '');
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      return bytes;
    },

    /* ---------- 保存 ---------- */
    saveBlob(parts, filename, mimeType) {
      const blob = new Blob(parts, { type: mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      return blob.size;
    },
    guessFilename(url, ext) {
      try {
        const u = new URL(url);
        let name = decodeURIComponent((u.pathname.split('/').pop() || 'video').split('?')[0]);
        const dot = name.lastIndexOf('.');
        if (dot > 0) name = name.substring(0, dot);
        name = name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || 'video';
        return name + '_' + Date.now() + '.' + ext;
      } catch (e) { return 'vodcore_' + Date.now() + '.' + ext; }
    },

    /* ---------- UI ---------- */
    setWarn(msg) {
      if (msg) { dlWarn.innerHTML = msg; dlWarn.classList.add('show'); }
      else dlWarn.classList.remove('show');
    },
    setState(state, info = {}) {
      if (state === 'idle') {
        dlCard.classList.remove('active');
        dlProgress.hidden = true;
        dlStartBtn.disabled = false;
        dlStartBtn.textContent = '开始下载';
        dlSub.textContent = info.sub || 'M3U8 · AES-128 加密 · fMP4 · 直链视频 · 自动合并';
      } else if (state === 'preparing') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlStartBtn.disabled = true;
        dlStartBtn.textContent = '准备中';
        dlBar.classList.add('indeterminate');
        dlBar.style.width = '';
        dlPercent.textContent = '0%';
        dlSpeed.textContent = '--';
        dlRemain.textContent = '--';
        dlSize.textContent = '--';
        dlCancelBtn.disabled = false;
        dlCancelBtn.textContent = '取消下载';
        dlSub.textContent = info.sub || '正在解析链接…';
      } else if (state === 'downloading') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlStartBtn.disabled = true;
        dlStartBtn.textContent = '下载中';
        dlBar.classList.remove('indeterminate');
        dlCancelBtn.disabled = false;
        dlSub.textContent = info.sub || '正在下载…';
      } else if (state === 'merging') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlBar.classList.add('indeterminate');
        dlStartBtn.disabled = true;
        dlStartBtn.textContent = '合并中';
        dlCancelBtn.disabled = true;
        dlSub.textContent = info.sub || '正在合并…';
      } else if (state === 'done') {
        dlCard.classList.remove('active');
        dlStartBtn.disabled = false;
        dlStartBtn.textContent = '重新下载';
        dlBar.classList.remove('indeterminate');
        dlBar.style.width = '100%';
        dlPercent.textContent = '100%';
        dlCancelBtn.disabled = true;
        dlCancelBtn.textContent = '已完成';
        dlSub.textContent = info.sub || '已保存到本地';
      } else if (state === 'error') {
        dlCard.classList.remove('active');
        dlStartBtn.disabled = false;
        dlStartBtn.textContent = '重试';
        dlBar.classList.remove('indeterminate');
        dlCancelBtn.disabled = true;
        dlSub.textContent = '下载失败';
      } else if (state === 'canceled') {
        dlCard.classList.remove('active');
        dlProgress.hidden = true;
        dlStartBtn.disabled = false;
        dlStartBtn.textContent = '重新下载';
        dlSub.textContent = '已取消';
      }
    },
    updateProgressUI() {
      const s = this.stats;
      const now = Date.now();
      const elapsed = (now - s.startTime) / 1000;
      const speed = elapsed > 0 ? s.downloadedBytes / elapsed : 0;
      s.speed = speed;
      const pct = s.totalBytes > 0 ? s.downloadedBytes / s.totalBytes
                : s.totalSegments > 0 ? s.completedSegments / s.totalSegments : 0;
      dlBar.style.width = (pct * 100).toFixed(1) + '%';
      dlPercent.textContent = (pct * 100).toFixed(1) + '%';
      dlSpeed.textContent = fmtSpeed(speed);
      dlSize.textContent = fmtBytes(s.downloadedBytes);
      if (speed > 0 && s.totalBytes > 0) {
        dlRemain.textContent = fmtRemain((s.totalBytes - s.downloadedBytes) / speed);
      } else if (speed > 0 && s.totalSegments > 0 && s.completedSegments > 0) {
        const avgPerSeg = s.downloadedBytes / s.completedSegments;
        const remaining = (s.totalSegments - s.completedSegments) * avgPerSeg;
        dlRemain.textContent = fmtRemain(remaining / speed);
      } else dlRemain.textContent = '--';
    },

    /* ---------- 入口 ---------- */
    async start(url) {
      if (this.active) { toast('已有下载任务进行中'); return; }
      if (!url) { toast('请先输入链接'); return; }

      this.active = true;
      this.controller = new AbortController();
      this.stats = { startTime: Date.now(), downloadedBytes: 0, totalBytes: 0, completedSegments: 0, totalSegments: 0, speed: 0 };

      this.setWarn('');
      this.setState('preparing', { sub: '正在解析链接…' });

      const signal = this.controller.signal;
      try {
        if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
          await this.downloadDirect(url, signal);
        } else {
          await this.downloadM3U8(url, signal);
        }
      } catch (err) {
        if (signal.aborted || err.name === 'AbortError') {
          this.setState('canceled');
          toast('已取消下载');
        } else {
          console.error('[VodDownloader]', err);
          this.setState('error');
          const msg = err.message || '未知错误';
          if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
            this.setWarn('⚠️ 网络请求被阻止，目标服务器可能未开启 CORS。<br>请确认链接可直接访问，或换用支持跨域的源。');
          } else if (/SAMPLE-AES/i.test(msg)) {
            this.setWarn('⚠️ ' + msg);
          } else {
            this.setWarn('⚠️ ' + msg);
          }
          toast('下载失败：' + msg);
        }
      } finally {
        this.active = false;
        this.controller = null;
      }
    },
    cancel() {
      if (this.controller) {
        try { this.controller.abort(); } catch (e) {}
        toast('正在取消…');
      }
    },

    /* ---------- 直链下载 ---------- */
    async downloadDirect(url, signal) {
      this.setState('downloading', { sub: '正在下载视频文件…' });
      const res = await fetch(url, { signal, credentials: 'omit', mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const total = parseInt(res.headers.get('content-length') || '0', 10);
      this.stats.totalBytes = total;

      const chunks = [];
      const reader = res.body.getReader();
      let received = 0;
      let lastUi = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        this.stats.downloadedBytes = received;
        const now = Date.now();
        if (now - lastUi > 180) { lastUi = now; this.updateProgressUI(); }
      }
      this.stats.downloadedBytes = received;
      this.updateProgressUI();

      this.setState('merging', { sub: '正在保存文件…' });
      const ext = (url.match(/\.(mp4|webm|mov|m4v|mkv|flv|avi|wmv|3gp)(\?|#|$)/i) || [, 'mp4'])[1];
      const mime = 'video/' + (ext === 'mov' ? 'quicktime' : ext);
      const filename = this.guessFilename(url, ext);
      const size = this.saveBlob(chunks, filename, mime);

      this.setState('done', { sub: '已保存 · ' + fmtBytes(size) });
      toast('下载完成 · ' + fmtBytes(size));
    },

    /* ---------- M3U8 下载 ---------- */
    async downloadM3U8(url, signal) {
      const mainText = await this.fetchText(url, signal);
      let playlist = this.parseM3U8(mainText, url);

      // Master → 选最高清晰度
      if (playlist.isMaster) {
        if (!playlist.variants.length) throw new Error('未找到可用清晰度');
        playlist.variants.sort((a, b) => {
          const ra = parseInt((a.resolution || '0x0').split('x')[0], 10) || 0;
          const rb = parseInt((b.resolution || '0x0').split('x')[0], 10) || 0;
          if (rb !== ra) return rb - ra;
          return b.bandwidth - a.bandwidth;
        });
        const best = playlist.variants[0];
        const label = best.resolution ? ` [${best.resolution}]` : '';
        this.setState('preparing', { sub: '已选清晰度' + label + '，解析中…' });
        const subText = await this.fetchText(best.url, signal);
        playlist = this.parseM3U8(subText, best.url);
      }

      if (!playlist.segments.length) throw new Error('未找到视频片段');

      // 加密方式检查
      const methods = new Set();
      if (playlist.initSegment && playlist.initSegment.key) methods.add(playlist.initSegment.key.method);
      playlist.segments.forEach((s) => { if (s.key) methods.add(s.key.method); });

      if (methods.has('SAMPLE-AES')) {
        throw new Error('SAMPLE-AES 加密流暂不支持浏览器端下载，请使用下载工具');
      }
      const isEncrypted = methods.has('AES-128');
      const encLabel = isEncrypted ? ' · AES-128' : '';

      // fMP4 检测
      const isFMP4 = !!playlist.initSegment || /\.m4s(\?|#|$)/i.test((playlist.segments[0] || {}).url || '');
      const ext = isFMP4 ? 'mp4' : 'ts';
      const mime = isFMP4 ? 'video/mp4' : 'video/mp2t';

      const total = playlist.segments.length;
      this.stats.totalSegments = total + (playlist.initSegment ? 1 : 0);

      this.setState('downloading', {
        sub: `共 ${total} 段${encLabel} · 并发下载中…`
      });

      // 密钥缓存
      const keyCache = new Map();
      const self = this;
      const getKey = async (keyInfo) => {
        if (!keyInfo || !keyInfo.uri) return null;
        if (keyCache.has(keyInfo.uri)) return keyCache.get(keyInfo.uri);
        const promise = self.fetchBinary(keyInfo.uri, signal);
        keyCache.set(keyInfo.uri, promise);
        return promise;
      };

      // 下载 + 解密单段
      const downloadSegment = async (seg) => {
        let data = await self.fetchBinary(seg.url, signal, seg.byteRange);
        if (seg.key && seg.key.method === 'AES-128') {
          const keyBytes = await getKey(seg.key);
          if (!keyBytes) throw new Error('缺少解密密钥');
          const iv = seg.key.iv ? self.hexToBytes(seg.key.iv) : self.seqToIv(seg.sequence);
          data = await self.decryptAES128(data, keyBytes, iv);
        }
        return data;
      };

      // 并发下载
      const chunks = new Array(total);
      const concurrency = Math.min(12, Math.max(4, ENV.cores || 4));
      let nextIndex = 0;
      let completed = 0;
      let lastUi = 0;

      const worker = async () => {
        while (true) {
          if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
          const idx = nextIndex++;
          if (idx >= total) return;
          const seg = playlist.segments[idx];

          let attempts = 0, lastErr;
          while (attempts < 3) {
            try {
              chunks[idx] = await downloadSegment(seg);
              lastErr = null;
              break;
            } catch (err) {
              lastErr = err;
              attempts++;
              if (attempts >= 3 || signal.aborted) throw err;
              await new Promise(r => setTimeout(r, 400 * attempts));
            }
          }
          if (lastErr) throw lastErr;

          completed++;
          self.stats.completedSegments = completed;
          self.stats.downloadedBytes += chunks[idx].byteLength;

          const now = Date.now();
          if (now - lastUi > 180) {
            lastUi = now;
            self.updateProgressUI();
            dlSub.textContent = `共 ${total} 段${encLabel} · 已完成 ${completed}/${total}`;
          }
        }
      };

      const workers = [];
      for (let i = 0; i < concurrency; i++) workers.push(worker());
      await Promise.all(workers);
      self.updateProgressUI();

      // 合并保存
      this.setState('merging', { sub: `正在合并 ${total} 个分片…` });
      dlBar.classList.add('indeterminate');

      const parts = [];
      // fMP4 初始化段
      if (playlist.initSegment) {
        let initData = await self.fetchBinary(playlist.initSegment.url, signal, null);
        if (playlist.initSegment.key && playlist.initSegment.key.method === 'AES-128') {
          const keyBytes = await getKey(playlist.initSegment.key);
          const iv = playlist.initSegment.key.iv
            ? self.hexToBytes(playlist.initSegment.key.iv)
            : self.seqToIv(0);
          initData = await self.decryptAES128(initData, keyBytes, iv);
        }
        parts.push(initData);
      }
      // 按顺序合并
      for (let i = 0; i < total; i++) if (chunks[i]) parts.push(chunks[i]);

      const filename = self.guessFilename(url, ext);
      const size = self.saveBlob(parts, filename, mime);

      this.setState('done', { sub: `已保存 · ${fmtBytes(size)} · ${filename}` });
      toast('下载完成 · ' + fmtBytes(size));
    },

    reset() {
      this.setWarn('');
      this.setState('idle');
      dlProgress.hidden = true;
      dlStartBtn.disabled = false;
      dlStartBtn.textContent = '开始下载';
      dlSub.textContent = 'M3U8 · AES-128 加密 · fMP4 · 直链视频 · 自动合并';
    }
  };

  /* ================= 下载按钮 ================= */
  dlStartBtn.addEventListener('click', () => {
    if (VodDownloader.isActive()) { toast('已有下载任务进行中'); return; }
    const url = currentUrl || urlInput.value.trim();
    if (!url) { toast('请先在顶部输入链接并播放'); return; }
    VodDownloader.start(url);
  });
  dlCancelBtn.addEventListener('click', () => {
    if (VodDownloader.isActive()) VodDownloader.cancel();
  });

  // URL 变化时重置下载面板
  const _origLoad = VodCore.load.bind(VodCore);
  VodCore.load = async function (url, resumeAt) {
    VodDownloader.reset();
    return _origLoad(url, resumeAt);
  };

  /* ================= 初始化 ================= */
  syncPlayIcon();
  renderMarks();
  updateDecoderBtn();
  updateFsIcon();
  showControls();
  VodCore.setStatus('内核就绪', true);

  let lastUrl = '';
  try { lastUrl = localStorage.getItem('vodcore_last_url') || ''; } catch (e) {}
  if (lastUrl) urlInput.value = lastUrl;

  console.log(
    `%cVodCore v${VodCore.version} %c自研播放内核 · 高速下载已就绪`,
    'background:linear-gradient(90deg,#4d8dff,#8f6bff);color:#fff;padding:2px 6px;border-radius:4px;font-weight:bold;',
    'color:#4d8dff;font-weight:bold;'
  );
  console.log('环境探测：', ENV);
  console.log('智能解码推荐：', SmartDecoder.pick());

})();
</script>
