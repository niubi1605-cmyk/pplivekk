<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="referrer" content="no-referrer">
<title>VodCore 播放器 · 防盗链修复版</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{--bg:#08090d;--panel:#111521;--panel-2:#171c2b;--line:#232a3d;--text:#eef1f8;--muted:#828ba3;
    --brand:#4d8dff;--brand-2:#7db0ff;--gold:#ffd166;--danger:#ff5f5f;--ok:#3ddc97;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:radial-gradient(1100px 560px at 50% -14%,#141d33 0%,var(--bg) 60%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}
  .app{max-width:980px;margin:0 auto;padding:12px 12px calc(30px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 2px 0;}
  .brand-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#8f6bff);
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(77,141,255,.35);flex:none;}
  .brand-logo svg{width:17px;height:17px;color:#fff;}
  .brand-name{font-weight:800;font-size:15px;}
  .brand-name small{color:var(--muted);font-weight:600;font-size:11px;margin-left:5px;}
  .brand-badge{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ok);
    background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.3);padding:3px 8px;border-radius:99px;
    display:flex;align-items:center;gap:5px;}
  .brand-badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .urlbar{display:flex;gap:8px;}
  .urlbar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:13px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .urlbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(77,141,255,.14);}
  .urlbar input::placeholder{color:var(--muted);}
  .btn-go{flex:none;border:none;border-radius:12px;padding:0 22px;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand-2),var(--brand));cursor:pointer;
    transition:transform .1s,filter .15s;box-shadow:0 4px 16px rgba(77,141,255,.3);}
  .btn-go:active{transform:scale(.97);filter:brightness(.92);}
  .player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);user-select:none;-webkit-user-select:none;isolation:isolate;}
  .player:fullscreen,.player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none;}
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000;}
  .big-play{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.92);
    pointer-events:none;opacity:0;transition:opacity .2s;
    background:radial-gradient(circle at center,rgba(0,0,0,.35),transparent 62%);
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.7));}
  .big-play.show{opacity:1;}
  .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.32);z-index:5;
    opacity:0;transition:opacity .18s;pointer-events:none;}
  .loading.show{opacity:1;pointer-events:auto;}
  .spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--brand-2);animation:spin .75s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .core-tag{position:absolute;top:10px;left:10px;z-index:6;display:flex;align-items:center;gap:6px;
    background:rgba(8,9,13,.72);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:4px 10px;
    font-size:10.5px;font-weight:700;color:var(--text);backdrop-filter:blur(8px);pointer-events:none;
    opacity:0;transition:opacity .25s;}
  .core-tag.show{opacity:1;}
  .core-tag i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);flex:none;}
  .core-tag i.enc{background:var(--gold);box-shadow:0 0 7px var(--gold);}
  .ctrls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:34px 12px 8px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.9));transition:opacity .25s,transform .25s;}
  .ctrls.hidden{opacity:0;transform:translateY(10px);pointer-events:none;}
  .progress{position:relative;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none;}
  .track,.bar-buffer,.bar-played{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:99px;}
  .track{right:0;background:rgba(255,255,255,.18);}
  .bar-buffer{background:rgba(255,255,255,.3);width:0;}
  .bar-played{background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;box-shadow:0 0 10px rgba(77,141,255,.6);}
  .bar-thumb{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(77,141,255,.35);opacity:0;transition:opacity .15s;}
  .player:hover .bar-thumb,.progress.dragging .bar-thumb{opacity:1;}
  .bar-marks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:16px;pointer-events:none;}
  .bar-marks i{position:absolute;top:0;width:2px;height:16px;border-radius:2px;background:var(--gold);
    transform:translateX(-1px);box-shadow:0 0 7px rgba(255,209,102,.85);}
  .ctrl-row{display:flex;align-items:center;gap:4px;margin-top:2px;}
  .icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;width:38px;height:38px;border-radius:10px;
    display:grid;place-items:center;transition:background .15s;flex:none;}
  .icon-btn:hover{background:rgba(255,255,255,.13);}
  .icon-btn svg{width:20px;height:20px;}
  .time{font-variant-numeric:tabular-nums;font-size:12px;color:rgba(255,255,255,.85);margin-left:4px;white-space:nowrap;}
  .grow{flex:1;}
  select.speed{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.13);color:#fff;border:none;
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;outline:none;
    font-variant-numeric:tabular-nums;font-family:inherit;}
  select.speed option{background:#171c2b;color:#fff;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:11px 13px;border-radius:12px;
    border:1px solid transparent;font-size:13px;font-weight:700;cursor:pointer;
    user-select:none;-webkit-user-select:none;white-space:nowrap;transition:transform .1s,background .15s,box-shadow .2s;
    font-family:inherit;}
  .pill:active{transform:scale(.95);}
  .pill svg{width:16px;height:16px;flex:none;}
  .pill-flag{color:var(--gold);border-color:rgba(255,209,102,.36);
    background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,209,102,.06));}
  .pill-flag.pulse{box-shadow:0 0 0 6px rgba(255,209,102,.2);}
  .pill-decoder{color:var(--brand-2);border-color:rgba(77,141,255,.4);
    background:linear-gradient(180deg,rgba(77,141,255,.2),rgba(77,141,255,.06));}
  .pill-decoder.pulse{box-shadow:0 0 0 6px rgba(77,141,255,.2);}
  .pill-diag{color:#c084fc;border-color:rgba(192,132,252,.4);
    background:linear-gradient(180deg,rgba(192,132,252,.2),rgba(192,132,252,.06));}
  .search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;transition:border-color .15s;min-width:160px;}
  .search:focus-within{border-color:var(--brand);}
  .search svg{width:16px;height:16px;color:var(--muted);flex:none;}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:14px;height:100%;}
  .search input::placeholder{color:var(--muted);}
  .marks{display:flex;flex-direction:column;gap:8px;}
  .mark-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;
    touch-action:pan-y;transition:background .15s,border-color .15s,transform .08s;animation:pop .18s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-5px);}}
  .mark-item:hover{background:var(--panel-2);border-color:#32405c;}
  .mark-item:active{transform:scale(.99);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gold);box-shadow:0 0 8px rgba(255,209,102,.75);}
  .m-time{flex:none;font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;color:var(--gold);
    background:rgba(255,209,102,.13);border-radius:7px;padding:3px 9px;}
  .m-title{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .m-del{flex:none;width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:10px;
    background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s;touch-action:manipulation;}
  .m-del:hover{background:rgba(255,95,95,.14);color:var(--danger);}
  .m-del svg{width:17px;height:17px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 16px;
    border:1px dashed var(--line);border-radius:12px;line-height:1.7;}
  .dl-card{background:linear-gradient(180deg,var(--panel),#0e1220);border:1px solid var(--line);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s;}
  .dl-card.active{border-color:rgba(77,141,255,.5);box-shadow:0 0 0 3px rgba(77,141,255,.08),0 8px 30px rgba(77,141,255,.08);}
  .dl-head{display:flex;align-items:center;gap:12px;}
  .dl-icon{width:42px;height:42px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,rgba(77,141,255,.25),rgba(143,107,255,.18));
    border:1px solid rgba(77,141,255,.32);display:grid;place-items:center;color:var(--brand-2);}
  .dl-icon svg{width:20px;height:20px;}
  .dl-info{flex:1;min-width:0;}
  .dl-title{font-size:14.5px;font-weight:800;}
  .dl-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-start{flex:none;border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand-2),var(--brand));cursor:pointer;
    transition:transform .1s,filter .15s;box-shadow:0 4px 14px rgba(77,141,255,.32);font-family:inherit;white-space:nowrap;}
  .dl-start:active{transform:scale(.96);filter:brightness(.9);}
  .dl-start:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .dl-progress{display:flex;flex-direction:column;gap:9px;}
  .dl-bar-wrap{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
  .dl-bar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    border-radius:99px;transition:width .22s ease;box-shadow:0 0 12px rgba(77,141,255,.65);}
  .dl-bar.indeterminate{width:36% !important;animation:dlSlide 1.3s cubic-bezier(.5,.1,.5,.9) infinite;}
  @keyframes dlSlide{0%{left:-36%;}100%{left:100%;}}
  .dl-stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .dl-stats b{color:var(--text);font-weight:700;}
  .dl-actions{display:flex;gap:8px;justify-content:flex-end;}
  .dl-btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 14px;
    border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .15s,border-color .15s;}
  .dl-btn-ghost:hover{background:rgba(255,255,255,.05);border-color:#32405c;}
  .dl-btn-danger{border-color:rgba(255,95,95,.36);color:var(--danger);}
  .dl-btn-danger:hover{background:rgba(255,95,95,.1);}
  .dl-btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
  .dl-warn{font-size:11.5px;color:var(--gold);background:rgba(255,209,102,.08);
    border:1px solid rgba(255,209,102,.24);border-radius:9px;padding:9px 11px;line-height:1.55;display:none;}
  .dl-warn.show{display:block;}
  .menu{position:fixed;z-index:999;min-width:156px;background:#171c2b;border:1px solid var(--line);
    border-radius:12px;padding:6px;box-shadow:0 14px 38px rgba(0,0,0,.65);animation:pop .14s ease;}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:14px;
    padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .12s;font-family:inherit;}
  .menu button:hover{background:rgba(255,255,255,.08);}
  .menu button.danger{color:var(--danger);}
  .decoder-menu{min-width:260px;max-width:92vw;max-height:min(74vh,500px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .menu-title{font-size:11px;font-weight:800;color:var(--muted);padding:8px 12px 6px;letter-spacing:.08em;
    display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .menu-title .badge{font-size:10px;font-weight:700;color:var(--brand-2);background:rgba(77,141,255,.14);
    border-radius:6px;padding:2px 6px;letter-spacing:0;}
  .decoder-menu button.decoder-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;}
  .decoder-item .d-name{font-size:13.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;line-height:1.3;}
  .decoder-item .d-desc{font-size:11px;color:var(--muted);line-height:1.35;}
  .decoder-item.active{background:rgba(77,141,255,.14);}
  .decoder-item.active .d-name{color:var(--brand-2);}
  .decoder-item:disabled{opacity:.35;cursor:not-allowed;}
  .decoder-item:disabled:hover{background:none;}
  .d-check{font-size:12px;color:var(--brand-2);}
  .menu-sep{height:1px;background:var(--line);margin:6px 8px;}
  .toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);background:rgba(23,28,43,.98);
    border:1px solid var(--line);color:var(--text);padding:10px 20px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:1000;max-width:82vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* 诊断面板 */
  .diag-panel{
    position:fixed;inset:auto 10px 10px 10px;max-height:70vh;
    background:#0d111c;border:1px solid var(--line);border-radius:14px;z-index:1001;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    animation:pop .18s ease;
  }
  .diag-panel[hidden]{display:none;}
  .diag-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .diag-head b{font-size:14px;font-weight:800;color:#c084fc;}
  .diag-head .spacer{flex:1;}
  .diag-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 6px;}
  .diag-close:hover{color:var(--text);}
  .diag-body{padding:12px 14px;overflow-y:auto;font-size:12px;line-height:1.6;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);}
  .diag-body h4{margin:14px 0 6px;font-size:12px;color:#c084fc;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
  .diag-body h4:first-child{margin-top:0;}
  .diag-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed #1c2334;}
  .diag-row .k{color:var(--muted);flex:none;min-width:110px;}
  .diag-row .v{flex:1;min-width:0;word-break:break-all;}
  .diag-row .v.ok{color:var(--ok);}
  .diag-row .v.err{color:var(--danger);}
  .diag-row .v.warn{color:var(--gold);}
  .diag-pre{background:#08090d;border:1px solid #1c2334;border-radius:8px;padding:10px;
    max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;
    font-size:11px;color:#aab3c8;line-height:1.5;margin-top:6px;}
  .diag-actions{display:flex;gap:8px;padding:0 14px 14px;}
  .diag-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;
    color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;}
  .diag-btn:hover{background:rgba(255,255,255,.06);}
  .diag-btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:transparent;
    color:#fff;box-shadow:0 4px 14px rgba(77,141,255,.3);}
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>
      </svg>
    </div>
    <div class="brand-name">VodCore<small>防盗链修复版</small></div>
    <div class="brand-badge" id="coreStatus"><i></i><span>内核就绪</span></div>
  </div>

  <div class="urlbar">
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="粘贴 M3U8 / 加密 M3U8 / 视频直链…">
    <button id="loadBtn" class="btn-go">播放</button>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline webkit-playsinline x5-playsinline preload="metadata" referrerpolicy="no-referrer"></video>
    <div class="core-tag" id="coreTag"><i id="coreDot"></i><span id="coreText">VodCore</span></div>
    <div class="big-play" id="bigPlay">
      <svg viewBox="0 0 24 24" width="62" height="62" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div class="ctrls" id="ctrls">
      <div class="progress" id="progress">
        <div class="track"></div>
        <div class="bar-buffer" id="barBuffer"></div>
        <div class="bar-played" id="barPlayed"></div>
        <div class="bar-marks" id="barMarks"></div>
        <div class="bar-thumb" id="barThumb"></div>
      </div>
      <div class="ctrl-row">
        <button class="icon-btn" id="playBtn" title="播放 / 暂停"></button>
        <span class="time" id="timeLabel">00:00 / 00:00</span>
        <div class="grow"></div>
        <select class="speed" id="speedSelect" title="播放倍速"></select>
        <button class="icon-btn" id="pipBtn" title="画中画"></button>
        <button class="icon-btn" id="fsBtn" title="全屏 / 横屏"></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="pill pill-flag" id="flagBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
      <span>标记</span>
    </button>
    <button class="pill pill-decoder" id="decoderBtn" title="切换解码方案">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>
      </svg>
      <span>解码</span>
    </button>
    <button class="pill pill-diag" id="diagBtn" title="URL 诊断，查看服务器实际返回的内容">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        <path d="M11 8v3M11 14h.01"/>
      </svg>
      <span>诊断</span>
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
 *  VodCore v5.0 · 防盗链修复版
 *  核心修复：所有请求强制 no-referrer，防止 CDN 依据 Referer 返回替换内容
 * ================================================================ */
(function () {
  'use strict';

  const ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    pip:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>',
    fs:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
    fsOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
  };

  const $ = (id) => document.getElementById(id);
  const video = $('video'), player = $('player'), urlInput = $('urlInput'), loadBtn = $('loadBtn');
  const loading = $('loading'), bigPlay = $('bigPlay'), ctrls = $('ctrls'), progress = $('progress');
  const barBuffer = $('barBuffer'), barPlayed = $('barPlayed'), barMarks = $('barMarks'), barThumb = $('barThumb');
  const playBtn = $('playBtn'), timeLabel = $('timeLabel'), speedSel = $('speedSelect');
  const pipBtn = $('pipBtn'), fsBtn = $('fsBtn'), flagBtn = $('flagBtn'), decoderBtn = $('decoderBtn');
  const diagBtn = $('diagBtn'), searchInput = $('searchInput'), marksList = $('marksList'), emptyTip = $('emptyTip');
  const menu = $('menu'), decoderMenu = $('decoderMenu'), toastEl = $('toast');
  const coreStatus = $('coreStatus'), coreTag = $('coreTag'), coreText = $('coreText'), coreDot = $('coreDot');
  const dlCard = $('dlCard'), dlSub = $('dlSub'), dlWarn = $('dlWarn'), dlStartBtn = $('dlStartBtn');
  const dlProgress = $('dlProgress'), dlBar = $('dlBar'), dlPercent = $('dlPercent');
  const dlSpeed = $('dlSpeed'), dlRemain = $('dlRemain'), dlSize = $('dlSize'), dlCancelBtn = $('dlCancelBtn');
  const diagPanel = $('diagPanel'), diagBody = $('diagBody'), diagClose = $('diagClose'), diagRun = $('diagRun'), diagCopy = $('diagCopy');

  playBtn.innerHTML = ICON.play;
  bigPlay.innerHTML = ICON.play;
  pipBtn.innerHTML = ICON.pip;
  fsBtn.innerHTML = ICON.fs;

  /* ================= 环境 ================= */
  const ENV = (function () {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const maxTouch = navigator.maxTouchPoints || 0;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && maxTouch > 1);
    const isAndroid = /Android/i.test(ua);
    const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Chromium|Edg|OPR|FxiOS/i.test(ua);
    const isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const effectiveType = conn ? (conn.effectiveType || '') : '';
    const saveData = !!(conn && conn.saveData);
    const downlink = (conn && typeof conn.downlink === 'number') ? conn.downlink : 0;
    const cores = navigator.hardwareConcurrency || 4;
    const memory = navigator.deviceMemory || 4;
    const nativeHls = video.canPlayType('application/vnd.apple.mpegurl') || '';
    const nativeHlsOk = nativeHls === 'maybe' || nativeHls === 'probably';
    const hlsJsOk = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
    const webCryptoOk = !!(window.crypto && window.crypto.subtle);
    return {
      isIOS, isAndroid, isSafari, isMobile, effectiveType, saveData, downlink,
      cores, memory, lowEnd: cores <= 2 || memory <= 2, highEnd: cores >= 8 && memory >= 4,
      nativeHlsOk, hlsJsOk, webCryptoOk
    };
  })();

  /* ================= 工具 ================= */
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const p = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
  }
  function fmtBytes(n) {
    if (!isFinite(n) || n <= 0) return '--';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
    return (n/1073741824).toFixed(2) + ' GB';
  }
  function fmtSpeed(bps) {
    if (!isFinite(bps) || bps <= 0) return '--';
    return fmtBytes(bps) + '/s';
  }
  function fmtRemain(sec) {
    if (!isFinite(sec) || sec <= 0) return '--';
    if (sec < 60) return Math.ceil(sec) + 's';
    if (sec < 3600) return Math.floor(sec/60) + 'm ' + Math.floor(sec%60) + 's';
    return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
  }
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
  }
  function attachPress(el, opts) {
    const longMs = opts.longMs || 520;
    let timer = null, fired = false, moved = false, sx = 0, sy = 0;
    const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      fired = false; moved = false; sx = e.clientX; sy = e.clientY; clear();
      timer = setTimeout(() => { timer = null; fired = true; opts.onLong && opts.onLong(e); }, longMs);
    });
    el.addEventListener('pointermove', (e) => {
      if (moved) return;
      if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) { moved = true; clear(); }
    });
    el.addEventListener('pointerup', (e) => { clear(); if (!fired && !moved && opts.onTap) opts.onTap(e); });
    el.addEventListener('pointercancel', () => { clear(); fired = true; });
    el.addEventListener('pointerleave', clear);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  function openPopupNear(el, anchor) {
    el.hidden = false;
    el.style.visibility = 'hidden';
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = Math.min(r.left, window.innerWidth - w - 10);
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 8);
    el.style.left = Math.max(10, left) + 'px';
    el.style.top = Math.max(10, top) + 'px';
    el.style.visibility = '';
  }

  /* ================================================================
   *  SafeFetch · 防替换网络层
   *  关键：所有请求 referrerPolicy: 'no-referrer'
   * ================================================================ */
  const SafeFetch = {
    baseOpts() {
      return {
        credentials: 'omit',
        mode: 'cors',
        cache: 'no-store',
        referrerPolicy: 'no-referrer',
        redirect: 'follow'
      };
    },
    async get(url, signal, extra) {
      const opts = Object.assign(this.baseOpts(), extra || {});
      if (signal) opts.signal = signal;
      return await fetch(url, opts);
    },
    async text(url, signal, extra) {
      const res = await this.get(url, signal, extra);
      const text = await res.text();
      return { res, text };
    },
    async binary(url, signal, byteRange) {
      const extra = {};
      if (byteRange && byteRange.length) {
        const start = byteRange.offset || 0;
        extra.headers = { Range: `bytes=${start}-${start + byteRange.length - 1}` };
      }
      const res = await this.get(url, signal, extra);
      if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
      return new Uint8Array(await res.arrayBuffer());
    }
  };

  /* ================= 内容校验 ================= */
  function looksLikeM3U8(text) {
    return /^\s*#EXTM3U/i.test(text);
  }
  function looksLikeHTML(text) {
    const t = text.trim().slice(0, 200).toLowerCase();
    return t.startsWith('<!doctype') || t.startsWith('<html') ||
           (t.includes('<head') && t.includes('<body'));
  }
  function looksLikeJSON(text) {
    const t = text.trim();
    if ((t.startsWith('{') && t.endsWith('}')) || (t.startsWith('[') && t.endsWith(']'))) {
      try { JSON.parse(t); return true; } catch (e) { return false; }
    }
    return false;
  }

  /* ================= 标记存储 ================= */
  const STORE_KEY = 'vodcore_marks_v1';
  let markStore = {};
  try { markStore = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { markStore = {}; }
  let currentUrl = '', marks = [];
  function saveMarks() {
    if (!currentUrl) return;
    if (marks.length) markStore[currentUrl] = marks;
    else delete markStore[currentUrl];
    try { localStorage.setItem(STORE_KEY, JSON.stringify(markStore)); } catch (e) {}
  }

  /* ================= 解码器 ================= */
  const DECODERS = {
    auto: { name: '智能解码（推荐）', desc: '自动探测设备与网络，实时选择最优策略', auto: true },
    hardware: { name: '硬件加速优先', desc: 'GPU 硬解，省电发热低，适合高分片源',
      hls: { enableWorker: true, enableSoftwareAES: false, capLevelToPlayerSize: true, startLevel: -1 } },
    software: { name: '软件解码', desc: '主线程软解，兼容怪编码',
      hls: { enableWorker: false, enableSoftwareAES: true, progressive: true, startLevel: -1, maxBufferLength: 60 } },
    lowlatency: { name: '低延迟直播', desc: '极限小缓冲',
      hls: { enableWorker: true, lowLatencyMode: true, maxBufferLength: 6, backBufferLength: 0, liveSyncDurationCount: 1 } },
    smooth: { name: '流畅优先', desc: '大缓冲策略',
      hls: { enableWorker: true, maxBufferLength: 120, maxMaxBufferLength: 300, backBufferLength: 180, startLevel: -1 } },
    compat: { name: '兼容模式', desc: '关闭高级特性，老旧设备 / 弱网首选',
      hls: { enableWorker: false, maxBufferLength: 30, backBufferLength: 30, enableSoftwareAES: true,
        manifestLoadingMaxRetry: 8, levelLoadingMaxRetry: 8, fragLoadingMaxRetry: 10, startLevel: -1 } },
    secure: { name: '加密链接增强', desc: '针对 AES 加密流优化',
      hls: { enableWorker: true, enableSoftwareAES: true, maxBufferLength: 60, backBufferLength: 60, startLevel: -1 } },
    native: { name: '浏览器原生解码', desc: '交给浏览器内核，Safari / iOS 效果最佳', native: true }
  };
  const DECODER_ORDER = ['auto','hardware','software','lowlatency','smooth','compat','secure','native'];
  let currentDecoder = 'auto';
  try { const s = localStorage.getItem('vodcore_decoder'); if (s && DECODERS[s]) currentDecoder = s; } catch (e) {}

  const SmartDecoder = {
    pick() {
      if (ENV.isIOS) return ENV.nativeHlsOk ? 'native' : 'compat';
      if (ENV.isSafari && !ENV.isMobile) return ENV.nativeHlsOk ? 'native' : (ENV.hlsJsOk ? 'hardware' : 'compat');
      if (!ENV.hlsJsOk) return ENV.nativeHlsOk ? 'native' : 'compat';
      if (ENV.saveData) return 'compat';
      if (ENV.lowEnd) return 'compat';
      if (ENV.isMobile) return 'smooth';
      return 'hardware';
    },
    resolve(key) {
      if (DECODERS[key] && DECODERS[key].auto) {
        const p = this.pick();
        return DECODERS[p] ? p : 'compat';
      }
      return DECODERS[key] ? key : 'compat';
    }
  };

  /* ================= 播放内核 ================= */
  const VodCore = {
    version: '5.0.0', hls: null, retries: 0,
    loadingShown: false, loadingTimer: null, wasPlaying: false, keyDetected: false,
    scheduleLoading(d) {
      if (this.loadingShown) return;
      clearTimeout(this.loadingTimer);
      this.loadingTimer = setTimeout(() => {
        if (video.readyState < 3 && !video.paused) { this.loadingShown = true; loading.classList.add('show'); }
      }, d || 500);
    },
    showLoadingNow() { clearTimeout(this.loadingTimer); this.loadingShown = true; loading.classList.add('show'); },
    hideLoading() { clearTimeout(this.loadingTimer); this.loadingShown = false; loading.classList.remove('show'); },
    setTag(t, enc) {
      coreText.textContent = t;
      coreDot.classList.toggle('enc', !!enc);
      coreTag.classList.add('show');
      clearTimeout(this._tagTimer);
      this._tagTimer = setTimeout(() => coreTag.classList.remove('show'), 4200);
    },
    setStatus(t, ok) {
      coreStatus.querySelector('span').textContent = t;
      const i = coreStatus.querySelector('i');
      i.style.background = ok ? 'var(--ok)' : 'var(--danger)';
      i.style.boxShadow = ok ? '0 0 8px var(--ok)' : '0 0 8px var(--danger)';
    },

    /* ---- 探测：同时验证内容是否为 M3U8 ---- */
    async probe(url) {
      if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi)(\?|#|$)/i.test(url)) {
        return { type: 'direct' };
      }
      try {
        const { res, text } = await SafeFetch.text(url);
        if (!res.ok) {
          return { type: 'error', message: 'HTTP ' + res.status, status: res.status };
        }
        if (looksLikeM3U8(text)) {
          return {
            type: 'm3u8',
            encrypted: /#EXT-X-KEY:METHOD=(AES-128|SAMPLE-AES|AES-256)/i.test(text),
            text: text,
            redirected: res.redirected,
            finalUrl: res.url
          };
        }
        if (looksLikeHTML(text)) {
          return { type: 'html', message: '服务器返回的是 HTML 页面，不是 M3U8。请检查链接是否为播放页而非视频源。',
            preview: text.slice(0, 200) };
        }
        if (looksLikeJSON(text)) {
          return { type: 'json', message: '服务器返回的是 JSON，不是 M3U8。可能这是一个 API 接口链接。',
            preview: text.slice(0, 200) };
        }
        return { type: 'unknown', message: '服务器返回的内容不是 M3U8',
          preview: text.slice(0, 200), redirected: res.redirected, finalUrl: res.url };
      } catch (e) {
        return { type: 'network-error', message: e.message || '网络请求失败' };
      }
    },

    async load(url, resumeAt) {
      url = (url || '').trim();
      if (!url) { toast('请输入链接'); return; }
      resumeAt = resumeAt || 0;
      currentUrl = url;
      marks = (markStore[url] || []).slice();
      renderMarks(); renderBarMarks();
      this.wasPlaying = !video.paused;
      this.retries = 0; this.keyDetected = false;
      if (this.hls) { try { this.hls.destroy(); } catch (e) {} this.hls = null; }
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
      this.showLoadingNow();
      this.setStatus('加载中…', true);

      const probe = await this.probe(url);

      // 内容校验：防止静默播放错误内容
      if (probe.type === 'html' || probe.type === 'json' || probe.type === 'unknown') {
        this.hideLoading();
        this.setStatus('内容校验失败', false);
        this.setTag('⚠️ 返回的不是 M3U8', false);
        console.warn('[VodCore] 内容校验失败：', probe);
        toast('警告：' + probe.message);
        // 在诊断面板展示详情
        showDiagReport(buildProbeReport(url, probe));
        return;
      }
      if (probe.type === 'network-error') {
        this.hideLoading();
        this.setStatus('网络错误', false);
        this.setTag('⚠️ 网络请求失败', false);
        toast('网络请求失败：' + probe.message);
        showDiagReport(buildProbeReport(url, probe));
        return;
      }
      if (probe.redirected) {
        console.warn('[VodCore] URL 被重定向：', url, '→', probe.finalUrl);
        toast('⚠️ URL 被服务器重定向');
      }
      if (probe.encrypted) {
        this.keyDetected = true;
        this.setTag('加密流 · 需解密', true);
      }

      const decoderKey = SmartDecoder.resolve(currentDecoder);
      const decoder = DECODERS[decoderKey] || DECODERS.compat;
      const isDirect = probe.type === 'direct';
      const useHlsJs = !isDirect && ENV.hlsJsOk && !decoder.native;
      if (currentDecoder === 'auto' && !isDirect) toast('智能解码 → ' + decoder.name);
      this.setTag('VodCore · ' + (isDirect ? '直链' : decoder.name), this.keyDetected);

      if (useHlsJs) this._viaHlsJs(url, decoder, resumeAt);
      else if (ENV.nativeHlsOk || isDirect) this._viaNative(url, resumeAt);
      else {
        this.hideLoading();
        this.setStatus('无可用解码', false);
        toast('请点击「解码」切换');
      }
    },

    _viaHlsJs(url, decoder, resumeAt) {
      // 关键：fetchSetup 强制 no-referrer
      const baseCfg = {
        enableWorker: true, lowLatencyMode: false, backBufferLength: 90, maxBufferLength: 60,
        manifestLoadingMaxRetry: 4, levelLoadingMaxRetry: 4, fragLoadingMaxRetry: 6,
        manifestLoadingTimeOut: 15000, levelLoadingTimeOut: 15000, fragLoadingTimeOut: 20000,
        startLevel: -1,
        // 新版 HLS.js 用 fetch loader
        fetchSetup: (context, initParams) => {
          initParams.referrerPolicy = 'no-referrer';
          initParams.credentials = 'omit';
          initParams.mode = 'cors';
          initParams.cache = 'no-store';
          return new Request(context.url, initParams);
        },
        // 旧版 XHR loader 兜底
        xhrSetup: (xhr, reqUrl) => {
          try {
            xhr.withCredentials = false;
            // 某些浏览器允许设置 referrer
            if ('referrer' in xhr) xhr.referrer = '';
          } catch (e) {}
          if (/key/i.test(reqUrl)) {
            this.keyDetected = true;
            coreDot.classList.add('enc');
            this.setTag('VodCore · 解密中…', true);
          }
        }
      };
      const cfg = Object.assign(baseCfg, decoder.hls || {});
      let hls;
      try { hls = new window.Hls(cfg); }
      catch (e) { this.hideLoading(); this.setStatus('内核启动失败', false); toast('HLS 启动失败：' + e.message); return; }
      this.hls = hls;

      hls.on(window.Hls.Events.KEY_LOADING, () => {
        this.keyDetected = true;
        coreDot.classList.add('enc');
        this.setTag('VodCore · 解密中…', true);
      });
      hls.on(window.Hls.Events.KEY_LOADED, () => this.setTag('VodCore · 已解密', true));

      // 记录实际加载的分片 URL，便于诊断
      hls.on(window.Hls.Events.FRAG_LOADING, (e, data) => {
        if (!window.__vodLastFrag) window.__vodLastFrag = [];
        window.__vodLastFrag.push(data.frag.url);
        if (window.__vodLastFrag.length > 5) window.__vodLastFrag.shift();
      });

      hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
        this.hideLoading(); this.setStatus('播放中', true);
        if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
        video.play().catch(() => {});
        try {
          const lv = hls.levels && hls.levels[0];
          if (lv) this.setTag(`VodCore · ${lv.width}x${lv.height}`, this.keyDetected);
        } catch (e) {}
      });

      hls.on(window.Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && this.retries < 4) {
          this.retries++; toast(`网络抖动，重试 (${this.retries}/4)…`);
          try { hls.startLoad(); } catch (e) {}
          return;
        }
        if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && this.retries < 4) {
          this.retries++; toast(`解码恢复中 (${this.retries}/4)…`);
          try { hls.recoverMediaError(); } catch (e) {}
          return;
        }
        this.hideLoading(); this.setStatus('播放失败', false);
        toast('播放失败：' + (data.details || '未知错误'));
      });

      hls.loadSource(url);
      hls.attachMedia(video);
    },

    _viaNative(url, resumeAt) {
      this.setTag('VodCore · 原生解码', this.keyDetected);
      // 关键：video 元素已设置 referrerpolicy="no-referrer"
      try { video.referrerPolicy = 'no-referrer'; } catch (e) {}
      const onMeta = () => {
        video.removeEventListener('loadedmetadata', onMeta);
        this.hideLoading(); this.setStatus('播放中', true);
        if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
        video.play().catch(() => {});
        this.setTag(`VodCore · ${video.videoWidth}x${video.videoHeight}`, this.keyDetected);
      };
      video.addEventListener('loadedmetadata', onMeta);
      const onErr = () => {
        video.removeEventListener('error', onErr);
        this.hideLoading(); this.setStatus('原生失败', false);
        if (currentDecoder !== 'compat' && ENV.hlsJsOk) {
          toast('原生失败，自动切换 HLS 内核…');
          currentDecoder = 'compat';
          try { localStorage.setItem('vodcore_decoder', 'compat'); } catch (e) {}
          updateDecoderBtn();
          this.load(currentUrl, video.currentTime || 0);
        } else toast('原生失败，请点击「解码」切换');
      };
      video.addEventListener('error', onErr);
      video.src = url;
    },

    play() { if (currentUrl) video.play().catch(() => {}); },
    pause() { video.pause(); },
    toggle() { if (!currentUrl) { toast('请先输入链接'); return; } video.paused ? this.play() : this.pause(); },
    seek(t) {
      if (!currentUrl) return;
      const d = video.duration;
      const target = (isFinite(d) && d > 0) ? Math.min(t, Math.max(0, d - 0.05)) : t;
      try { video.currentTime = target; } catch (e) {}
      this.scheduleLoading(300);
    },
    setRate(r) { video.playbackRate = r; },
    setDecoder(key, silent) {
      if (!DECODERS[key]) return;
      if (key === currentDecoder) {
        const real = SmartDecoder.resolve(key);
        toast('当前已是「' + DECODERS[key].name + '」' + (DECODERS[key].auto ? `（实际：${DECODERS[real].name}）` : ''));
        return;
      }
      currentDecoder = key;
      try { localStorage.setItem('vodcore_decoder', key); } catch (e) {}
      updateDecoderBtn();
      if (!silent) {
        const real = SmartDecoder.resolve(key);
        toast('解码已切换：' + DECODERS[key].name + (DECODERS[key].auto ? `（实际：${DECODERS[real].name}）` : ''));
      }
      if (currentUrl) this.load(currentUrl, isFinite(video.currentTime) ? video.currentTime : 0);
    }
  };

                  el.mozRequestFullScreen || el.msRequestFullscreen;

        try { const p = req.call(el); if (p && typeof p.then === 'function') await p; ok = true; }
        catch (err) { ok = false; }

  function buildProbeReport(url, probe) {
    const lines = [];
    lines.push('URL: ' + url);
    lines.push('时间: ' + new Date().toLocaleString());
    lines.push('');
    lines.push('【探测结果】');
    lines.push('类型: ' + probe.type);
    if (probe.status) lines.push('HTTP 状态: ' + probe.status);
    if (probe.redirected !== undefined) lines.push('是否重定向: ' + (probe.redirected ? '是' : '否'));
    if (probe.finalUrl) lines.push('最终 URL: ' + probe.finalUrl);
    if (probe.encrypted !== undefined) lines.push('是否加密: ' + (probe.encrypted ? '是' : '否'));
    if (probe.message) lines.push('消息: ' + probe.message);
    if (probe.preview) {
      lines.push('');
      lines.push('【内容预览】');
      lines.push(probe.preview);
    }
    if (window.__vodLastFrag && window.__vodLastFrag.length) {
      lines.push('');
      lines.push('【最近加载的分片】');
      window.__vodLastFrag.forEach((u, i) => lines.push((i + 1) + '. ' + u));
    }
    return lines.join('\n');
  }

  async function runDiagnose() {
    const url = currentUrl || urlInput.value.trim();
    if (!url) { toast('请先输入链接'); return; }
    diagBody.innerHTML = '<div style="color:var(--muted);">正在诊断…</div>';
    diagPanel.hidden = false;

    const urlHtml = escapeHtml(url);
    const lines = [];
    lines.push(row('请求 URL', urlHtml));
    lines.push(row('时间', escapeHtml(new Date().toLocaleString())));
    lines.push(row('请求模式', 'no-referrer · credentials=omit · cache=no-store'));

    try {
      const probe = await VodCore.probe(url);
      lines.push('');
      lines.push('<h4>响应分析</h4>');
      lines.push(row('内容类型', escapeHtml(probe.type)));
      if (probe.status) lines.push(row('HTTP 状态', probe.status + (probe.status === 200 ? ' ✅' : ' ⚠️'), probe.status === 200 ? 'ok' : 'err'));
      if (probe.redirected !== undefined) {
        lines.push(row('是否被重定向', probe.redirected ? '⚠️ 是' : '否', probe.redirected ? 'err' : 'ok'));
      }
      if (probe.finalUrl && probe.finalUrl !== url) {
        lines.push(row('最终 URL', escapeHtml(probe.finalUrl), 'warn'));
      }
      if (probe.encrypted !== undefined) {
        lines.push(row('是否加密', probe.encrypted ? '是' : '否', probe.encrypted ? 'warn' : 'ok'));
      }
      if (probe.message) lines.push(row('说明', escapeHtml(probe.message)));

      if (probe.preview) {
        lines.push('<h4>内容预览（前 300 字符）</h4>');
        lines.push('<div class="diag-pre">' + escapeHtml(probe.preview) + '</div>');
      }

      // 内容判定
      lines.push('');
      lines.push('<h4>判定</h4>');
      if (probe.type === 'm3u8') {
        lines.push(row('结论', '✅ 这是有效的 M3U8 播放列表', 'ok'));
      } else if (probe.type === 'html') {
        lines.push(row('结论', '❌ 返回的是网页，不是视频源', 'err'));
        lines.push(row('建议', '你复制的可能是"播放页"URL，需要从播放器的网络请求里找到 .m3u8 的真实地址'));
      } else if (probe.type === 'json') {
        lines.push(row('结论', '❌ 返回的是 JSON，可能是 API 接口', 'err'));
        lines.push(row('建议', '这是 API 接口，不是视频源。需要从 JSON 里提取真正的 m3u8 地址'));
      } else if (probe.type === 'network-error') {
        lines.push(row('结论', '❌ 网络请求失败', 'err'));
        lines.push(row('建议', '可能是 CORS 跨域限制，或链接已失效'));
      } else {
        lines.push(row('结论', '⚠️ 返回了未知内容', 'warn'));
      }

      // 如果本身是 M3U8，进一步解析
      if (probe.type === 'm3u8' && probe.text) {
        lines.push('');
        lines.push('<h4>M3U8 结构</h4>');
        const text = probe.text;
        lines.push(row('行数', text.split('\n').length));
        lines.push(row('是否 Master', /#EXT-X-STREAM-INF/i.test(text) ? '是' : '否'));
        lines.push(row('分片数量', (text.match(/#EXTINF/gi) || []).length));
        lines.push(row('加密方式', (text.match(/#EXT-X-KEY:METHOD=([^\s,]+)/i) || [,'NONE'])[1]));
        const keys = text.match(/#EXT-X-KEY:.*URI="([^"]+)"/gi);
        if (keys) {
          lines.push('<h4>密钥地址</h4>');
          keys.slice(0, 3).forEach((k) => {
            const m = k.match(/URI="([^"]+)"/);
            if (m) lines.push('<div class="diag-pre">' + escapeHtml(m[1]) + '</div>');
          });
        }
      }

      diagBody.innerHTML = lines.join('');
    } catch (e) {
      diagBody.innerHTML = lines.join('') + '<div class="diag-pre" style="color:var(--danger);">异常：' +
        escapeHtml(e.message || String(e)) + '</div>';
    }
  }

  function row(k, v, cls) {
    return '<div class="diag-row"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function showDiagReport(text) {
    diagBody.innerHTML = '<div class="diag-pre">' + escapeHtml(text) + '</div>';
    diagPanel.hidden = false;
  }

  diagBtn.addEventListener('click', () => { runDiagnose(); });
  diagRun.addEventListener('click', () => { runDiagnose(); });
  diagClose.addEventListener('click', () => { diagPanel.hidden = true; });
  diagCopy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(diagBody.innerText);
      toast('报告已复制');
    } catch (e) { toast('复制失败'); }
  });

  /* ================================================================
   *  VodDownloader v5 · 防替换下载
   * ================================================================ */
  const Decryptor = {
    keyCache: new Map(),
    reset() { this.keyCache.clear(); },
    async getKeyBytes(uri, signal) {
      if (this.keyCache.has(uri)) return this.keyCache.get(uri);
      const promise = (async () => {
        const buf = await SafeFetch.binary(uri, signal);
        return buf;
      })();
      this.keyCache.set(uri, promise);
      try { return await promise; }
      catch (e) { this.keyCache.delete(uri); throw e; }
    },
    hexToBytes(hex) {
      hex = String(hex).replace(/^0x/i, '').replace(/[^0-9a-f]/gi, '');
      if (hex.length % 2) hex = '0' + hex;
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      if (bytes.length === 16) return bytes;
      const p = new Uint8Array(16); p.set(bytes.slice(0, 16)); return p;
    },
    deriveIV(keyInfo, sequence) {
      if (keyInfo && keyInfo.iv) return this.hexToBytes(keyInfo.iv);
      const iv = new Uint8Array(16);
      new DataView(iv.buffer).setUint32(12, sequence >>> 0, false);
      return iv;
    },
    async aesCbcDecrypt(data, keyBytes, ivBytes) {
      if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用（需 HTTPS）');
      if (!data.length) return data;
      if (data.length % 16 !== 0) {
        const aligned = data.length - (data.length % 16);
        if (aligned === 0) throw new Error('密文长度不足以解密');
        data = data.slice(0, aligned);
      }
      let kb = keyBytes;
      if (kb.length !== 16 && kb.length !== 24 && kb.length !== 32) {
        if (kb.length > 16) kb = kb.slice(0, 16);
        else { const p = new Uint8Array(16); p.set(kb); kb = p; }
      }
      const key = await crypto.subtle.importKey('raw', kb, { name: 'AES-CBC' }, false, ['decrypt']);
      const out = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: ivBytes }, key, data);
      return new Uint8Array(out);
    },
    async aesCtrDecrypt(data, keyBytes, counterBytes) {
      if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用');
      let kb = keyBytes;
      if (kb.length !== 16 && kb.length !== 24 && kb.length !== 32) {
        if (kb.length > 16) kb = kb.slice(0, 16);
        else { const p = new Uint8Array(16); p.set(kb); kb = p; }
      }
      const key = await crypto.subtle.importKey('raw', kb, { name: 'AES-CTR' }, false, ['decrypt']);
      const out = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: counterBytes, length: 64 }, key, data);
      return new Uint8Array(out);
    },
    async decryptSegment(data, keyInfo, sequence) {
      if (!keyInfo || !keyInfo.method || keyInfo.method === 'NONE') return data;
      const method = keyInfo.method.toUpperCase();
      if (keyInfo.keyFormat && keyInfo.keyFormat !== 'identity') {
        throw new Error(`不支持 ${keyInfo.keyFormat} 加密（需 DRM）`);
      }
      if (method === 'AES-128' || method === 'AES-192' || method === 'AES-256') {
        const kb = await this.getKeyBytes(keyInfo.uri);
        const iv = this.deriveIV(keyInfo, sequence);
        return await this.aesCbcDecrypt(data, kb, iv);
      }
      if (method === 'SAMPLE-AES-CTR') {
        const kb = await this.getKeyBytes(keyInfo.uri);
        const iv = this.deriveIV(keyInfo, sequence);
        return await this.aesCtrDecrypt(data, kb, iv);
      }
      if (method === 'SAMPLE-AES') {
        const kb = await this.getKeyBytes(keyInfo.uri);
        const iv = this.deriveIV(keyInfo, sequence);
        return await this.aesCbcDecrypt(data, kb, iv);
      }
      throw new Error('未知加密方法：' + method);
    }
  };

  const M3U8Parser = {
    parse(text, baseUrl) {
      if (typeof text !== 'string') throw new Error('无效 M3U8');
      text = text.replace(/^\uFEFF/, '');
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines[0] || lines[0].indexOf('#EXTM3U') !== 0) throw new Error('缺少 #EXTM3U 头');
      const result = {
        isMaster: false, variants: [], segments: [], initSegment: null,
        totalDuration: 0, mediaSequence: 0, hasEncryption: false, encMethods: new Set()
      };
      const resolve = (u) => { try { return new URL(u, baseUrl).href; } catch (e) { return u; } };
      const parseAttrs = (line) => {
        const attrs = {};
        const re = /([A-Z0-9-]+)=("([^"]*)"|[^,]*)/gi;
        let m;
        while ((m = re.exec(line)) !== null) attrs[m[1].toUpperCase()] = m[3] !== undefined ? m[3] : m[2].trim();
        return attrs;
      };
      let currentKey = null, currentByteRange = null, pendingDur = -1, pendingInf = null;
      let seq = 0, lastByteRangeEnd = 0;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line) continue;
        if (line[0] !== '#') {
          const uri = resolve(line);
          if (pendingInf) { result.variants.push(Object.assign({ url: uri }, pendingInf)); pendingInf = null; continue; }
          if (pendingDur >= 0) {
            result.segments.push({ url: uri, duration: pendingDur, key: currentKey, sequence: seq, byteRange: currentByteRange });
            seq++; pendingDur = -1; currentByteRange = null;
          }
          continue;
        }
        if (line.indexOf('#EXT-X-MEDIA-SEQUENCE:') === 0) { result.mediaSequence = parseInt(line.split(':')[1], 10) || 0; seq = result.mediaSequence; }
        else if (line.indexOf('#EXT-X-STREAM-INF:') === 0) {
          result.isMaster = true;
          const a = parseAttrs(line);
          pendingInf = { bandwidth: parseInt(a.BANDWIDTH, 10) || 0, resolution: a.RESOLUTION || '', name: a.NAME || '' };
        } else if (line.indexOf('#EXT-X-KEY:') === 0) {
          const a = parseAttrs(line);
          const method = (a.METHOD || '').toUpperCase();
          if (!method || method === 'NONE') currentKey = null;
          else {
            currentKey = { method, uri: a.URI ? resolve(a.URI) : null, iv: a.IV || null, keyFormat: a.KEYFORMAT || 'identity' };
            result.hasEncryption = true;
            result.encMethods.add(method);
          }
        } else if (line.indexOf('#EXT-X-MAP:') === 0) {
          const a = parseAttrs(line);
          if (a.URI) result.initSegment = { url: resolve(a.URI), key: currentKey };
        } else if (line.indexOf('#EXT-X-BYTERANGE:') === 0) {
          const parts = line.split(':')[1].split('@');
          const length = parseInt(parts[0], 10);
          let offset;
          if (parts[1] !== undefined) { offset = parseInt(parts[1], 10); lastByteRangeEnd = offset + length; }
          else if (lastByteRangeEnd > 0) { offset = lastByteRangeEnd; lastByteRangeEnd = offset + length; }
          else { offset = 0; lastByteRangeEnd = length; }
          currentByteRange = { length, offset };
        } else if (line.indexOf('#EXTINF:') === 0) {
          const rest = line.substring(8);
          const ci = rest.indexOf(',');
          pendingDur = parseFloat(ci >= 0 ? rest.substring(0, ci) : rest) || 0;
          result.totalDuration += pendingDur;
        }
      }
      return result;
    }
  };

  const VodDownloader = {
    active: false, controller: null,
    stats: { startTime: 0, downloadedBytes: 0, totalBytes: 0, completedSegments: 0, totalSegments: 0, speed: 0 },
    isActive() { return this.active; },

    async resolvePlaylist(url, signal, depth) {
      depth = depth || 0;
      if (depth > 5) throw new Error('M3U8 嵌套过深');
      const { text } = await SafeFetch.text(url, signal);
      if (!looksLikeM3U8(text)) {
        throw new Error('服务器返回的不是 M3U8（可能是 HTML/JSON 或被替换）');
      }
      const playlist = M3U8Parser.parse(text, url);
      if (playlist.isMaster) {
        if (!playlist.variants.length) throw new Error('Master 无可用流');
        playlist.variants.sort((a, b) => {
          const sa = (a.resolution || '0x0').split('x').reduce((x, y) => x * parseInt(y, 10), 1) || 0;
          const sb = (b.resolution || '0x0').split('x').reduce((x, y) => x * parseInt(y, 10), 1) || 0;
          if (sb !== sa) return sb - sa;
          return (b.bandwidth || 0) - (a.bandwidth || 0);
        });
        const best = playlist.variants[0];
        this.setState('preparing', { sub: '已选流 ' + (best.resolution || best.name || '') + '，继续解析…' });
        return await this.resolvePlaylist(best.url, signal, depth + 1);
      }
      return playlist;
    },

    async downloadDirect(url, signal) {
      this.setState('downloading', { sub: '正在下载视频文件…' });
      const res = await SafeFetch.get(url, signal);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = parseInt(res.headers.get('content-length') || '0', 10);
      this.stats.totalBytes = total;
      const chunks = [], reader = res.body.getReader();
      let received = 0, lastUi = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        this.stats.downloadedBytes = received;
        const now = Date.now();
        if (now - lastUi > 180) { lastUi = now; this.updateProgressUI(); }
      }
      this.stats.downloadedBytes = received;
      this.updateProgressUI();
      this.setState('merging', { sub: '正在保存文件…' });
      const ext = (url.match(/\.(mp4|webm|mov|m4v|mkv|flv|avi|wmv|3gp)(\?|#|$)/i) || [, 'mp4'])[1];
      const filename = this.guessFilename(url, ext);
      const size = this.saveBlob(chunks, filename, 'video/' + ext);
      this.setState('done', { sub: '已保存 · ' + fmtBytes(size) });
      toast('下载完成 · ' + fmtBytes(size));
    },

    async downloadM3U8(url, signal) {
      const playlist = await this.resolvePlaylist(url, signal);
      if (!playlist.segments.length) throw new Error('未找到视频片段');
      const methods = new Set();
      if (playlist.initSegment && playlist.initSegment.key) methods.add(playlist.initSegment.key.method);
      playlist.segments.forEach((s) => { if (s.key) methods.add(s.key.method); });
      if (methods.has('SAMPLE-AES')) throw new Error('SAMPLE-AES 需专用解密器');

      const encLabel = playlist.hasEncryption ? Array.from(playlist.encMethods).join('+') : '未加密';
      const isFMP4 = !!playlist.initSegment;
      const ext = isFMP4 ? 'mp4' : 'ts';
      const mime = isFMP4 ? 'video/mp4' : 'video/mp2t';
      const total = playlist.segments.length;
      this.stats.totalSegments = total + (playlist.initSegment ? 1 : 0);
      this.setState('downloading', { sub: `共 ${total} 段 · ${encLabel}` });

      const chunks = new Array(total);
      const concurrency = Math.min(12, Math.max(4, ENV.cores || 4));
      let nextIndex = 0, completed = 0, lastUi = 0;
      const self = this;

      const worker = async () => {
        while (true) {
          if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
          const idx = nextIndex++;
          if (idx >= total) return;
          const seg = playlist.segments[idx];
          let attempts = 0, lastErr;
          while (attempts < 3) {
            try {
              let data = await SafeFetch.binary(seg.url, signal, seg.byteRange);
              if (seg.key && seg.key.method && seg.key.method !== 'NONE') {
                data = await Decryptor.decryptSegment(data, seg.key, seg.sequence);
              }
              chunks[idx] = data;
              lastErr = null;
              break;
            } catch (err) {
              lastErr = err; attempts++;
              if (attempts >= 3 || signal.aborted) throw err;
              await new Promise((r) => setTimeout(r, 300 * attempts));
            }
          }
          if (lastErr) throw lastErr;
          completed++;
          self.stats.completedSegments = completed;
          self.stats.downloadedBytes += chunks[idx].byteLength;
          const now = Date.now();
          if (now - lastUi > 180) {
            lastUi = now;
            self.updateProgressUI();
            dlSub.textContent = `共 ${total} 段 · ${encLabel} · 已完成 ${completed}/${total}`;
          }
        }
      };
      const workers = [];
      for (let i = 0; i < concurrency; i++) workers.push(worker());
      await Promise.all(workers);
      self.updateProgressUI();

      let initData = null;
      if (playlist.initSegment) {
        this.setState('merging', { sub: '处理初始化段…' });
        initData = await SafeFetch.binary(playlist.initSegment.url, signal, null);
        if (playlist.initSegment.key && playlist.initSegment.key.method !== 'NONE') {
          initData = await Decryptor.decryptSegment(initData, playlist.initSegment.key, 0);
        }
      }

      this.setState('merging', { sub: `合并 ${this.stats.totalSegments} 个分片…` });
      dlBar.classList.add('indeterminate');

      const parts = [];
      if (initData) parts.push(initData);
      for (let i = 0; i < total; i++) if (chunks[i]) parts.push(chunks[i]);

      const filename = self.guessFilename(url, ext);
      const size = self.saveBlob(parts, filename, mime);
      this.setState('done', { sub: `已保存 · ${fmtBytes(size)} · ${filename}` });
      toast('下载完成 · ' + fmtBytes(size));
    },

    saveBlob(parts, filename, mimeType) {
      const blob = new Blob(parts, { type: mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      return blob.size;
    },

    guessFilename(url, ext) {
      try {
        const u = new URL(url);
        let name = decodeURIComponent((u.pathname.split('/').pop() || 'video').split('?')[0]);
        const dot = name.lastIndexOf('.');
        if (dot > 0) name = name.substring(0, dot);
        name = name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || 'video';
        return name + '_' + Date.now() + '.' + ext;
      } catch (e) { return 'vodcore_' + Date.now() + '.' + ext; }
    },

    setWarn(msg) {
      if (msg) { dlWarn.innerHTML = msg; dlWarn.classList.add('show'); }
      else dlWarn.classList.remove('show');
    },

    setState(state, info) {
      info = info || {};
      if (state === 'idle') {
        dlCard.classList.remove('active');
        dlProgress.hidden = true;
        dlStartBtn.disabled = false;
        dlStartBtn.textContent = '开始下载';
        dlSub.textContent = info.sub || 'M3U8 · AES-128/192/256 · fMP4 · 直链 · 全程 no-referrer';
      } else if (state === 'preparing') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlStartBtn.disabled = true;
        dlStartBtn.textContent = '准备中';
        dlBar.classList.add('indeterminate');
        dlBar.style.width = '';
        dlPercent.textContent = '0%'; dlSpeed.textContent = '--'; dlRemain.textContent = '--'; dlSize.textContent = '--';
        dlCancelBtn.disabled = false; dlCancelBtn.textContent = '取消下载';
        dlSub.textContent = info.sub || '正在解析…';
      } else if (state === 'downloading') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlStartBtn.disabled = true; dlStartBtn.textContent = '下载中';
        dlBar.classList.remove('indeterminate');
        dlCancelBtn.disabled = false;
        dlSub.textContent = info.sub || '正在下载…';
      } else if (state === 'merging') {
        dlCard.classList.add('active');
        dlProgress.hidden = false;
        dlBar.classList.add('indeterminate');
        dlStartBtn.disabled = true; dlStartBtn.textContent = '合并中';
        dlCancelBtn.disabled = true;
        dlSub.textContent = info.sub || '正在合并…';
      } else if (state === 'done') {
        dlCard.classList.remove('active');
        dlStartBtn.disabled = false; dlStartBtn.textContent = '重新下载';
        dlBar.classList.remove('indeterminate');
        dlBar.style.width = '100%';
        dlPercent.textContent = '100%';
        dlCancelBtn.disabled = true; dlCancelBtn.textContent = '已完成';
        dlSub.textContent = info.sub || '已保存';
      } else if (state === 'error') {
        dlCard.classList.remove('active');
        dlStartBtn.disabled = false; dlStartBtn.textContent = '重试';
        dlBar.classList.remove('indeterminate');
        dlCancelBtn.disabled = true;
        dlSub.textContent = '下载失败';
      } else if (state === 'canceled') {
        dlCard.classList.remove('active');
        dlProgress.hidden = true;
        dlStartBtn.disabled = false; dlStartBtn.textContent = '重新下载';
        dlSub.textContent = '已取消';
      }
    },

    updateProgressUI() {
      const s = this.stats;
      const elapsed = (Date.now() - s.startTime) / 1000;
      const speed = elapsed > 0 ? s.downloadedBytes / elapsed : 0;
      s.speed = speed;
      let pct;
      if (s.totalSegments > 0) pct = s.completedSegments / s.totalSegments;
      else if (s.totalBytes > 0) pct = s.downloadedBytes / s.totalBytes;
      else pct = 0;
      dlBar.style.width = (pct * 100).toFixed(1) + '%';
      dlPercent.textContent = (pct * 100).toFixed(1) + '%';
      dlSpeed.textContent = fmtSpeed(speed);
      dlSize.textContent = fmtBytes(s.downloadedBytes);
      if (speed > 0 && s.totalSegments > 0 && s.completedSegments > 0) {
        const avg = s.downloadedBytes / s.completedSegments;
        dlRemain.textContent = fmtRemain((s.totalSegments - s.completedSegments) * avg / speed);
      } else if (speed > 0 && s.totalBytes > 0) {
        dlRemain.textContent = fmtRemain((s.totalBytes - s.downloadedBytes) / speed);
      } else dlRemain.textContent = '--';
    },

    async start(url) {
      if (this.active) { toast('已有下载任务'); return; }
      if (!url) { toast('请先输入链接'); return; }
      if (!ENV.webCryptoOk) this.setWarn('⚠️ 当前环境不支持 WebCrypto（需 HTTPS），加密流将无法解密。');
      else this.setWarn('');
      this.active = true;
      this.controller = new AbortController();
      this.stats = { startTime: Date.now(), downloadedBytes: 0, totalBytes: 0, completedSegments: 0, totalSegments: 0, speed: 0 };
      Decryptor.reset();
      this.setState('preparing', { sub: '正在解析…' });
      const signal = this.controller.signal;
      try {
        if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
          await this.downloadDirect(url, signal);
        } else {
          await this.downloadM3U8(url, signal);
        }
      } catch (err) {
        if (signal.aborted || err.name === 'AbortError') {
          this.setState('canceled'); toast('已取消下载');
        } else {
          console.error('[VodDownloader]', err);
          this.setState('error');
          const msg = err.message || '未知错误';
          let hint = '⚠️ ' + msg;
          if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
            hint = '⚠️ 网络请求被阻止，目标服务器可能未开启 CORS。<br>请确认链接可直接访问，或换用支持跨域的源。';
          } else if (/不是 M3U8|HTML|JSON/i.test(msg)) {
            hint = '⚠️ ' + msg + '<br>你复制的可能不是视频源地址，请用「诊断」查看实际返回内容。';
          } else if (/WebCrypto/i.test(msg)) {
            hint = '⚠️ ' + msg + '<br>请使用 HTTPS 部署。';
          }
          this.setWarn(hint);
          toast('下载失败：' + msg);
        }
      } finally {
        this.active = false;
        this.controller = null;
      }
    },

    cancel() {
      if (this.controller) {
        try { this.controller.abort(); } catch (e) {}
        toast('正在取消…');
      }
    },

    reset() {
      this.setWarn('');
      this.setState('idle');
      dlProgress.hidden = true;
      dlStartBtn.disabled = false;
      dlStartBtn.textContent = '开始下载';
      dlSub.textContent = 'M3U8 · AES-128/192/256 · fMP4 · 直链 · 全程 no-referrer';
    }
  };

  dlStartBtn.addEventListener('click', () => {
    if (VodDownloader.isActive()) { toast('已有下载任务'); return; }
    const url = currentUrl || urlInput.value.trim();
    if (!url) { toast('请先输入链接'); return; }
    VodDownloader.start(url);
  });
  dlCancelBtn.addEventListener('click', () => { if (VodDownloader.isActive()) VodDownloader.cancel(); });

  const _origLoad = VodCore.load.bind(VodCore);
  VodCore.load = async function (url, resumeAt) {
    VodDownloader.reset();
    return _origLoad(url, resumeAt);
  };

  /* ================= 初始化 ================= */
  syncPlayIcon(); renderMarks(); updateDecoderBtn(); updateFsIcon(); showControls();
  VodCore.setStatus('内核就绪', true);

  let lastUrl = '';
  try { lastUrl = localStorage.getItem('vodcore_last_url') || ''; } catch (e) {}
  if (lastUrl) urlInput.value = lastUrl;
