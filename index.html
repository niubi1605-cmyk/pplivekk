<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d15">
<meta name="referrer" content="no-referrer">
<title>VodCore 2 · M3U8 智能解密播放器</title>
<style>
:root{
  --bg:#080a11; --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
  --tx:#e9edf7; --mu:#8b93a7; --mu2:#5d6478;
  --b1:#5b8cff; --b2:#8b5cf6; --ok:#34d399; --wn:#fbbf24; --er:#f87171; --cy:#22d3ee;
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#080a11;color:var(--tx);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 15% -8%,rgba(91,140,255,.16),transparent 62%),
    radial-gradient(760px 380px at 92% 4%,rgba(139,92,246,.14),transparent 60%),
    radial-gradient(600px 300px at 50% 106%,rgba(34,211,238,.07),transparent 65%);}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ===== 头部 ===== */
.hd{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.logo{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--b1),var(--b2));box-shadow:0 6px 18px rgba(91,140,255,.32)}
.logo svg{width:19px;height:19px;color:#fff}
.tt{font-weight:800;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.tt em{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--b1),var(--b2));
  padding:2px 6px;border-radius:6px;letter-spacing:0}
.sub{font-size:11px;color:var(--mu);margin-top:1px}
.chip{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mu);
  white-space:nowrap;transition:color .2s,border-color .2s}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--mu);flex:none;transition:background .2s,box-shadow .2s}
.chip.ok{color:var(--ok);border-color:rgba(52,211,153,.3)} .chip.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.run{color:var(--cy);border-color:rgba(34,211,238,.3)} .chip.run i{background:var(--cy);box-shadow:0 0 8px var(--cy);animation:pulse 1.1s infinite}
.chip.wn{color:var(--wn);border-color:rgba(251,191,36,.32)} .chip.wn i{background:var(--wn);box-shadow:0 0 8px var(--wn)}
.chip.er{color:var(--er);border-color:rgba(248,113,113,.32)} .chip.er i{background:var(--er);box-shadow:0 0 8px var(--er)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== URL 栏 ===== */
.bar{display:flex;gap:8px;padding:9px}
.bar .in{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:var(--r2);padding:0 12px;height:44px;transition:border-color .18s}
.bar .in:focus-within{border-color:rgba(91,140,255,.6);box-shadow:0 0 0 3px rgba(91,140,255,.1)}
.bar .in svg{width:15px;height:15px;color:var(--mu2);flex:none}
.bar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit;height:100%}
.bar input::placeholder{color:var(--mu2)}
.go{flex:none;border:none;border-radius:var(--r2);padding:0 20px;height:44px;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--b1),var(--b2));cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(91,140,255,.28);transition:transform .12s,opacity .2s;display:flex;align-items:center;gap:6px}
.go:active{transform:scale(.96)}
.go[disabled]{opacity:.55}
.go svg{width:15px;height:15px}
.recents{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.recents button{font-size:11px;color:var(--mu);background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px;cursor:pointer;font-family:inherit;max-width:180px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.recents button:active{background:var(--card2)}

/* ===== 播放器 ===== */
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);
  overflow:hidden;border:1px solid var(--line);isolation:isolate;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.player:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none}
.player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none}
.player video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .22s;
  background:radial-gradient(60% 60% at 50% 50%,rgba(0,0,0,.32),transparent)}
.mask.show{opacity:1}
.mask .mi{width:60px;height:60px;border-radius:50%;background:rgba(10,14,22,.55);border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(0,0,0,.5)}
.mask svg{width:26px;height:26px;color:#fff;margin-left:2px}
.spin{position:absolute;inset:0;display:grid;place-items:center;z-index:6;opacity:0;pointer-events:none;transition:opacity .18s}
.spin.show{opacity:1}
.spin::after{content:"";width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.16);
  border-top-color:var(--b1);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.badge{position:absolute;top:10px;left:10px;z-index:7;display:flex;align-items:center;gap:6px;
  background:rgba(8,10,17,.72);border:1px solid rgba(255,255,255,.09);border-radius:99px;padding:4px 11px;
  font-size:10.5px;font-weight:700;backdrop-filter:blur(10px);pointer-events:none;opacity:0;
  transform:translateY(-6px);transition:opacity .25s,transform .25s;max-width:72%;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.badge.show{opacity:1;transform:none}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);flex:none}
.badge i.wn{background:var(--wn);box-shadow:0 0 7px var(--wn)}
.badge i.er{background:var(--er);box-shadow:0 0 7px var(--er)}
.badge i.cy{background:var(--cy);box-shadow:0 0 7px var(--cy)}

/* 控制栏 */
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:30px 10px 7px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.86));
  transition:opacity .24s;user-select:none;-webkit-user-select:none}
.ctrl.hide{opacity:0;pointer-events:none}
.pg{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pg .tk{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:99px;background:rgba(255,255,255,.18);
  transition:height .16s,margin-top .16s}
.pg:hover .tk,.pg.drag .tk{height:5px;margin-top:-2.5px}
.pbf{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;border-radius:99px;background:rgba(255,255,255,.3);
  width:0;transform-origin:0 50%;will-change:transform}
.ppl{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;border-radius:99px;width:100%;
  background:linear-gradient(90deg,var(--b1),var(--b2));transform:scaleX(0);transform-origin:0 50%;
  will-change:transform;box-shadow:0 0 10px rgba(91,140,255,.5);transition:height .16s,margin-top .16s}
.pg:hover .ppl,.pg.drag .ppl{height:5px;margin-top:-2.5px}
.pth{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;
  transform:translateX(0) scale(.6);opacity:0;transition:opacity .16s,transform .16s;will-change:transform;
  box-shadow:0 0 0 3px rgba(91,140,255,.35)}
.pg:hover .pth,.pg.drag .pth{opacity:1;transform:translateX(var(--x,0px)) scale(1)}
.pmk{position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;pointer-events:none}
.pmk i{position:absolute;top:0;width:2px;height:14px;border-radius:2px;background:var(--wn);
  box-shadow:0 0 6px rgba(251,191,36,.85);transform:translateX(-1px)}
.crow{display:flex;align-items:center;gap:2px;margin-top:2px}
.ib{background:none;border:none;color:#fff;cursor:pointer;width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;flex:none;padding:0;transition:background .15s}
.ib:hover{background:rgba(255,255,255,.12)} .ib:active{background:rgba(255,255,255,.2)}
.ib svg{width:19px;height:19px;pointer-events:none}
.tm{font-variant-numeric:tabular-nums;font-size:11.5px;color:rgba(255,255,255,.88);margin:0 6px;white-space:nowrap;pointer-events:none}
.lv{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:9px;padding:6px 9px;font-size:11.5px;
  font-weight:800;cursor:pointer;outline:none;font-family:inherit;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv option{background:#121724;color:#fff}
.spd{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:9px;
  padding:6px 8px;font-size:11.5px;font-weight:800;cursor:pointer;outline:none;font-family:inherit;font-variant-numeric:tabular-nums}
.spd option{background:#121724;color:#fff}
.grow{flex:1}

/* ===== 引擎状态条 ===== */
.eng{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;overflow:hidden}
.eng .e{background:rgba(0,0,0,.2);padding:9px 6px;text-align:center;min-width:0}
.eng .e b{display:block;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eng .e span{display:block;font-size:10px;color:var(--mu2);margin-top:2px}
.eng .e b.ok{color:var(--ok)} .eng .e b.wn{color:var(--wn)} .eng .e b.er{color:var(--er)} .eng .e b.cy{color:var(--cy)}
@media(max-width:420px){.eng{grid-template-columns:repeat(2,1fr)}}

/* ===== 工具 ===== */
.tools{display:flex;gap:7px;flex-wrap:wrap;padding:9px}
.tb{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .1s,background .15s;white-space:nowrap}
.tb:active{transform:scale(.95)} .tb:hover{background:var(--card2)}
.tb svg{width:15px;height:15px;flex:none;pointer-events:none}
.tb.gold{color:var(--wn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.tb.blue{color:#9db8ff;border-color:rgba(91,140,255,.32);background:rgba(91,140,255,.08)}
.tb.on{background:rgba(91,140,255,.16);border-color:rgba(91,140,255,.45);color:#b9cbff}
.sbox{flex:1;min-width:130px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.24);
  border:1px solid var(--line);border-radius:11px;padding:0 11px;height:38px}
.sbox:focus-within{border-color:rgba(91,140,255,.55)}
.sbox svg{width:14px;height:14px;color:var(--mu2);flex:none}
.sbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--tx);font-size:13px;height:100%;font-family:inherit}

/* ===== 解密控制台 ===== */
.dec{padding:11px 12px}
.dh{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.dh b{font-size:12.5px;font-weight:800}
.dh .hint{font-size:10.5px;color:var(--mu2)}
.dh .ar{margin-left:auto;color:var(--mu2);transition:transform .2s}
.dh.open .ar{transform:rotate(180deg)}
.dbody{margin-top:9px;display:none}
.dbody.open{display:block}
.kv{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:11.5px}
.kv .k{color:var(--mu2);flex:none;min-width:74px}
.kv .v{flex:1;min-width:0;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.kv .v.ok{color:var(--ok)} .kv .v.wn{color:var(--wn)} .kv .v.er{color:var(--er)}
.tips{font-size:11px;color:var(--mu);line-height:1.6;margin-top:8px;padding:8px 10px;border-radius:10px;
  background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);color:#e2c98a;display:none}
.tips.show{display:block}

/* ===== 标记 ===== */
.ml{display:flex;flex-direction:column;gap:6px;padding:9px}
.mk{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:rgba(0,0,0,.2);
  border:1px solid var(--line);cursor:pointer;user-select:none;touch-action:manipulation}
.mk:hover{background:var(--card2)}
.mk .dt{width:7px;height:7px;border-radius:50%;background:var(--wn);box-shadow:0 0 7px rgba(251,191,36,.7);flex:none}
.mk .mt{font-size:12px;font-weight:800;color:var(--wn);background:rgba(251,191,36,.12);border-radius:6px;padding:2px 7px;flex:none;font-variant-numeric:tabular-nums}
.mk .mn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.mk .md{width:30px;height:30px;border:none;border-radius:8px;background:none;color:var(--mu2);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.mk .md:hover{background:rgba(248,113,113,.14);color:var(--er)}
.mk .md svg{width:14px;height:14px;pointer-events:none}
.empty{text-align:center;color:var(--mu2);font-size:12px;padding:16px;border:1px dashed var(--line);border-radius:11px;margin:0 9px 9px}

/* ===== 下载 ===== */
.dl{padding:12px;display:flex;flex-direction:column;gap:10px}
.dlh{display:flex;align-items:center;gap:11px}
.dli{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:#9db8ff;
  background:linear-gradient(140deg,rgba(91,140,255,.2),rgba(139,92,246,.14));border:1px solid rgba(91,140,255,.26)}
.dli svg{width:19px;height:19px}
.dln{flex:1;min-width:0}
.dlt{font-size:13.5px;font-weight:800}
.dls{font-size:11px;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn{border:none;border-radius:11px;padding:11px 18px;font-size:13px;font-weight:800;color:#fff;flex:none;
  background:linear-gradient(135deg,var(--b1),var(--b2));cursor:pointer;font-family:inherit;transition:transform .1s;
  box-shadow:0 6px 16px rgba(91,140,255,.24)}
.gbtn:active{transform:scale(.96)} .gbtn[disabled]{opacity:.5;cursor:not-allowed}
.dlp{display:flex;flex-direction:column;gap:8px}
.bw{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bb{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--b1),var(--b2));
  box-shadow:0 0 10px rgba(91,140,255,.5);transition:width .2s}
.bb.ind{width:34%!important;animation:sld 1.3s infinite}
@keyframes sld{0%{left:-34%}100%{left:100%}}
.dst{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.dst b{color:var(--tx);font-weight:700}
.warn{font-size:11.5px;color:#e2c98a;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);
  border-radius:10px;padding:9px 11px;line-height:1.6;display:none}
.warn.show{display:block}
.dacts{display:flex;gap:7px;justify-content:flex-end}
.sbtn{background:none;border:1px solid var(--line);color:var(--tx);padding:7px 12px;border-radius:9px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn.dg{border-color:rgba(248,113,113,.34);color:var(--er)}

/* ===== 菜单 ===== */
.menu{position:fixed;z-index:999;background:#111621;border:1px solid var(--line2);border-radius:13px;padding:5px;
  box-shadow:0 16px 40px rgba(0,0,0,.7);min-width:150px;max-height:70vh;overflow-y:auto;overscroll-behavior:contain}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--tx);font-size:13px;
  padding:9px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:background .12s}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.d{color:var(--er)}
.dect{min-width:250px;max-width:92vw}
.dtt{font-size:10.5px;font-weight:800;color:var(--mu2);padding:7px 11px 5px;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;gap:6px}
.dtt .bg{font-size:9.5px;color:#9db8ff;background:rgba(91,140,255,.14);padding:2px 6px;border-radius:5px;letter-spacing:0}
.dit{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 11px!important}
.dit .n{font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center}
.dit .d{font-size:10.5px;color:var(--mu)}
.dit.act{background:rgba(91,140,255,.13)} .dit.act .n{color:#9db8ff}
.dit[disabled]{opacity:.35;cursor:not-allowed}
.sep{height:1px;background:var(--line);margin:4px 7px}

/* ===== 诊断 ===== */
.diag{position:fixed;left:8px;right:8px;bottom:8px;max-height:74vh;background:#0b0e17;border:1px solid var(--line2);
  border-radius:var(--r);z-index:1001;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.8)}
.diag[hidden]{display:none}
.dgh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.dgh b{font-size:13px;color:#c3cad9;font-weight:800}
.dgc{background:none;border:none;color:var(--mu);font-size:21px;cursor:pointer;line-height:1;padding:0 4px}
.dgb{padding:12px 14px;overflow-y:auto;font-size:11.5px;line-height:1.62;font-family:ui-monospace,Menlo,Consolas,monospace}
.dgb h4{margin:12px 0 5px;font-size:10.5px;color:#a78bfa;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.dgb h4:first-child{margin-top:0}
.dr{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:11.5px}
.dr .k{color:var(--mu2);flex:none;min-width:98px}
.dr .v{flex:1;min-width:0;word-break:break-all}
.dr .v.ok{color:var(--ok)} .dr .v.er{color:var(--er)} .dr .v.wn{color:var(--wn)}
.dpre{background:#070a11;border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:8px;max-height:150px;
  overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:10.5px;color:#8f99ad;margin-top:5px}
.dgf{padding:0 13px 13px;display:flex;gap:7px}
.dgb2{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--tx);
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.dgb2.pri{background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent;color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:rgba(17,22,33,.97);
  border:1px solid var(--line2);color:var(--tx);padding:10px 18px;border-radius:99px;font-size:12.5px;opacity:0;
  pointer-events:none;transition:opacity .22s,transform .22s;z-index:1002;max-width:84vw;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <header class="hd">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/>
      </svg>

/* =====================================================================
 * 播放主流程
 * ===================================================================== */
async function loadStream(url, at) {
  url = (url || '').trim();
  if (!url) { toast('请先粘贴链接'); return; }
  if (ST.loading) return;
  ST.loading = true;
  ST.url = url;
  ST.marks = (markStore[url] || []).slice();
  renderMarks();
  hideTip();
  destroyHls();
  ST.retry = 0; ST.warned = false; ST.badProbe = false; ST.fragMap.clear(); ST.keyUrls.clear(); keyByteCache.clear();
  ST.probe = null; ST.pl = null; ST.selfDecrypt = false;
  Guard.reset();
  setEng('eEnc', '—', ''); setEng('eKey', '—', ''); setEng('eIv', '—', '');

  ST.has = true;
  try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
  setSpin(true); setChip('解析中', 'run');
  goBtn.disabled = true;

  var decKey = resolveDec(ST.dec);
  var dec = DECS[decKey] || DECS.compat;
  ST.selfDecrypt = !!dec.self;

  var isDirect = /\.(mp4|webm|ogg|ogv|mov|m4v|mkv|flv|avi|wmv|3gp)(\?|#|$)/i.test(url);
  if (isDirect) {
    nativePlay(url, at);
    ST.loading = false; goBtn.disabled = false;
    return;
  }
  // 先把内核拉起来，避免首播因 CDN 未就绪而误判为"只能用原生"
  var okHls = !!dec.native || !ENV.mse ? false : await ensureHls();

  // ---- 1. 抓 playlist ----
  var pr = await NetGate.tryPolicies(url, { as: 'text', timeout: 15000 }, function (r) {
    return r.ok && r.text && /^\s*#EXTM3U/i.test(r.text);
  });
  if (!pr || !pr.ok || !pr.text) {
    setSpin(false); setChip('取源失败', 'er'); goBtn.disabled = false; ST.loading = false;
    setBadge('⚠ 无法获取播放列表', 'er');
    toast('取源失败：' + ((pr && pr.err) || 'HTTP ' + (pr && pr.status) || '网络错误'));
    pushDiag({ probe: pr, url: url });
    return;
  }
  if (!/^\s*#EXTM3U/i.test(pr.text)) {
    setSpin(false); setChip('不是 M3U8', 'er'); goBtn.disabled = false; ST.loading = false;
    setBadge('⚠ 返回的不是播放列表', 'er');
    toast('服务器返回了网页/其它内容，请确认是 .m3u8 源地址');
    pushDiag({ probe: pr, url: url });
    return;
  }
  if (pr.redirected && pr.url !== url) {
    setBadge('↪ 链接已重定向，已按最终地址修正', 'wn');
  }
  NetGate.policy = pr.referrer || NetGate.policy;

  // ---- 2. 解析（含 master 选流） ----
  var base = pr.url || url;
  var txt = absolutizeM3U8(pr.text, base);
  var pl = parseM3U8(txt, base);
  if (pl.isMaster) {
    if (!pl.variants.length) { setSpin(false); setChip('无可用流', 'er'); goBtn.disabled = false; ST.loading = false; return; }
    pl.variants.sort(function (a, b) {
      var sa = (a.res || '0x0').split('x').reduce(function (x, y) { return x * (parseInt(y, 10) || 0); }, 1) || 0;
      var sb = (b.res || '0x0').split('x').reduce(function (x, y) { return x * (parseInt(y, 10) || 0); }, 1) || 0;
      if (sb !== sa) return sb - sa;
      return (b.bw || 0) - (a.bw || 0);
    });
    ST.levels = pl.variants;
    var vr = pl.variants[0];
    var pr2 = await NetGate.get(vr.url, { as: 'text', timeout: 15000 });
    if (pr2.ok && /#EXTM3U/i.test(pr2.text || '')) {
      txt = absolutizeM3U8(pr2.text, pr2.url || vr.url);
      pl = parseM3U8(txt, pr2.url || vr.url);
      base = pr2.url || vr.url;
    }
  }
  ST.pl = pl;

  // ---- 3. 解密探针（内容一致性预判） ----
  setChip('解密探测', 'run');
  var probe = null;
  try {
    probe = await Promise.race([
      KeyLab.probe(pl),
      sleep(12000).then(function () { return null; })
    ]);
  } catch (e) { probe = null; }
  ST.probe = probe;
  // 探针没通过 → 自动换 Referer 策略重试（很多站点按来源返回不同内容/不同密钥）

    var pi = NetGate.order.indexOf(NetGate.policy);

    NetGate.policy = NetGate.order[pi + 1];
    guardTries++;
    setChip('换源策略 ' + guardTries, 'run');
    try {
      probe = await Promise.race([KeyLab.probe(pl), sleep(10000).then(function () { return null; })]);
    } catch (e) { probe = null; }
    ST.probe = probe;
  }
  renderConsole(pl, probe);
  if (probe) {
    if (probe.ok) {
      setEng('eGd', '探针通过', 'ok');
      if (probe.strip) toast('检测到分片前缀异常，已自动对齐 +' + probe.strip + ' 字节');
    } else if (probe.err) {
      setEng('eGd', '探针异常', 'wn');
      setBadge('⚠ ' + probe.err.slice(0, 30), 'wn');
      ST.badProbe = true;
    }
  }

  // ---- 4. 起播 ----
  if (!okHls) okHls = await ensureHls();
  var useNative = !!dec.native || !ENV.mse || !okHls;
  if (useNative && ENV.nativeHls) { nativePlay(url, at); ST.loading = false; goBtn.disabled = false; return; }
  if (!okHls && ENV.nativeHls) { nativePlay(url, at); ST.loading = false; goBtn.disabled = false; return; }
  if (!okHls) {
    setSpin(false); setChip('内核缺失', 'er'); goBtn.disabled = false; ST.loading = false;
    toast('HLS 内核加载失败，请检查网络后重试');
    return;
  }

  ST.loading = false; goBtn.disabled = false;
}
function reloadKeep() {
  var t = isFinite(video.currentTime) ? video.currentTime : 0;

  out.push(drow('MSE / HLS.js', (ENV.mse ? '支持' : '不支持') + ' · ' + (window.Hls ? '已载入' : '未载入'), ENV.mse ? 'ok' : 'wn'));
  out.push(drow('WebCrypto', ENV.crypto ? '可用' : '不可用（需 HTTPS）', ENV.crypto ? 'ok' : 'er'));
  out.push(drow('原生 HLS', ENV.nativeHls ? '可用' : '不可用', ''));
  out.push(drow('设备', ENV.cores + ' 核 · ' + ENV.mem + 'GB' + (ENV.low ? ' · 低端' : ''), ''));

  out.push('<h4>链接探测</h4>');
  out.push(drow('URL', esc(url), ''));
  var pr = await NetGate.get(url, { as: 'text', timeout: 15000 });
  if (!pr.ok) { out.push(drow('结果', '❌ HTTP ' + (pr.status || '失败') + ' ' + (pr.err || ''), 'er')); dgb.innerHTML = out.join(''); return; }
  out.push(drow('HTTP 状态', String(pr.status), pr.status === 200 ? 'ok' : 'wn'));
  out.push(drow('Content-Type', esc(pr.type || '—'), ''));
  out.push(drow('重定向', pr.redirected ? ('是 → ' + esc(pr.url)) : '否', pr.redirected ? 'wn' : 'ok'));
  var isM = /^\s*#EXTM3U/i.test(pr.text || '');
  out.push(drow('是否 M3U8', isM ? '✅ 是' : '❌ 否', isM ? 'ok' : 'er'));
  if (!isM) {
    out.push('<h4>内容预览</h4><div class="dpre">' + esc((pr.text || '').slice(0, 400)) + '</div>');
    out.push('<h4>判定</h4>' + drow('结论', '❌ 不是播放列表。你复制的可能是播放页地址，请在 F12 → Network 里找 .m3u8 请求。', 'er'));
    dgb.innerHTML = out.join(''); return;
  }

  var base = pr.url || url;
  var pl = parseM3U8(absolutizeM3U8(pr.text, base), base);
  out.push(drow('列表类型', pl.isMaster ? 'Master（多码率）' : 'Media（' + pl.segs.length + ' 段）', ''));
  out.push(drow('时长', fmtT(pl.segs.reduce(function (a, s) { return a + (s.dur || 0); }, 0)), ''));
  if (pl.isMaster) {
    out.push('<h4>可用码率</h4>');
    pl.variants.forEach(function (v, i) { out.push(drow('#' + i, (v.res || '—') + ' · ' + Math.round(v.bw / 1000) + 'kbps', '')); });
  }
  out.push('<h4>加密</h4>');
  if (!pl.enc) out.push(drow('加密方式', '未加密', 'ok'));
  else {
    out.push(drow('加密方式', esc(pl.enc.method), 'wn'));
    out.push(drow('KEYFORMAT', esc(pl.enc.kf || 'identity'), pl.enc.kf === 'identity' ? 'ok' : 'er'));
    out.push(drow('密钥地址', esc(pl.enc.uri || '—'), ''));
    var kg = await NetGate.get(pl.enc.uri, { as: 'bin', timeout: 12000 });
    out.push(drow('密钥请求', kg.ok ? ('HTTP ' + kg.status) : ('❌ ' + (kg.status || kg.err)), kg.ok ? 'ok' : 'er'));
    if (kg.ok) {
      out.push(drow('密钥长度', kg.bin.length + ' 字节', (kg.bin.length === 16 || kg.bin.length === 32) ? 'ok' : 'wn'));
      out.push(drow('密钥内容', esc(hex(kg.bin, 32)), ''));
      var txt = null; try { txt = new TextDecoder().decode(kg.bin); } catch (e) {}
      if (txt && txt.length < 200) out.push(drow('文本形态', esc(txt.trim().slice(0, 80)), 'wn'));
    }
    out.push(drow('IV 属性', esc(pl.enc.iv || '(无 → 用序列号)'), ''));
  }
  out.push('<h4>分片探针</h4>');
  if (pl.segs.length) {
    var sg = pl.segs[0];
    out.push(drow('首个分片', esc(sg.url.slice(0, 90)), ''));
    var g = await NetGate.get(sg.url, { as: 'bin', range: sg.range, timeout: 15000 });
    out.push(drow('分片请求', g.ok ? ('HTTP ' + g.status + ' · ' + fmtB(g.len)) : ('❌ ' + (g.status || g.err)), g.ok ? 'ok' : 'er'));
    out.push(drow('分片类型', esc(g.type || '—'), looksHtml(g) ? 'er' : 'ok'));
    if (g.ok && g.bin) {
      out.push(drow('密文头部', esc(hex(g.bin, 16)), ''));
      if (pl.enc && pl.enc.method !== 'NONE' && ENV.crypto) {
        try {
          var kg2 = await NetGate.get(pl.enc.uri, { as: 'bin', timeout: 12000 });
          var cands = KeyLab.keyCandidates(kg2.bin);
          var ivs = KeyLab.ivCandidates(pl.enc, sg.seq);
          var hit = null, tried = [];
          var pd = g.bin.subarray(0, Math.min(g.bin.length, 188 * 4) - (Math.min(g.bin.length, 188 * 4) % 16));
          for (var ci = 0; ci < cands.length && !hit; ci++) {
            for (var ii = 0; ii < ivs.length && !hit; ii++) {
              try {
                var dd = await KeyLab.decrypt(pd, cands[ci].bytes, ivs[ii].iv, pl.enc.method);
                var vv = KeyLab.verify(dd);
                tried.push((vv.ok ? '✅' : '❌') + cands[ci].mode + '/' + ivs[ii].mode);
                if (vv.ok) hit = { d: dd, v: vv, mode: cands[ci].mode, iv: ivs[ii].mode };
              } catch (e) { tried.push('❌' + cands[ci].mode + '/' + ivs[ii].mode); }
            }
          }
          if (hit) {
            out.push(drow('还原头部', esc(hex(hit.d, 16)), 'ok'));
            out.push(drow('校验结果', '✅ 通过（' + hit.v.kind + '）· 密钥 ' + hit.mode + ' / IV ' + hit.iv, 'ok'));
          } else {
            out.push(drow('校验结果', '❌ 全部组合失败：' + esc(tried.join(' ')), 'er'));
            out.push(drow('判定', '密钥或分片被防盗链拦截 → 播放内容与源站不一致', 'er'));
          }
        } catch (e) { out.push(drow('试解异常', esc(e.message || ''), 'er')); }
      } else if (g.ok) {
        var v0 = KeyLab.verify(g.bin);
        out.push(drow('明文校验', v0.ok ? ('✅ ' + v0.kind) : ('❌ ' + v0.kind), v0.ok ? 'ok' : 'er'));
      }
    }
  }
  out.push('<h4>运行时</h4>');
  out.push(drow('校验统计', '通过 ' + ST.guard.ok + ' · 异常 ' + ST.guard.bad, ST.guard.bad > ST.guard.ok && ST.guard.bad > 0 ? 'er' : 'ok'));
  out.push(drow('取源策略', 'Referer: ' + NetGate.policy, ''));
  out.push(drow('解密管线', ST.selfDecrypt ? '内核接管' : 'hls.js 原生', ''));
  if (ST.hls) {
    try { out.push(drow('缓冲健康', fmtT(ST.hls.latency || 0) + ' 延迟 · 码率 ' + Math.round((ST.hls.bandwidthEstimate || 0) / 1000) + 'kbps', '')); } catch (e) {}
  }
  dgb.innerHTML = out.join('');
}
bdiag.addEventListener('click', runDiag);
$('dgrun').addEventListener('click', runDiag);
$('dgclose').addEventListener('click', function () { diag.hidden = true; });
$('dgcopy').addEventListener('click', async function () {
  try { await navigator.clipboard.writeText(dgb.innerText); toast('已复制诊断报告'); }
  catch (e) { toast('复制失败'); }
});
dch.addEventListener('click', function () {
  dch.classList.toggle('open'); dcb.classList.toggle('open');
});

/* =====================================================================
 * 最近链接
 * ===================================================================== */
var RK = 'vc2_recent';
function renderRecents() {
  var list = [];
  try { list = JSON.parse(localStorage.getItem(RK) || '[]') || []; } catch (e) { list = []; }
  var box = $('recents'); box.innerHTML = '';
  if (!list.length) return;
  list.slice(0, 4).forEach(function (u) {
    var b = document.createElement('button');
    var s = u.length > 46 ? u.slice(0, 24) + '…' + u.slice(-16) : u;
    b.textContent = s; b.title = u;
    b.onclick = function () { urlInput.value = u; loadStream(u); };
    box.appendChild(b);
  });
}
function pushRecent(u) {
  var list = [];
  try { list = JSON.parse(localStorage.getItem(RK) || '[]') || []; } catch (e) { list = []; }
  list = [u].concat(list.filter(function (x) { return x !== u; })).slice(0, 8);
  try { localStorage.setItem(RK, JSON.stringify(list)); } catch (e) {}
  try { localStorage.setItem('vc2_last', u); } catch (e) {}
  renderRecents();
}

/* =====================================================================
 * 启动
 * ===================================================================== */
function boot() {
  updDecBtn(); syncPlay(); renderMarks(); fsIcon(); showCtrl();
  setChip(ENV.crypto ? '就绪' : '就绪（无 WebCrypto）', 'ok');
  renderRecents();
  try { var l = localStorage.getItem('vc2_last'); if (l) urlInput.value = l; } catch (e) {}
  ensureHls().then(function (ok) {
    if (!ok) { setChip('HLS 内核缺失', 'wn'); }
    else updDecBtn();
  });
  console.log('%c VodCore 2 %c 内容一致性守卫已就绪',
    'background:linear-gradient(90deg,#5b8cff,#8b5cf6);color:#fff;padding:3px 8px;border-radius:5px;font-weight:800',
    'color:#5b8cff;font-weight:800');
  console.log('环境', ENV);
}
function doLoad() {
  var u = urlInput.value.trim();
  if (!u) { toast('请粘贴 M3U8 或视频链接'); return; }
  pushRecent(u);
  urlInput.blur();
  loadStream(u);
}
goBtn.addEventListener('click', doLoad);
urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLoad(); });

boot();
})();
</script>
