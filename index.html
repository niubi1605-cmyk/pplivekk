<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08090d">
<title>VodCore 2 · 反盗链增强</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{
  --bg:#08090d;--bg-2:#0f1219;--card:rgba(255,255,255,.028);--card-h:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#eef1f8;--text-2:#a8b0c4;--text-3:#6b7385;
  --brand:#5b8dff;--brand-2:#8b5cf6;--gold:#ffd166;--red:#ff5f5f;--green:#3ddc97;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:22px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  background-image:
    radial-gradient(800px 400px at 50% -10%,rgba(91,141,255,.13),transparent 60%),
    radial-gradient(600px 300px at 100% 100%,rgba(139,92,246,.08),transparent 60%);
}
button,input,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
input{outline:none}

/* ============ 主容器 ============ */
.app{max-width:1080px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;gap:10px;padding:2px 2px}
.logo{width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;box-shadow:0 4px 16px rgba(91,141,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.logo svg{width:18px;height:18px;color:#fff}
.brand{font-weight:800;font-size:16px;letter-spacing:.01em}
.brand em{font-style:normal;color:var(--text-3);font-size:11px;font-weight:600;margin-left:5px;letter-spacing:.04em}
.shield{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  color:var(--green);background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.22);
  padding:4px 9px;border-radius:99px;backdrop-filter:blur(8px)}
.shield i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);
  animation:dot 2s ease-in-out infinite}
@keyframes dot{50%{opacity:.4;transform:scale(.85)}}

/* ============ URL 栏 ============ */
.url-bar{display:flex;gap:8px;position:relative}
.url-bar .field{flex:1;position:relative;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  transition:border-color .2s var(--ease),background .2s var(--ease);
  backdrop-filter:blur(10px)}
.url-bar .field:focus-within{border-color:rgba(91,141,255,.5);background:rgba(91,141,255,.04);
  box-shadow:0 0 0 4px rgba(91,141,255,.08)}
.url-bar .field svg{width:15px;height:15px;color:var(--text-3);margin-left:13px;flex:none;pointer-events:none}
.url-bar input{flex:1;background:none;border:none;color:var(--text);padding:12px 12px;
  font-size:14px;min-width:0}
.url-bar input::placeholder{color:var(--text-3)}
.url-bar .paste{padding:0 12px;color:var(--text-3);font-size:11px;font-weight:600;
  transition:color .15s;height:100%;display:grid;place-items:center}
.url-bar .paste:hover{color:var(--brand)}
.play-btn{padding:0 22px;border-radius:var(--r);font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,var(--brand),#4a7be6);
  box-shadow:0 4px 14px rgba(91,141,255,.28),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .08s var(--ease),box-shadow .2s}
.play-btn:active{transform:scale(.97);box-shadow:0 2px 8px rgba(91,141,255,.25)}

/* ============ 播放器 ============ */
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r-lg);
  overflow:hidden;border:1px solid var(--line);isolation:isolate;
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.player:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none}
.player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:none}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}

/* 播放器状态角标 */
.pbadge{position:absolute;top:10px;left:10px;z-index:6;display:flex;align-items:center;gap:6px;
  background:rgba(10,12,18,.65);border:1px solid rgba(255,255,255,.09);border-radius:99px;
  padding:5px 11px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  backdrop-filter:blur(12px);pointer-events:none;opacity:0;
  transition:opacity .28s var(--ease),transform .28s var(--ease);transform:translateY(-4px);
  max-width:calc(100% - 20px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbadge.show{opacity:1;transform:translateY(0)}
.pbadge i{width:5px;height:5px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);flex:none}
.pbadge i.warn{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.pbadge i.err{background:var(--red);box-shadow:0 0 6px var(--red)}

/* 大播放按钮 */
.bigplay{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.92);
  pointer-events:none;opacity:0;transition:opacity .22s var(--ease);
  background:radial-gradient(circle at center,rgba(0,0,0,.3),transparent 65%)}
.bigplay.show{opacity:1}
.bigplay svg{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7))}

/* 加载环 */
.loader{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);
  z-index:5;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.loader.show{opacity:1}
.loader::after{content:"";width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);border-top-color:var(--brand);
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 控制栏 */
.ctrl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:36px 12px 8px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));
  transition:opacity .25s var(--ease),transform .25s var(--ease);user-select:none;-webkit-user-select:none}
.ctrl.hide{opacity:0;transform:translateY(8px);pointer-events:none}

/* 进度条 */
.pbar{position:relative;height:24px;display:flex;align-items:center;
  cursor:pointer;touch-action:none}
.pbar .track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:3px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.pbar .buf{position:absolute;left:0;top:50%;transform:translateY(-50%);width:0;
  height:3px;border-radius:99px;background:rgba(255,255,255,.24);transition:width .15s linear}
.pbar .played{position:absolute;left:0;top:50%;transform:translateY(-50%);width:0;
  height:3px;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  box-shadow:0 0 10px rgba(91,141,255,.6)}
.pbar .thumb{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px rgba(91,141,255,.35);
  opacity:0;transition:opacity .15s;pointer-events:none}
.pbar:hover .thumb,.pbar.dragging .thumb{opacity:1}
.pbar .marks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:14px;pointer-events:none}
.pbar .marks i{position:absolute;top:0;width:2px;height:14px;border-radius:2px;
  background:var(--gold);transform:translateX(-1px);box-shadow:0 0 6px rgba(255,209,102,.8)}

/* 控制按钮行 */
.ctrl-row{display:flex;align-items:center;gap:4px;margin-top:1px}
.cbtn{background:none;border:none;color:#fff;width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;flex:none;padding:0;
  transition:background .15s var(--ease),transform .08s var(--ease)}
.cbtn:hover{background:rgba(255,255,255,.1)}
.cbtn:active{transform:scale(.92)}
.cbtn svg{width:19px;height:19px;pointer-events:none}
.time{font-variant-numeric:tabular-nums;font-size:11.5px;color:rgba(255,255,255,.82);
  margin-left:4px;white-space:nowrap;pointer-events:none;font-weight:500}
.spacer{flex:1}
.rate{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.1);color:#fff;
  border:none;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s}
.rate:hover{background:rgba(255,255,255,.16)}
.rate option{background:#161b28}

/* ============ 工具栏 ============ */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;
  border-radius:11px;font-size:12.5px;font-weight:700;letter-spacing:.01em;
  border:1px solid transparent;
  transition:transform .08s var(--ease),background .15s var(--ease),box-shadow .2s;
  user-select:none;-webkit-user-select:none;white-space:nowrap}
.tbtn:active{transform:scale(.96)}
.tbtn svg{width:15px;height:15px;flex:none;pointer-events:none}
.tbtn span{pointer-events:none}
.tbtn.flag{color:var(--gold);border-color:rgba(255,209,102,.28);
  background:linear-gradient(180deg,rgba(255,209,102,.13),rgba(255,209,102,.04))}
.tbtn.flag:hover{background:linear-gradient(180deg,rgba(255,209,102,.22),rgba(255,209,102,.08))}
.tbtn.dec{color:#a5b4fc;border-color:rgba(139,92,246,.32);
  background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(139,92,246,.04))}
.tbtn.dec:hover{background:linear-gradient(180deg,rgba(139,92,246,.22),rgba(139,92,246,.08))}
.tbtn.diag{color:#94a3b8;border-color:rgba(148,163,184,.28);
  background:linear-gradient(180deg,rgba(148,163,184,.1),rgba(148,163,184,.03))}
.tbtn.diag:hover{background:linear-gradient(180deg,rgba(148,163,184,.18),rgba(148,163,184,.06))}

.search{flex:1;min-width:150px;display:flex;align-items:center;gap:7px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 12px;height:38px;
  transition:border-color .15s,background .15s;backdrop-filter:blur(10px)}
.search:focus-within{border-color:rgba(91,141,255,.5);background:rgba(91,141,255,.04)}
.search svg{width:14px;height:14px;color:var(--text-3);flex:none;pointer-events:none}
.search input{flex:1;background:none;border:none;color:var(--text);font-size:13px;height:100%;min-width:0}
.search input::placeholder{color:var(--text-3)}

/* ============ 标记列表 ============ */
.marks{display:flex;flex-direction:column;gap:6px}
.mk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:background .15s var(--ease),border-color .15s,transform .1s var(--ease);
  animation:fadeUp .22s var(--ease) both}
.mk:hover{background:var(--card-h);border-color:var(--line-2)}
.mk:active{transform:scale(.995)}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.mk .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 7px rgba(255,209,102,.7);flex:none}
.mk .t{font-size:12.5px;font-weight:800;color:var(--gold);
  background:rgba(255,209,102,.1);border-radius:7px;padding:2px 9px;
  font-variant-numeric:tabular-nums;flex:none}
.mk .title{flex:1;min-width:0;font-size:13.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.mk .del{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);flex:none;padding:0;transition:background .15s,color .15s}
.mk .del:hover{background:rgba(255,95,95,.12);color:var(--red)}
.mk .del svg{width:15px;height:15px;pointer-events:none}
.empty{text-align:center;color:var(--text-3);font-size:12.5px;padding:22px;
  border:1px dashed var(--line);border-radius:var(--r);line-height:1.6}

/* ============ 下载卡片 ============ */
.dl{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(10px);
  transition:border-color .2s var(--ease)}
.dl.active{border-color:rgba(91,141,255,.4)}
.dl-head{display:flex;align-items:center;gap:12px}
.dl-ic{width:42px;height:42px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,rgba(91,141,255,.2),rgba(139,92,246,.12));
  border:1px solid rgba(91,141,255,.22);display:grid;place-items:center;color:#8fb0ff}
.dl-ic svg{width:19px;height:19px}
.dl-info{flex:1;min-width:0}
.dl-title{font-size:14px;font-weight:800}
.dl-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-go{flex:none;border:none;border-radius:11px;padding:10px 20px;
  font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,var(--brand),#4a7be6);
  box-shadow:0 4px 12px rgba(91,141,255,.28),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .08s var(--ease);white-space:nowrap}
.dl-go:active{transform:scale(.96)}
.dl-go:disabled{opacity:.5;cursor:not-allowed;transform:none}
.dl-bar{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.dl-bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  box-shadow:0 0 10px rgba(91,141,255,.5);
  transition:width .2s var(--ease)}
.dl-bar .fill.ind{width:35%!important;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{left:-35%}100%{left:100%}}
.dl-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--text-3);
  font-variant-numeric:tabular-nums}
.dl-stats b{color:var(--text);font-weight:700}
.dl-warn{font-size:11.5px;color:var(--gold);background:rgba(255,209,102,.06);
  border:1px solid rgba(255,209,102,.18);border-radius:10px;padding:9px 11px;
  line-height:1.55;display:none}
.dl-warn.show{display:block}
.dl-actions{display:flex;gap:8px;justify-content:flex-end}
.dl-btn{background:none;border:1px solid var(--line);color:var(--text);padding:7px 13px;
  border-radius:9px;font-size:12px;font-weight:700;transition:background .15s}
.dl-btn:hover{background:rgba(255,255,255,.04)}
.dl-btn.danger{border-color:rgba(255,95,95,.28);color:var(--red)}
.dl-btn.danger:hover{background:rgba(255,95,95,.08)}

/* ============ 弹出菜单 ============ */
.menu{position:fixed;z-index:999;min-width:150px;background:rgba(22,27,40,.98);
  border:1px solid var(--line-2);border-radius:14px;padding:6px;
  box-shadow:0 16px 48px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);animation:menu .16s var(--ease) both}
@keyframes menu{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;
  font-size:13px;color:var(--text);transition:background .12s}
.menu button:hover{background:rgba(255,255,255,.07)}
.menu button.danger{color:var(--red)}
.dec-menu{min-width:250px;max-width:90vw;max-height:70vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dec-head{font-size:10.5px;font-weight:800;color:var(--text-3);padding:8px 12px 6px;
  letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dec-head .badge{font-size:9.5px;color:#a5b4fc;background:rgba(139,92,246,.14);
  padding:2px 7px;border-radius:6px;letter-spacing:0}
.dec-item{padding:9px 12px!important;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.dec-item .dn{font-size:12.5px;font-weight:700;color:var(--text);display:flex;gap:6px;align-items:center}
.dec-item .dd{font-size:10.5px;color:var(--text-3)}
.dec-item.active{background:rgba(91,141,255,.1)}
.dec-item.active .dn{color:#a5b4fc}
.dec-item:disabled{opacity:.35;cursor:not-allowed;background:none!important}
.sep{height:1px;background:var(--line);margin:5px 8px}

/* ============ 诊断面板 ============ */
.diag{position:fixed;left:12px;right:12px;bottom:12px;max-height:72vh;z-index:1001;
  background:rgba(15,18,25,.98);border:1px solid var(--line-2);border-radius:var(--r-lg);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.75);
  backdrop-filter:blur(24px);animation:menu .2s var(--ease) both}
.diag[hidden]{display:none}
.diag-head{display:flex;align-items:center;gap:10px;padding:13px 15px;
  border-bottom:1px solid var(--line)}
.diag-head b{font-size:13.5px;font-weight:800;color:var(--text)}
.diag-head .sub{font-size:11px;color:var(--text-3)}
.diag-close{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--text-3);
  display:grid;place-items:center;transition:background .15s,color .15s}
.diag-close:hover{background:rgba(255,255,255,.06);color:var(--text)}
.diag-close svg{width:16px;height:16px}
.diag-body{padding:14px 15px;overflow-y:auto;font-size:12px;line-height:1.65;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-2)}
.diag-body h4{margin:14px 0 6px;font-size:11px;color:#a5b4fc;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase}
.diag-body h4:first-child{margin-top:0}
.drow{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.drow .k{color:var(--text-3);flex:none;min-width:100px}
.drow .v{flex:1;min-width:0;word-break:break-all;color:var(--text)}
.drow .v.ok{color:var(--green)}
.drow .v.err{color:var(--red)}
.drow .v.warn{color:var(--gold)}
.dpre{background:#050608;border:1px solid rgba(255,255,255,.06);border-radius:9px;
  padding:10px;max-height:170px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  font-size:11px;color:#8b95ac;margin-top:6px;line-height:1.55}
.diag-foot{padding:0 15px 15px;display:flex;gap:8px}
.diag-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:13px;font-weight:700;
  transition:background .15s}
.diag-btn:hover{background:rgba(255,255,255,.04)}
.diag-btn.primary{background:linear-gradient(180deg,var(--brand),#4a7be6);
  border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(91,141,255,.28)}
.diag-btn.primary:hover{filter:brightness(1.05)}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:rgba(22,27,40,.98);border:1px solid var(--line-2);color:var(--text);
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;z-index:1002;max-width:82vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 12px 36px rgba(0,0,0,.55);backdrop-filter:blur(20px);
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 响应式 */
@media (max-width:520px){
  .app{padding:10px 10px calc(20px + env(safe-area-inset-bottom));gap:10px}
  .brand{font-size:15px}
  .tbtn{padding:8px 11px;font-size:12px}
  .play-btn{padding:0 18px;font-size:13.5px}
}
</style>
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>
      </svg>
    </div>
    <div class="brand">VodCore<em>GEN 2</em></div>

const pad = (n) => String(n).padStart(2, '0');
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function fmtBytes(n) {
  if (!isFinite(n) || n <= 0) return '--';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
const fmtSpeed = (b) => (!isFinite(b) || b <= 0) ? '--' : fmtBytes(b) + '/s';
function fmtRemain(s) {

  return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
}

  const isMobile = isIOS || isAndroid || /Mobile|Tablet/i.test(ua);
  const cores = navigator.hardwareConcurrency || 4;
  const memory = navigator.deviceMemory || 4;
  const nativeHlsOk = /maybe|probably/.test(video.canPlayType('application/vnd.apple.mpegurl'));
  const hlsJsOk = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
  const webCryptoOk = !!(window.crypto && window.crypto.subtle);

})();

/* ================= 反防盗链引擎 ================= */
const AntiHotlink = {
  // 所有网络请求的统一入口：强制 no-referrer + omit credentials
  request(url, opts = {}) {
    return fetch(url, {
      method: opts.method || 'GET',
      credentials: 'omit',
      mode: 'cors',
      cache: 'no-store',
      redirect: 'follow',
      referrerPolicy: 'no-referrer',
      signal: opts.signal,
      headers: opts.headers || {}
    });
  },

  // 探测内容类型，判断是否被替换
  async probe(url) {
    // 直链视频跳过
    if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
      return { type: 'direct' };
    }
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 6000);
      const res = await this.request(url, { signal: ctl.signal });
      clearTimeout(t);

      if (!res.ok) {
        return { type: 'http', status: res.status, message: 'HTTP ' + res.status };
      }

      const text = await res.text();
      const head = text.trim().slice(0, 200).toLowerCase();

      // 是 M3U8
      if (/^#EXTM3U/m.test(text.slice(0, 200))) {
        const encMatch = text.match(/#EXT-X-KEY:METHOD=([A-Z0-9-]+)/i);
        return {
          type: 'm3u8',
          encrypted: encMatch ? encMatch[1] : null,
          text,
          redirected: res.redirected,
          finalUrl: res.url,
          length: text.length
        };
      }

      // 是 HTML（可能被替换）
      if (head.startsWith('<!doctype') || head.startsWith('<html') || head.includes('<head>')) {
        return {
          type: 'html',
          message: '服务器返回 HTML 页面，不是 M3U8',
          preview: text.slice(0, 400),
          redirected: res.redirected,
          finalUrl: res.url
        };
      }

      // 是 JSON
      if (head.startsWith('{') || head.startsWith('[')) {
        return {
          type: 'json',
          message: '服务器返回 JSON，可能是 API 接口',
          preview: text.slice(0, 400),
          redirected: res.redirected,
          finalUrl: res.url
        };
      }

      // 二进制或未知
      return {
        type: 'unknown',
        message: '返回内容不是 M3U8',
        preview: text.slice(0, 200),
        redirected: res.redirected,
        finalUrl: res.url
      };
    } catch (e) {
      return { type: 'network', message: e.message || '网络请求失败' };
    }
  }
};

/* ================= UI 辅助 ================= */

/* ================= 进度条（稳定版） ================= */
function getPct(e) {
  const r = pbar.getBoundingClientRect();
  if (!r.width) return 0;
  const x = (e.clientX != null ? e.clientX : 0) - r.left;
  return Math.max(0, Math.min(1, x / r.width));
}
function renderPct(p) {

  thumb.style.left = (p * 100) + '%';

function updateTime() {
  if (isFinite(video.duration) && video.duration > 0) {
    timeText.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  } else {
    timeText.textContent = fmtTime(video.currentTime) + ' / --:--';
  }

// 主循环
function loop() {
  if (!dragging) {
    const d = video.duration;
    if (isFinite(d) && d > 0) {
      const p = video.currentTime / d;
      playedBar.style.width = (p * 100) + '%';
      thumb.style.left = (p * 100) + '%';
    }
    updateTime();
    let bufEnd = 0;
    try {
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= video.currentTime &&
            video.currentTime <= video.buffered.end(i)) {
          bufEnd = video.buffered.end(i);
          break;
        }
      }
    } catch (e) {}
    if (isFinite(d) && d > 0) bufBar.style.width = (bufEnd / d * 100) + '%';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

[0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5, 6, 7, 8, 10, 12, 15, 18].forEach((s) => {

/* ================= 解码配置 ================= */
const DECS = {
  auto:   { name: '智能解码', desc: '自动选择最优', auto: true },
  boost:  { name: '疾速 Turbo', desc: '高并发快速起播', hls: {
    enableWorker: true, maxBufferLength: 90, maxMaxBufferLength: 200, backBufferLength: 60,
    startLevel: -1, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6 } },
  hw:     { name: '硬件加速', desc: 'GPU 硬解省电', hls: {
    enableWorker: true, enableSoftwareAES: false, capLevelToPlayerSize: true, startLevel: -1 } },
  sw:     { name: '软件解码', desc: '主线程软解兼容强', hls: {
    enableWorker: false, enableSoftwareAES: true, startLevel: -1, maxBufferLength: 60 } },
  smooth: { name: '流畅优先', desc: '大缓冲长片首选', hls: {
    enableWorker: true, maxBufferLength: 120, maxMaxBufferLength: 300, backBufferLength: 180, startLevel: -1 } },
  compat: { name: '兼容模式', desc: '弱网老旧设备', hls: {
    enableWorker: false, enableSoftwareAES: true, maxBufferLength: 30, backBufferLength: 30,
    manifestLoadingMaxRetry: 8, levelLoadingMaxRetry: 8, fragLoadingMaxRetry: 10, startLevel: -1 } },
  secure: { name: '加密增强', desc: 'AES 加密流专用', hls: {
    enableWorker: true, enableSoftwareAES: true, maxBufferLength: 60, backBufferLength: 60,
    startLevel: -1, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6 } },
  native: { name: '原生解码', desc: 'Safari / iOS 最佳', native: true }
};
const DEC_ORDER = ['auto','boost','hw','sw','smooth','compat','secure','native'];
let currentDec = 'auto';
try { const s = localStorage.getItem('vodcore_dec_gen2'); if (s && DECS[s]) currentDec = s; } catch (e) {}

function pickAutoDec() {
  if (ENV.isIOS) return ENV.nativeHlsOk ? 'native' : 'compat';
  if (ENV.isSafari && !ENV.isMobile) return ENV.nativeHlsOk ? 'native' : (ENV.hlsJsOk ? 'hw' : 'compat');
  if (!ENV.hlsJsOk) return ENV.nativeHlsOk ? 'native' : 'compat';
  if (ENV.lowEnd) return 'compat';
  if (ENV.isMobile) return 'smooth';
  return 'boost';
}
function resolveDec(k) {
  if (DECS[k] && DECS[k].auto) {
    const p = pickAutoDec();
    return DECS[p] ? p : 'compat';
  }
  return DECS[k] ? k : 'compat';
}

/* ================= 加载视频 ================= */
async function loadStream(url, resumeAt) {
  url = (url || '').trim();
  if (!url) { toast('请输入链接'); return; }
  resumeAt = resumeAt || 0;

  currentUrl = url;
  marks = (store[url] || []).slice();
  renderMarks();
  renderMarksLayer();

  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  retries = 0;
  hasSource = true;

  try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}

  showLoaderNow();

  // 内容探测
  const probe = await AntiHotlink.probe(url);

  if (probe.type === 'html' || probe.type === 'json' || probe.type === 'unknown') {
    hideLoader();
    setBadge('⚠️ 返回内容异常', 'err');
    toast('警告：' + probe.message);
    showDiag(buildDiagHtml(url, probe));
    return;
  }
  if (probe.type === 'http' || probe.type === 'network') {
    hideLoader();
    setBadge('⚠️ ' + (probe.message || '加载失败'), 'err');
    toast('加载失败：' + (probe.message || '网络失败'));
    showDiag(buildDiagHtml(url, probe));
    return;
  }
  if (probe.redirected && probe.finalUrl && probe.finalUrl !== url) {
    console.warn('[VodCore] URL 被重定向：', url, '→', probe.finalUrl);
  }

  const decKey = resolveDec(currentDec);
  const dec = DECS[decKey] || DECS.compat;
  const isDirect = probe.type === 'direct';
  const useHlsJs = !isDirect && ENV.hlsJsOk && !dec.native;
  const mode = probe.encrypted ? 'warn' : '';
  const encLabel = probe.encrypted ? ' · ' + probe.encrypted : '';
  setBadge('VodCore · ' + (isDirect ? '直链' : dec.name) + encLabel, mode);

  if (currentDec === 'auto' && !isDirect) toast('智能解码 → ' + dec.name);

  if (useHlsJs) loadHls(url, dec, resumeAt);
  else if (ENV.nativeHlsOk || isDirect) loadNative(url, resumeAt);
  else {
    hideLoader();
    setBadge('无可用解码', 'err');
    toast('请点击「解码」切换');
  }
}

function loadHls(url, dec, resumeAt) {
  const baseCfg = {
    enableWorker: true,
    lowLatencyMode: false,
    backBufferLength: 60,
    maxBufferLength: 60,
    maxMaxBufferLength: 180,
    manifestLoadingMaxRetry: 4,
    levelLoadingMaxRetry: 4,
    fragLoadingMaxRetry: 6,
    manifestLoadingTimeOut: 20000,
    levelLoadingTimeOut: 20000,
    fragLoadingTimeOut: 30000,
    startLevel: -1,
    // 反防盗链：所有 XHR 不走凭据
    xhrSetup: (xhr) => { try { xhr.withCredentials = false; } catch (e) {} },
    // 反防盗链：所有 fetch 请求强制 no-referrer
    fetchSetup: (context, initParams) => {
      initParams.referrerPolicy = 'no-referrer';
      initParams.credentials = 'omit';
      return new Request(context.url, initParams);
    }
  };
  const cfg = Object.assign(baseCfg, dec.hls || {});
  let h;
  try { h = new window.Hls(cfg); }
  catch (e) {
    hideLoader();
    setBadge('内核启动失败', 'err');
    toast('HLS 启动失败：' + e.message);
    return;
  }
  hls = h;

  h.on(window.Hls.Events.KEY_LOADING, () => setBadge('VodCore · 解密中…', 'warn'));
  h.on(window.Hls.Events.KEY_LOADED, () => setBadge('VodCore · 已解密', 'warn'));

  h.on(window.Hls.Events.MANIFEST_PARSED, () => {
    hideLoader();
    if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
    video.play().catch(() => {});
  });

  h.on(window.Hls.Events.ERROR, (evt, data) => {
    if (!data.fatal) return;
    if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && retries < 4) {
      retries++;
      toast('网络抖动，重试 (' + retries + '/4)…');
      try { h.startLoad(); } catch (e) {}
      return;
    }
    if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && retries < 4) {
      retries++;
      toast('解码恢复 (' + retries + '/4)…');
      try { h.recoverMediaError(); } catch (e) {}
      return;
    }
    if (data.details && /key/i.test(data.details)) {
      hideLoader();
      setBadge('⚠️ 解密失败', 'err');
      toast('解密失败：' + data.details);
      return;
    }
    if (retries >= 4 && currentDec !== 'compat') {
      toast('多次失败，降级至兼容模式…');
      currentDec = 'compat';
      try { localStorage.setItem('vodcore_dec_gen2', 'compat'); } catch (e) {}
      updateDecBtn();
      loadStream(currentUrl, video.currentTime || 0);
      return;
    }
    hideLoader();
    setBadge('⚠️ 播放失败', 'err');
    toast('播放失败：' + (data.details || '未知错误'));
  });

  h.loadSource(url);
  h.attachMedia(video);
}

function loadNative(url, resumeAt) {
  try { video.referrerPolicy = 'no-referrer'; } catch (e) {}

  const onMeta = () => {
    video.removeEventListener('loadedmetadata', onMeta);
    hideLoader();
    setBadge('VodCore · 原生解码', '');
    if (resumeAt > 0) { try { video.currentTime = resumeAt; } catch (e) {} }
    video.play().catch(() => {});
  };
  video.addEventListener('loadedmetadata', onMeta);

  const onErr = () => {
    video.removeEventListener('error', onErr);
    hideLoader();
    setBadge('原生失败', 'err');
    if (currentDec !== 'compat' && ENV.hlsJsOk) {
      toast('原生失败，切 HLS 内核…');
      currentDec = 'compat';
      try { localStorage.setItem('vodcore_dec_gen2', 'compat'); } catch (e) {}
      updateDecBtn();
      loadStream(currentUrl, video.currentTime || 0);
    } else {
      toast('原生解码失败，请点击「解码」切换');
    }
  };
  video.addEventListener('error', onErr, { once: true });

  video.src = url;
}

/* ================= 解密引擎 ================= */
const KeyCache = new Map();
function hexToBytes(h) {
  h = String(h).replace(/^0x/i, '').replace(/[^0-9a-f]/gi, '');
  if (h.length % 2) h = '0' + h;
  const b = new Uint8Array(h.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16);
  if (b.length === 16) return b;
  const p = new Uint8Array(16);
  p.set(b.slice(0, 16));
  return p;
}
function deriveIV(k, seq) {
  if (k && k.iv) return hexToBytes(k.iv);
  const iv = new Uint8Array(16);
  new DataView(iv.buffer).setUint32(12, seq >>> 0, false);
  return iv;
}
function normalizeKey(k) {
  if (k.length === 16 || k.length === 24 || k.length === 32) return k;
  if (k.length > 16) return k.slice(0, 16);
  const p = new Uint8Array(16); p.set(k); return p;
}
async function getKeyBytes(uri, signal) {
  if (KeyCache.has(uri)) return KeyCache.get(uri);
  const p = (async () => {
    const res = await AntiHotlink.request(uri, { signal });
    if (!res.ok) throw new Error('密钥 HTTP ' + res.status);
    return new Uint8Array(await res.arrayBuffer());
  })();
  KeyCache.set(uri, p);
  try { return await p; }
  catch (e) { KeyCache.delete(uri); throw e; }
}
async function aesCbc(data, kb, iv) {
  if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用（需 HTTPS）');
  if (!data.length) return data;
  if (data.length % 16 !== 0) {
    const a = data.length - (data.length % 16);
    if (!a) throw new Error('密文长度不足');
    data = data.slice(0, a);
  }
  const key = await crypto.subtle.importKey('raw', normalizeKey(kb), { name: 'AES-CBC' }, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, data);
  return new Uint8Array(out);
}
async function aesCtr(data, kb, counter) {
  if (!ENV.webCryptoOk) throw new Error('WebCrypto 不可用');
  if (!data.length) return data;
  const key = await crypto.subtle.importKey('raw', normalizeKey(kb), { name: 'AES-CTR' }, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-CTR', counter, length: 64 }, key, data);
  return new Uint8Array(out);
}
async function decryptSegment(data, kInfo, seq, signal) {
  if (!kInfo || !kInfo.method || kInfo.method.toUpperCase() === 'NONE') return data;
  const m = kInfo.method.toUpperCase();
  if (kInfo.keyFormat && kInfo.keyFormat !== 'identity') {
    throw new Error('不支持 ' + kInfo.keyFormat + ' 加密（DRM）');
  }
  if (m === 'AES-128' || m === 'AES-192' || m === 'AES-256') {
    const kb = await getKeyBytes(kInfo.uri, signal);
    return aesCbc(data, kb, deriveIV(kInfo, seq));
  }
  if (m === 'SAMPLE-AES-CTR') {
    const kb = await getKeyBytes(kInfo.uri, signal);
    return aesCtr(data, kb, deriveIV(kInfo, seq));
  }
  if (m === 'SAMPLE-AES') {
    const kb = await getKeyBytes(kInfo.uri, signal);
    return aesCbc(data, kb, deriveIV(kInfo, seq));
  }
  throw new Error('未知加密：' + m);
}

/* ================= M3U8 解析 ================= */
function parseM3U8(text, baseUrl) {
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (!lines[0] || lines[0].indexOf('#EXTM3U') !== 0) throw new Error('缺少 #EXTM3U 头');
  const r = { isMaster: false, variants: [], segments: [], initSegment: null, encMethods: new Set() };
  const resolve = (u) => { try { return new URL(u, baseUrl).href; } catch (e) { return u; } };
  const parseAttrs = (line) => {
    const a = {};
    const re = /([A-Z0-9-]+)=("([^"]*)"|[^,]*)/gi;
    let m;
    while ((m = re.exec(line)) !== null) {
      a[m[1].toUpperCase()] = m[3] !== undefined ? m[3] : m[2].trim();
    }
    return a;
  };
  let ck = null, cbr = null, pd = -1, pi = null, seq = 0, lbe = 0;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (!l) continue;
    if (l[0] !== '#') {
      const uri = resolve(l);
      if (pi) { r.variants.push(Object.assign({ url: uri }, pi)); pi = null; continue; }
      if (pd >= 0) {
        r.segments.push({ url: uri, duration: pd, key: ck, sequence: seq, byteRange: cbr });
        seq++; pd = -1; cbr = null;
      }
      continue;
    }
    if (l.indexOf('#EXT-X-MEDIA-SEQUENCE:') === 0) {
      seq = parseInt(l.split(':')[1], 10) || 0;
    } else if (l.indexOf('#EXT-X-STREAM-INF:') === 0) {
      r.isMaster = true;
      const a = parseAttrs(l);
      pi = { bandwidth: parseInt(a.BANDWIDTH, 10) || 0, resolution: a.RESOLUTION || '', name: a.NAME || '' };
    } else if (l.indexOf('#EXT-X-KEY:') === 0) {
      const a = parseAttrs(l);
      const method = (a.METHOD || '').toUpperCase();
      if (!method || method === 'NONE') ck = null;
      else {
        ck = { method, uri: a.URI ? resolve(a.URI) : null, iv: a.IV || null, keyFormat: a.KEYFORMAT || 'identity' };
        r.encMethods.add(method);
      }
    } else if (l.indexOf('#EXT-X-MAP:') === 0) {
      const a = parseAttrs(l);
      if (a.URI) r.initSegment = { url: resolve(a.URI), key: ck };
    } else if (l.indexOf('#EXT-X-BYTERANGE:') === 0) {
      const p = l.split(':')[1].split('@');
      const len = parseInt(p[0], 10);
      let off;
      if (p[1] !== undefined) { off = parseInt(p[1], 10); lbe = off + len; }
      else if (lbe > 0) { off = lbe; lbe = off + len; }
      else { off = 0; lbe = len; }
      cbr = { length: len, offset: off };
    } else if (l.indexOf('#EXTINF:') === 0) {
      const rest = l.substring(8);
      const ci = rest.indexOf(',');
      pd = parseFloat(ci >= 0 ? rest.substring(0, ci) : rest) || 0;
    }
  }
  return r;
}

/* ================= 下载内核 ================= */
const Downloader = {
  active: false, ctrl: null,
  stats: { start: 0, downloaded: 0, total: 0, done: 0, segs: 0, speed: 0 },

  isActive() { return this.active; },
  cancel() { if (this.ctrl) { try { this.ctrl.abort(); } catch (e) {} toast('取消中…'); } },
  reset() { this.setWarn(''); this.setState('idle'); },

  setSub(t) { dlSub.textContent = t; },
  setWarn(m) {
    if (m) { dlWarn.innerHTML = m; dlWarn.classList.add('show'); }
    else dlWarn.classList.remove('show');
  },
  setState(s, info) {
    info = info || {};
    if (s === 'idle') {
      dlProg.hidden = true;
      dlGo.disabled = false;
      dlGo.textContent = '开始下载';
      dlCard.classList.remove('active');
      this.setSub(info.sub || 'M3U8 · AES-128/192/256 · fMP4 · 直链');
    } else if (s === 'prep') {
      dlCard.classList.add('active');
      dlProg.hidden = false;
      dlGo.disabled = true;
      dlGo.textContent = '准备中';
      dlFill.classList.add('ind');
      dlFill.style.width = '';
      dlPct.textContent = '0%'; dlSpd.textContent = '--';
      dlRem.textContent = '--'; dlSize.textContent = '--';
      dlCancel.disabled = false; dlCancel.textContent = '取消下载';
      this.setSub(info.sub || '解析中…');
    } else if (s === 'dl') {
      dlCard.classList.add('active');
      dlProg.hidden = false;
      dlGo.disabled = true;
      dlGo.textContent = '下载中';
      dlFill.classList.remove('ind');
      dlCancel.disabled = false;
      this.setSub(info.sub || '下载中…');
    } else if (s === 'merge') {
      dlCard.classList.add('active');
      dlProg.hidden = false;
      dlFill.classList.add('ind');
      dlGo.disabled = true;
      dlGo.textContent = '合并中';
      dlCancel.disabled = true;
      this.setSub(info.sub || '合并中…');
    } else if (s === 'done') {
      dlCard.classList.remove('active');
      dlGo.disabled = false;
      dlGo.textContent = '重新下载';
      dlFill.classList.remove('ind');
      dlFill.style.width = '100%';
      dlPct.textContent = '100%';
      dlCancel.disabled = true;
      dlCancel.textContent = '已完成';
      this.setSub(info.sub || '已保存');
    } else if (s === 'err') {
      dlCard.classList.remove('active');
      dlGo.disabled = false;
      dlGo.textContent = '重试';
      dlFill.classList.remove('ind');
      dlCancel.disabled = true;
      this.setSub('下载失败');
    } else if (s === 'cancel') {
      dlCard.classList.remove('active');
      dlProg.hidden = true;
      dlGo.disabled = false;
      dlGo.textContent = '重新下载';
      this.setSub('已取消');
    }
  },
  updateProgress() {
    const s = this.stats;
    const el = (Date.now() - s.start) / 1000;
    const sp = el > 0 ? s.downloaded / el : 0;
    s.speed = sp;
    let p = 0;
    if (s.segs) p = s.done / s.segs;
    else if (s.total) p = s.downloaded / s.total;
    dlFill.style.width = (p * 100).toFixed(1) + '%';
    dlPct.textContent = (p * 100).toFixed(1) + '%';
    dlSpd.textContent = fmtSpeed(sp);
    dlSize.textContent = fmtBytes(s.downloaded);
    if (sp > 0 && s.segs && s.done > 0) {
      const avg = s.downloaded / s.done;
      dlRem.textContent = fmtRemain((s.segs - s.done) * avg / sp);
    } else if (sp > 0 && s.total) {
      dlRem.textContent = fmtRemain((s.total - s.downloaded) / sp);
    } else dlRem.textContent = '--';
  },
  async fetchBin(url, signal, br) {
    const opts = { signal };
    if (br && br.length) {
      const st = br.offset || 0;
      opts.headers = { Range: `bytes=${st}-${st + br.length - 1}` };
    }
    const res = await AntiHotlink.request(url, opts);
    if (!res.ok && res.status !== 206) throw new Error('HTTP ' + res.status);
    return new Uint8Array(await res.arrayBuffer());
  },
  async fetchText(url, signal) {
    const res = await AntiHotlink.request(url, { signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return { text: await res.text(), finalUrl: res.url };
  },
  async resolvePlaylist(url, signal, depth) {
    depth = depth || 0;
    if (depth > 5) throw new Error('M3U8 嵌套过深');
    const { text, finalUrl } = await this.fetchText(url, signal);
    if (!/^\s*#EXTM3U/i.test(text)) throw new Error('返回的不是 M3U8（可能被替换）');
    const pl = parseM3U8(text, finalUrl);
    if (pl.isMaster) {
      if (!pl.variants.length) throw new Error('Master 无可用流');
      pl.variants.sort((a, b) => {
        const sa = (a.resolution || '0x0').split('x').reduce((x, y) => x * (parseInt(y, 10) || 0), 1) || 0;
        const sb = (b.resolution || '0x0').split('x').reduce((x, y) => x * (parseInt(y, 10) || 0), 1) || 0;
        if (sb !== sa) return sb - sa;
        return (b.bandwidth || 0) - (a.bandwidth || 0);
      });
      const best = pl.variants[0];
      this.setState('prep', { sub: '已选流 ' + (best.resolution || best.name || '默认') + '，继续解析…' });
      return this.resolvePlaylist(best.url, signal, depth + 1);
    }
    return pl;
  },
  async start(url) {
    if (this.active) { toast('已有下载任务'); return; }
    if (!url) { toast('请先输入链接'); return; }

    if (!ENV.webCryptoOk) {
      this.setWarn('⚠️ 当前环境不支持 WebCrypto（需 HTTPS），加密流将无法解密。');
    } else this.setWarn('');

    this.active = true;
    this.ctrl = new AbortController();
    this.stats = { start: Date.now(), downloaded: 0, total: 0, done: 0, segs: 0, speed: 0 };
    KeyCache.clear();
    this.setState('prep', { sub: '解析中…' });
    const signal = this.ctrl.signal;

    try {
      if (/\.(mp4|webm|ogg|ogv|mov|m4v|flv|mkv|avi|wmv|3gp)(\?|#|$)/i.test(url)) {
        await this.dlDirect(url, signal);
      } else {
        await this.dlM3U8(url, signal);
      }
    } catch (e) {
      if (signal.aborted || e.name === 'AbortError') {
        this.setState('cancel'); toast('已取消');
      } else {
        console.error('[DL]', e);
        this.setState('err');
        const m = e.message || '未知错误';
        let h = '⚠️ ' + m;
        if (/Failed to fetch|NetworkError|Load failed/i.test(m)) {
          h = '⚠️ 网络请求被阻止（CORS 跨域）。<br>目标服务器未开放跨域访问，浏览器端无法绕过。<br>请用「诊断」查看链接实际返回的内容。';
        } else if (/不是 M3U8|HTML/i.test(m)) {
          h = '⚠️ ' + m + '<br>请用「诊断」查看服务器实际返回的内容。';
        } else if (/WebCrypto/i.test(m)) {
          h = '⚠️ ' + m + '<br>请使用 HTTPS 部署本页面。';
        }
        this.setWarn(h);
        toast('下载失败：' + m);
      }
    } finally {
      this.active = false; this.ctrl = null;
    }
  },
  async dlDirect(url, signal) {
    this.setState('dl', { sub: '下载文件…' });
    const res = await AntiHotlink.request(url, { signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    this.stats.total = parseInt(res.headers.get('content-length') || '0', 10);
    if (!res.body) throw new Error('响应无 body');
    const chunks = [];
    const reader = res.body.getReader();
    let got = 0, last = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      this.stats.downloaded = got;
      const now = Date.now();
      if (now - last > 180) { last = now; this.updateProgress(); }
    }
    this.stats.downloaded = got;
    this.updateProgress();
    this.setState('merge', { sub: '保存中…' });
    const ext = (url.match(/\.(mp4|webm|mov|m4v|mkv|flv|avi|wmv|3gp)(\?|#|$)/i) || [, 'mp4'])[1];
    const blob = new Blob(chunks, { type: 'video/' + ext });
    saveBlob(blob, guessName(url, ext));
    this.setState('done', { sub: '已保存 · ' + fmtBytes(blob.size) });
    toast('下载完成 · ' + fmtBytes(blob.size));
  },
  async dlM3U8(url, signal) {
    const pl = await this.resolvePlaylist(url, signal);
    if (!pl.segments.length) throw new Error('未找到视频分片');

    const methods = new Set();
    if (pl.initSegment && pl.initSegment.key) methods.add(pl.initSegment.key.method);
    pl.segments.forEach((s) => { if (s.key) methods.add(s.key.method); });
    if (methods.has('SAMPLE-AES')) {
      throw new Error('SAMPLE-AES 需容器级解析，浏览器端无法完成');
    }

    const encLabel = methods.size ? Array.from(methods).join('+') : '未加密';
    const isFMP4 = !!pl.initSegment;
    const ext = isFMP4 ? 'mp4' : 'ts';
    const mime = isFMP4 ? 'video/mp4' : 'video/mp2t';
    const total = pl.segments.length;
    this.stats.segs = total;
    this.setState('dl', { sub: `共 ${total} 段 · ${encLabel}` });

    const chunks = new Array(total);
    const conc = Math.max(4, Math.min(8, ENV.cores || 4));
    let nextIdx = 0, done = 0, last = 0;
    const self = this;

    const worker = async () => {
      while (true) {
        if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const i = nextIdx++;
        if (i >= total) return;
        const seg = pl.segments[i];
        let att = 0, lastErr;
        while (att < 3) {
          try {
            let data = await self.fetchBin(seg.url, signal, seg.byteRange);
            if (seg.key && seg.key.method && seg.key.method.toUpperCase() !== 'NONE') {
              data = await decryptSegment(data, seg.key, seg.sequence, signal);
            }
            chunks[i] = data;
            lastErr = null;
            break;
          } catch (err) {
            lastErr = err;
            att++;
            if (att >= 3 || signal.aborted) throw err;
            await new Promise((r) => setTimeout(r, 300 * att));
          }
        }
        if (lastErr) throw lastErr;
        done++;
        self.stats.done = done;
        self.stats.downloaded += chunks[i].byteLength;
        const now = Date.now();
        if (now - last > 180) {
          last = now;
          self.updateProgress();
          dlSub.textContent = `共 ${total} 段 · ${encLabel} · ${done}/${total}`;
        }
      }
    };
    const workers = [];
    for (let i = 0; i < conc; i++) workers.push(worker());
    await Promise.all(workers);
    self.updateProgress();

    let initData = null;
    if (pl.initSegment) {
      this.setState('merge', { sub: '处理初始化段…' });
      initData = await this.fetchBin(pl.initSegment.url, signal, null);
      if (pl.initSegment.key && pl.initSegment.key.method && pl.initSegment.key.method.toUpperCase() !== 'NONE') {
        initData = await decryptSegment(initData, pl.initSegment.key, 0, signal);
      }
    }

    this.setState('merge', { sub: `合并 ${total} 个分片…` });
    const parts = [];
    if (initData) parts.push(initData);
    for (let i = 0; i < total; i++) if (chunks[i]) parts.push(chunks[i]);

    const blob = new Blob(parts, { type: mime });
    saveBlob(blob, guessName(url, ext));
    this.setState('done', { sub: '已保存 · ' + fmtBytes(blob.size) });
    toast('下载完成 · ' + fmtBytes(blob.size));
  }
};
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
function guessName(url, ext) {
  try {
    const u = new URL(url);
    let n = decodeURIComponent((u.pathname.split('/').pop() || 'video').split('?')[0]);
    const d = n.lastIndexOf('.');
    if (d > 0) n = n.substring(0, d);
    n = n.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || 'video';
    return n + '_' + Date.now() + '.' + ext;
  } catch (e) { return 'vodcore_' + Date.now() + '.' + ext; }
}

dlGo.addEventListener('click', () => {
  if (Downloader.isActive()) { toast('已有下载任务'); return; }
  const u = currentUrl || urlInput.value.trim();
  if (!u) { toast('请先输入链接'); return; }
  Downloader.start(u);
});
dlCancel.addEventListener('click', () => { if (Downloader.isActive()) Downloader.cancel(); });

/* ================= 诊断 ================= */
function diagRow(k, v, cls) {
  return '<div class="drow"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
}
function buildDiagHtml(url, probe) {
  const out = [];
  out.push('<h4>基本信息</h4>');
  out.push(diagRow('URL', esc(url)));
  out.push(diagRow('时间', esc(new Date().toLocaleString())));
  out.push(diagRow('Referrer', 'no-referrer ✅', 'ok'));
  out.push(diagRow('Credentials', 'omit ✅', 'ok'));
  out.push(diagRow('Cache', 'no-store ✅', 'ok'));
  out.push('<h4>响应分析</h4>');
  out.push(diagRow('内容类型', esc(probe.type)));
  if (probe.status) out.push(diagRow('HTTP 状态', probe.status, probe.status === 200 ? 'ok' : 'err'));
  if (probe.redirected !== undefined) out.push(diagRow('重定向', probe.redirected ? '⚠️ 是' : '否', probe.redirected ? 'warn' : 'ok'));
  if (probe.finalUrl && probe.finalUrl !== url) out.push(diagRow('最终 URL', esc(probe.finalUrl), 'warn'));
  if (probe.encrypted !== undefined) out.push(diagRow('加密方式', probe.encrypted || '无', probe.encrypted ? 'warn' : 'ok'));
  if (probe.length) out.push(diagRow('内容长度', probe.length + ' 字符'));
  if (probe.message) out.push(diagRow('说明', esc(probe.message)));
  if (probe.preview) {
    out.push('<h4>内容预览（前 400 字符）</h4>');
    out.push('<div class="dpre">' + esc(probe.preview) + '</div>');
  }
  out.push('<h4>判定</h4>');
  if (probe.type === 'm3u8') {
    out.push(diagRow('结论', '✅ 有效的 M3U8 播放列表', 'ok'));
    if (probe.encrypted) out.push(diagRow('加密', '检测到 ' + probe.encrypted + ' 加密，播放时自动解密', 'warn'));
  } else if (probe.type === 'html') {
    out.push(diagRow('结论', '❌ 返回网页，不是视频源', 'err'));
    out.push(diagRow('说明', '你复制的可能是"播放页 URL"。请在浏览器 F12 → Network 面板，找到真正以 .m3u8 结尾的请求地址'));
  } else if (probe.type === 'json') {
    out.push(diagRow('结论', '❌ 返回 JSON，可能是 API 接口', 'err'));
    out.push(diagRow('说明', '需要从 JSON 里提取真正的 m3u8 地址'));
  } else if (probe.type === 'http') {
    out.push(diagRow('结论', '❌ 服务器返回错误状态', 'err'));
    out.push(diagRow('说明', '链接可能已失效，或需要登录 / 鉴权参数'));
  } else if (probe.type === 'network') {
    out.push(diagRow('结论', '❌ 网络请求失败（通常是 CORS）', 'err'));
    out.push(diagRow('说明', '目标服务器未开放跨域访问，浏览器安全限制无法绕过'));
  } else {
    out.push(diagRow('结论', '⚠️ 未知内容类型', 'warn'));
  }
  return out.join('');
}
function showDiag(html) {
  diagBody.innerHTML = html;
  diagPanel.hidden = false;
}
async function runDiag() {
  const url = currentUrl || urlInput.value.trim();
  if (!url) { toast('请先输入链接'); return; }
  diagBody.innerHTML = '<div style="color:var(--text-3)">诊断中…</div>';
  diagPanel.hidden = false;
  diagSub.textContent = '正在请求…';
  const probe = await AntiHotlink.probe(url);
  diagSub.textContent = new Date().toLocaleTimeString();
  diagBody.innerHTML = buildDiagHtml(url, probe);
}
diagBtn.addEventListener('click', runDiag);
diagRun.addEventListener('click', runDiag);
diagClose.addEventListener('click', () => { diagPanel.hidden = true; });
diagCopy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(diagBody.innerText);
    toast('已复制');
  } catch (e) { toast('复制失败'); }
});

/* ================= URL 输入 ================= */
pasteBtn.addEventListener('click', async () => {

    const t = await navigator.clipboard.readText();

});

/* ================= 键盘快捷键 ================= */
document.addEventListener('keydown', (e) => {
  const t = (e.target.tagName || '').toUpperCase();
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); showCtrl(); }
  else if (e.code === 'ArrowRight') { video.currentTime = Math.min((video.duration || 0) - 0.05, video.currentTime + 5); showCtrl(); }
  else if (e.code === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 5); showCtrl(); }
  else if (e.key === 'm' || e.key === 'M') addMark();
  else if (e.key === 'f' || e.key === 'F') { isFullscreen() ? exitFs() : enterFs(); }
});

renderMarks();
updateDecBtn();
updateFsIcon();
showCtrl();

try { lastUrl = localStorage.getItem('vodcore_last_gen2') || ''; } catch (e) {}
if (lastUrl) urlInput.value = lastUrl;

  '%cVodCore GEN 2 %c反盗链引擎已就绪',

  'color:#5b8dff;font-weight:700;'
);
console.log('环境：', ENV);
console.log('Referrer Policy：no-referrer（全局）');
console.log('Credentials：omit（全局）');
console.log('WebCrypto：', ENV.webCryptoOk ? '✅ 可用' : '❌ 需 HTTPS');
console.log('智能解码推荐：', pickAutoDec());

})();
